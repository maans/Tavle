  w.data=w.data||{};
  if(!ds){
    ds={
      id:w.data.datasetId||uid(),
      name:String(w.title||'Datasæt').replace(/^📊\s*/,'')||'Nyt datasæt',
      columns:['Navn','Gruppe'],
      rows:[['Eksempel','A'],['Eksempel 2','B']],
      type:'table',
      sourceName:'Demo',
      importedAt:Date.now()
    };
    updateDatasetInState(ds);
    w.data.datasetId=ds.id;
  }

  ds.columns=Array.isArray(ds.columns)&&ds.columns.length?ds.columns.map((x,i)=>safe87DecodeCell(x||('Kolonne '+(i+1)))):['Kolonne 1'];
  ds.rows=Array.isArray(ds.rows)?ds.rows:[];
  const colCount=Math.max(ds.columns.length,...ds.rows.map(r=>Array.isArray(r)?r.length:0),1);
  while(ds.columns.length<colCount)ds.columns.push('Kolonne '+(ds.columns.length+1));
  ds.rows=ds.rows.map(r=>{
    const a=Array.isArray(r)?r.slice(0,colCount):[];
    while(a.length<colCount)a.push('');
    return a.map(x=>safe87DecodeCell(x));
  });
  if(!ds.rows.length)ds.rows=[Array.from({length:ds.columns.length},()=> '')];

  function commit(){
    updateDatasetInState(ds);
    w.data.datasetId=ds.id;
    w.data.datasetView=false;
    try{w.data.text=datasetToDelimitedText(ds,'\t')}catch(e){}
    save();
  }

  c.className='content text datasetTextWidget';
  const head=ds.columns.map((col,i)=>`
    <th><div class="safe85ColHead">
      <input data-safe85-head="${i}" value="${esc(safe87DecodeCell(col))}" aria-label="Kolonne ${i+1}">
      <button type="button" class="safe85Minus" data-safe85-del-col="${i}" title="Slet kolonne">−</button>
    </div></th>`).join('');
  const body=ds.rows.map((row,ri)=>`
    <tr>
      <td><div class="safe85RowHead"><span class="safe85RowNo">${ri+1}</span><button type="button" class="safe85Minus" data-safe85-del-row="${ri}" title="Slet række">−</button></div></td>
      ${ds.columns.map((_,ci)=>`<td><input data-safe85-cell="${ri}:${ci}" value="${esc(safe87DecodeCell(row[ci]||''))}" aria-label="Række ${ri+1}, kolonne ${ci+1}"></td>`).join('')}
    </tr>`).join('');

  c.innerHTML=`
    <div class="safe85DatasetEditor">
      <div class="safe85DatasetTools">
        <b>📊 ${esc(ds.name||'Datasæt')}</b>
        <button type="button" data-safe85-add-row>+ række</button>
        <button type="button" data-safe85-add-col>+ kolonne</button>
        <small>${ds.rows.length} rækker · ${ds.columns.length} kolonner</small>
      </div>
      <div class="safe85DatasetWrap">
        <table class="safe85DatasetTable">
          <thead><tr><th></th>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;

  // SAFE86: Direkte intern event-delegering.
  // Nogle widget-drag/selection-handlere kan opsluge knapklik i redigeringsområdet.
  // Derfor håndteres +/−/preview i capture-fasen på selve content-elementet.
  function safe85Refresh(){
    commit();
    safe85RenderDatasetTableEditor(el,w,ds);
  }
  function safe85ButtonAction(target){
    const btn=target && target.closest ? target.closest('button') : null;
    if(!btn || !c.contains(btn)) return false;

    if(btn.hasAttribute('data-safe85-add-row')){
      ds.rows.push(Array.from({length:ds.columns.length},()=> ''));
      safe85Refresh();
      return true;
    }
    if(btn.hasAttribute('data-safe85-add-col')){
      ds.columns.push('Kolonne '+(ds.columns.length+1));
      ds.rows.forEach(r=>r.push(''));
      safe85Refresh();
      return true;
    }
    if(btn.hasAttribute('data-safe85-del-row')){
      const ri=Number(btn.getAttribute('data-safe85-del-row'));
      if(ds.rows.length<=1)ds.rows=[Array.from({length:ds.columns.length},()=> '')];
      else ds.rows.splice(ri,1);
      safe85Refresh();
      return true;
    }
    if(btn.hasAttribute('data-safe85-del-col')){
      const ci=Number(btn.getAttribute('data-safe85-del-col'));
      if(ds.columns.length<=1){
        try{toast('Datasættet skal have mindst én kolonne')}catch(_e){}
        return true;
      }
      ds.columns.splice(ci,1);
      ds.rows.forEach(r=>r.splice(ci,1));
      safe85Refresh();
      return true;
    }
    return false;
  }

  ['pointerdown','mousedown','touchstart'].forEach(ev=>{
    c.addEventListener(ev,function(e){
      if(e.target && e.target.closest && e.target.closest('.safe85DatasetEditor button,.safe85DatasetEditor input')){
        e.stopPropagation();
      }
    },true);
  });
  c.addEventListener('click',function(e){
    if(safe85ButtonAction(e.target)){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    }
  },true);

  c.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('pointerdown',e=>e.stopPropagation());
    inp.addEventListener('click',e=>e.stopPropagation());
    inp.addEventListener('keydown',e=>{
      // SAFE90: regnearksagtig navigation i dataeditoren.
      if(e.key==='Escape'){
        e.preventDefault();
        inp.blur();
        select(w.id,{editText:false});
        return;
      }
      if(e.key==='Tab'){
        e.preventDefault();
        safe90MoveDatasetFocus(inp,0,e.shiftKey?-1:1);
        return;
      }
      if(e.key==='Enter'){
        e.preventDefault();
        safe90MoveDatasetFocus(inp,e.shiftKey?-1:1,0);
        return;
      }
      if(e.key==='ArrowDown'){e.preventDefault();safe90MoveDatasetFocus(inp,1,0);return;}
      if(e.key==='ArrowUp'){e.preventDefault();safe90MoveDatasetFocus(inp,-1,0);return;}
      if(e.key==='ArrowRight' && (inp.selectionStart===inp.value.length || e.metaKey || e.ctrlKey)){
        e.preventDefault();safe90MoveDatasetFocus(inp,0,1);return;
      }
      if(e.key==='ArrowLeft' && (inp.selectionStart===0 || e.metaKey || e.ctrlKey)){
        e.preventDefault();safe90MoveDatasetFocus(inp,0,-1);return;
      }
    });
  });

  c.querySelectorAll('[data-safe85-head]').forEach(inp=>{
    inp.oninput=e=>{
      ds.columns[Number(inp.dataset.safe85Head)]=String(e.target.value||'');
      commit();
    };
  });
  c.querySelectorAll('[data-safe85-cell]').forEach(inp=>{
    inp.oninput=e=>{
      const [ri,ci]=String(inp.dataset.safe85Cell).split(':').map(Number);
      if(!Array.isArray(ds.rows[ri]))ds.rows[ri]=[];
      ds.rows[ri][ci]=String(e.target.value||'');
      commit();
    };
  });

  const addRow=c.querySelector('[data-safe85-add-row]');
  if(addRow)addRow.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    ds.rows.push(Array.from({length:ds.columns.length},()=> ''));
    commit();
    safe85RenderDatasetTableEditor(el,w,ds);
  };

  const addCol=c.querySelector('[data-safe85-add-col]');
  if(addCol)addCol.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    ds.columns.push('Kolonne '+(ds.columns.length+1));
    ds.rows.forEach(r=>r.push(''));
    commit();
    safe85RenderDatasetTableEditor(el,w,ds);
  };

  c.querySelectorAll('[data-safe85-del-row]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const ri=Number(btn.dataset.safe85DelRow);
      if(ds.rows.length<=1)ds.rows=[Array.from({length:ds.columns.length},()=> '')];
      else ds.rows.splice(ri,1);
      commit();
      safe85RenderDatasetTableEditor(el,w,ds);
    };
  });

  c.querySelectorAll('[data-safe85-del-col]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const ci=Number(btn.dataset.safe85DelCol);
      if(ds.columns.length<=1){toast('Datasættet skal have mindst én kolonne');return;}
      ds.columns.splice(ci,1);
      ds.rows.forEach(r=>r.splice(ci,1));
      commit();
      safe85RenderDatasetTableEditor(el,w,ds);
    };
  });

  return true;
}

function usedBoardBackgroundKeys(){
  const keys=new Set();
  try{
    (state.slides||[]).forEach(s=>{
      if(s.bgImageTitle)keys.add('title:'+s.bgImageTitle);
      if(s.bgImage)keys.add('src:'+String(s.bgImage).replace(/^.*backgrounds\//,'backgrounds/'));

function applyThemeBackgroundToSlide(s,bg){
  if(!s || !bg)return false;
  if(bg.kind==='swatch'){
    s.bg=bg.bg || 'linear-gradient(135deg,#eef7ff,#d6ecff)';
    s.bgImage='';
    s.bgImageSource='swatch';
    s.bgImageTitle=bg.title||'Farve';
    s.bgImageName='';
    s.bgImageVersion=bg.version||'Farve';
    s.bgFit='cover';
    s.bgFilter=s.bgFilter||'none';
    return true;
  }
  const resolved=typeof resolveAssetPath==='function' ? resolveAssetPath(bg.src) : bg.src;
  s.bg='linear-gradient(135deg,#eef7ff,#d6ecff)';
  s.bgImage=resolved;
  s.bgImageSource='builtin';
  s.bgImageTitle=bg.title||'';
  s.bgImageName=bg.name||'';
  s.bgImageVersion=bg.version||'';
  s.bgFit='cover';
  s.bgFilter=s.bgFilter||'standard';
  return true;
}

function randomBoardTheme(){
  // Fælles random-pulje: farve/gradient-swatches + alle billedbaggrunde.
  const swatches=(typeof TAVLE_RANDOM_SWATCHES!=='undefined' && Array.isArray(TAVLE_RANDOM_SWATCHES))
    ? TAVLE_RANDOM_SWATCHES.map(sw=>({...sw,kind:'swatch'}))
    : [];
  const images=(typeof TAVLE_BACKGROUNDS!=='undefined' && Array.isArray(TAVLE_BACKGROUNDS))
    ? TAVLE_BACKGROUNDS.filter(bg=>bg && bg.src).map(bg=>({...bg,kind:'image'}))
    : [];
  const library=[...swatches,...images];
  if(!library.length)return null;

  const used=new Set();
  try{
    (state.slides||[]).forEach(s=>{
      if(s.bgImageSource==='swatch' && s.bgImageTitle)used.add('swatch:'+s.bgImageTitle);
      if(!s.bgImage && s.bg)used.add('swatch-bg:'+String(s.bg));
      if(s.bgImage)used.add('image:'+String(s.bgImage).replace(/^.*backgrounds\//,'backgrounds/'));
    });
  }catch(_e){}

  const unused=library.filter(bg=>{
    if(bg.kind==='swatch')return !used.has('swatch:'+bg.title) && !used.has('swatch-bg:'+String(bg.bg));
    return !used.has('image:'+String(bg.src).replace(/^.*backgrounds\//,'backgrounds/'));
  });
  const pool=unused.length ? unused : library;
  return pool[Math.floor(Math.random()*pool.length)];
}

    const resolved=typeof resolveAssetPath==='function' ? resolveAssetPath(bg.src) : bg.src;

      bgImageVersion:bg.version||'HD',
      bgFit:'cover',
      bgFilter:'standard',
      grid:false,
      draw:'',
      widgets:[]
    };
  }
  return {title:'Min undervisningstavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]};
}

// PAPIRKURV / INTERNAL TRASH BOARD
////////////////////////////////////////////////////////////
/*
Papirkurv-regler:
- Papirkurv er en intern/særlig tavle (`isTrashBoard:true`), ikke en normal brugertavle.
- Den må ikke tælle med i almindelig tavlenavigation eller tavletæller.
- Den må ikke vises som normal tavle i tavleoversigt, omdøbning, flytning eller sletning.
- Slettede widgets flyttes hertil, medmindre permanent sletning bruges.
- X/Delete/Backspace i papirkurv sletter permanent ifølge de relevante handlers.
- Klik/Enter på widget i papirkurv gendanner.
- Piletaster i papirkurv navigerer mellem widgets.
- T/Esc/mellemrum lukker papirkurven.
Ret kun logikken med meget små patches og test normal tavle + papirkurv bagefter.
*/
function isTrashBoard(s){
  return !!(s && (s.isTrashBoard===true || s.title==='🗑 Papirkurv'));
}
function createTrashBoard(){
  return {
    title:'🗑 Papirkurv',
    isTrashBoard:true,
    bg:'radial-gradient(circle at 20% 15%, rgba(148,163,184,.34), transparent 28%), radial-gradient(circle at 85% 82%, rgba(30,41,59,.85), transparent 36%), linear-gradient(135deg,#020617,#111827 48%,#334155)',
    bgImage:'',
    bgImageSource:'trash',
    bgImageTitle:'Papirkurv',

function wheelIndexFromCanvasEvent(canvas,e,w){
  const names=w.data.names||[];
  if(!names.length)return -1;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*canvas.width;
  const y=(e.clientY-rect.top)/rect.height*canvas.height;
  const cx=canvas.width/2, cy=canvas.height/2;
  const dx=x-cx, dy=y-cy;
  const dist=Math.hypot(dx,dy);
  const r=Math.min(canvas.width,canvas.height)*0.47;
  if(dist>r || dist<r*.14)return -1; // ignore outside wheel and center button area
  const two=Math.PI*2, step=two/names.length, rot=w.data.rot||0;
  const a=((Math.atan2(dy,dx)-rot)%two+two)%two;
  return Math.floor(a/step)%names.length;
}
function moveWheelItemToChosen(c,w,index){
  const names=w.data.names||[];
  if(index<0||index>=names.length)return;
  const item=names[index];
  const msg=w.data.keepPool ? item+' føjes til valgte-listen?' : item+' flyttes til valgte-puljen?';
  if(!confirm(msg))return;
  if(!w.data.keepPool){
    names.splice(index,1);
    w.data.names=names;
  }
  w.data.chosen=w.data.chosen||[];
  w.data.chosen.push(item);
  w.data.winner='';
  animateWinner(c,item);
  wheelLand();
  fillContent(c.closest('.widget'),w);
  save();
}

function runWheelSpin(c,w,{auto=false,onDone=null}={}){
 primeAudio();
 const el=c.closest('.widget');
 const canv=c.querySelector('canvas');
 const btn=c.querySelector('.spinCenter')||c.querySelector('.spin');
 let names=[...(w.data.names||[])];
 if(!names.length){toast('Puljen er tom'); if(onDone)onDone(false); return;}
 if(btn)btn.disabled=true;
 const idx=Math.floor(Math.random()*names.length),winner=names[idx];
 const duration=auto?1050+Math.random()*350:2600+Math.random()*700;
 const startRot=w.data.rot||0;
 const endRot=startRot+targetRotationForIndex(idx,names.length,auto?3+Math.floor(Math.random()*2):6+Math.floor(Math.random()*3));
 const startTime=performance.now();
 let lastTick=0;
 function frame(now){
   const p=Math.min(1,(now-startTime)/duration),rot=startRot+(endRot-startRot)*easeOutCubic(p);
   drawWheel(canv,w,rot);
   if(now-lastTick>(auto?120:95) && p<.94){wheelTick();lastTick=now}
   if(p<1){requestAnimationFrame(frame)}else{
     drawWheel(canv,w,endRot);
     if(btn)btn.disabled=false;
     wheelLand(); if(!auto)setTimeout(wheelLand,80);
     animateWinner(c,winner);
     w.data.chosen=w.data.chosen||[];
     w.data.chosen.push(winner);
     if(!w.data.keepPool){
       if(auto){w.data.names.splice(idx,1)}
       else if(confirm(winner+' blev valgt. Fjern fra puljen?')){w.data.names.splice(idx,1)}
     }
     w.data.winner='';
     w.data.rot=0;
     w.data.statsView=!!(w.data.statsView || auto);
     fillContent(el,w);save();
     if(onDone)onDone(true,winner);
   }
 }
 requestAnimationFrame(frame);
}
function startWheelAuto(c,w){

 w.data.autoRunning=true;w.data.statsView=true;fillContent(el,w);save();

   if(!w.data.autoRunning || remaining<=0 || !(w.data.names||[]).length){w.data.autoRunning=false;fillContent(el,w);save();return;}
   remaining--;

 };
 setTimeout(step,60);
}

function askLink(w){
  if(!canEditWidgets())return;

  const defaultTitle='Link';
  const currentTitle=String(w.data.text||'').trim();
  const titleValue=(currentTitle && currentTitle!=='Klikbart link') ? currentTitle : defaultTitle;
  const urlValue=String(w.data.url||'').trim();

  showModal(`<h2>Link</h2>
    <p style="margin-top:0;opacity:.75;font-weight:800">Samme adresse kan vises som almindeligt link eller som indlejret webside/iframe via knappen i widgetens topbjælke.</p>
    <label>Titel
      <input id="lt" placeholder="Link" value="${esc(titleValue)}">
    </label>
    <label>Adresse
      <input id="lu" placeholder="Indsæt URL" value="${esc(urlValue)}">
    </label>
    <button id="ok">Gem</button>
    <button id="cancel">Luk</button>`);

  const titleInput=modal.querySelector('#lt');
  const urlInput=modal.querySelector('#lu');

  function selectAllOnFocus(input){
    if(!input)return;
    let selectedOnce=false;
    const doSelect=()=>{
      try{
        input.focus({preventScroll:true});
        input.setSelectionRange(0,String(input.value||'').length);
        selectedOnce=true;
      }catch(e){
        try{input.select();selectedOnce=true;}catch(_e){}
      }
    };
    input.addEventListener('focus',()=>setTimeout(doSelect,0));
    input.addEventListener('pointerdown',()=>{
      if(!selectedOnce)setTimeout(doSelect,0);
    });
    input.addEventListener('click',()=>{
      if(!selectedOnce)setTimeout(doSelect,0);
    });
    input.addEventListener('blur',()=>{selectedOnce=false;});
  }

  selectAllOnFocus(titleInput);
  selectAllOnFocus(urlInput);

  function saveLink(){
    w.data.text=titleInput.value.trim()||defaultTitle;
    w.data.url=normalizeLinkUrl(urlInput.value);
    if(!w.data.view)w.data.view='link';
    closeModal();
    render();
    save();
  }

  modal.querySelector('#ok').onclick=saveLink;
  modal.querySelector('#cancel').onclick=closeModal;

  [titleInput,urlInput].forEach(input=>{
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        saveLink();
      }
    });
  });

  setTimeout(()=>{
    try{
      titleInput.focus({preventScroll:true});
      titleInput.setSelectionRange(0,String(titleInput.value||'').length);
    }catch(e){try{titleInput.select()}catch(_e){}}
  },60);
}

    bgGridToggle.innerHTML='Gitter: '+(slide().grid?'Til':'Fra')+' <small>Shift+G</small>';
  }
  function toggleBgGrid(){
    slide().grid=!slide().grid;
    updateGridOverlay();
    save();
    syncBgGridButton();
    toast(slide().grid?'Gitter til':'Gitter fra');
  }
  if(bgGridToggle)bgGridToggle.onclick=e=>{e.preventDefault();e.stopPropagation();toggleBgGrid()};

  function applyBgLibraryFilter(){
    const cat=window.__tavleBgCat||'alle';
    const q=(modal.querySelector('#bgSearch')?.value||'').trim().toLowerCase();
    let visible=0;
    modal.querySelectorAll('.bgChoice[data-bg-index]').forEach(card=>{
      const show=(cat==='alle'||cat===(card.dataset.bgGroup||''))&&(!q||(card.dataset.bgSearch||'').includes(q));
      card.classList.toggle('hiddenByFilter',!show);
      if(show)visible++;
    });
    const count=modal.querySelector('#bgCount');
    if(count)count.textContent=visible+' vist';
  }

  modal.querySelectorAll('[data-bg-cat]').forEach(btn=>btn.onclick=()=>{
    window.__tavleBgCat=btn.dataset.bgCat||'alle';
    modal.querySelectorAll('[data-bg-cat]').forEach(b=>b.classList.toggle('active',b===btn));
    applyBgLibraryFilter();
    setTimeout(()=>bgHighlight(0),0);
  });
  const searchInput=modal.querySelector('#bgSearch');
  if(searchInput)searchInput.oninput=()=>{applyBgLibraryFilter();setTimeout(()=>bgHighlight(0),0)};
  applyBgLibraryFilter();

  // Keyboardstyring for baggrundsvælger: pile markerer, Space previewer, Enter vælger/lukker, ESC gendanner/lukker.
  modalBack.classList.add('bgModalKeyboard');
  const bgOriginal={
    bg:slide().bg,
    bgImage:slide().bgImage,
    bgImageName:slide().bgImageName,
    bgImageSource:slide().bgImageSource,
    bgImageTitle:slide().bgImageTitle,
    bgImageVersion:slide().bgImageVersion,
    bgFilter:slide().bgFilter,
    bgFit:slide().bgFit
  };
  let bgKbIndex=0;
  function bgVisibleCards(){
    return Array.from(modal.querySelectorAll('.bgChoice[data-bg-index]')).filter(c=>!c.classList.contains('hiddenByFilter'));
  }
  function bgHighlight(i){
    const cards=bgVisibleCards();
    modal.querySelectorAll('.bgChoice[data-bg-index]').forEach(c=>c.classList.remove('kbSelected','kbPreview'));
    if(!cards.length)return;
    bgKbIndex=Math.max(0,Math.min(cards.length-1,i));
    const card=cards[bgKbIndex];
    card.classList.add('kbSelected');
    try{card.scrollIntoView({block:'nearest',inline:'nearest'});}catch(_e){}
  }
  function bgGridColumns(){
    const cards=bgVisibleCards();
    if(cards.length<2)return 1;
    const top=cards[0].getBoundingClientRect().top;
    let cols=0;
    for(const c of cards){
      if(Math.abs(c.getBoundingClientRect().top-top)<10)cols++;
      else break;
    }
    return Math.max(1,cols||3);
  }
  function bgFlashPreviewTransparency(){
    modalBack.classList.add('bgPreviewing');
  }
  function bgClearPreviewTransparency(){
    modalBack.classList.remove('bgPreviewing');
  }
  function bgLiveApplyToBoard(){
    // Tving preview direkte på tavlen, så gradient-swatches ses med det samme,
    // også mens modalens tastatur-state stadig er aktiv.
    applyBg();
  }
  function bgApplyFilterByNumber(n){
    const chips=Array.from(modal.querySelectorAll('[data-bg-filter]'));
    const chip=chips[n-1];
    if(!chip)return false;
    chip.click();
    setTimeout(()=>bgHighlight(0),80);
    return true;
  }
  function bgApplyFromCard(card, permanent){
    const item=bgItems[Number(card?.dataset?.bgIndex)];
    if(!item)return;
    if(item.kind==='swatch'){
      slide().bg=item.bg;
      slide().bgImage='';
      slide().bgImageName='';
      slide().bgImageSource='swatch';
      slide().bgImageTitle=item.title;
      slide().bgImageVersion=item.version||'Farve';
      slide().bgFit='cover';
      slide().bgFilter=slide().bgFilter||'none';
    }else{
      slide().bgImage=item.src;
      slide().bgImageName=item.name || item.src.split('/').pop();
      slide().bgImageTitle=item.title;
      slide().bgImageVersion=item.version;
      slide().bgImageSource='library';
      slide().bgFilter=slide().bgFilter||'none';
      slide().bgFit='cover';
    }
    render();
    bgLiveApplyToBoard();
    if(permanent)save();
    modalBack.classList.add('bgModalKeyboard');
    if(!permanent){
      modal.querySelectorAll('.bgChoice[data-bg-index]').forEach(c=>c.classList.remove('kbPreview'));
      card.classList.add('kbPreview');
    }
  }
  function bgRestore(){
    Object.assign(slide(),bgOriginal);
    render();
  }
  function bgClose(){
    document.removeEventListener('keydown',bgKeyHandler,true);
    modalBack.classList.remove('bgModalKeyboard','bgPreviewing');
    closeModal();
  }
  function bgKeyHandler(e){
    if(modalBack.style.display!=='flex')return;
    if(!modal || !/Baggrund/i.test(modal.textContent||''))return;
    const active=document.activeElement;
    const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    if(typing){
      if(e.key==='Enter'){
        e.preventDefault();
        active.blur();
      }else if(e.key==='Escape'){
        e.preventDefault();
        bgRestore();
        bgClose();
      }
      return;
    }
    if(e.shiftKey && String(e.key||'').toLowerCase()==='g'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      toggleBgGrid();
      return;
    }
    if(e.key==='ArrowRight'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex+1);
      return;
    }
    if(e.key==='ArrowLeft'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex-1);
      return;
    }
    if(e.key==='ArrowDown'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex+bgGridColumns());
      return;
    }
    if(e.key==='ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex-bgGridColumns());
      return;
    }
    if(/^[1-6]$/.test(e.key)){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgApplyFilterByNumber(Number(e.key));
      return;
    }
    if(e.key==='Home'){
      e.preventDefault(); e.stopPropagation(); bgClearPreviewTransparency(); bgHighlight(0); return;
    }
    if(e.key==='End'){
      e.preventDefault(); e.stopPropagation(); bgClearPreviewTransparency(); bgHighlight(bgVisibleCards().length-1); return;
    }
    if(e.key===' '){
      const cards=bgVisibleCards(), card=cards[bgKbIndex];
      if(card){
        e.preventDefault(); e.stopPropagation();
        if(modalBack.classList.contains('bgPreviewing')){
          bgClearPreviewTransparency();
        }else{
          bgApplyFromCard(card,false);
          bgFlashPreviewTransparency();
        }
      }
      return;
    }
    if(e.key==='Enter'){
      const cards=bgVisibleCards(), card=cards[bgKbIndex];
      if(card){
        e.preventDefault(); e.stopPropagation();
        bgClearPreviewTransparency();
        bgApplyFromCard(card,true);
        toast('Baggrund valgt');
        bgClose();
      }
      return;
    }
    if(e.key==='Escape'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgRestore();
      bgClose();
      return;
    }
  }
  modal.addEventListener('pointerdown',()=>bgClearPreviewTransparency(),true);
  if(window.__bgKeyHandler)document.removeEventListener('keydown',window.__bgKeyHandler,true);
  window.__bgKeyHandler=bgKeyHandler;
  document.addEventListener('keydown',bgKeyHandler,true);
  setTimeout(()=>{
    const cards=bgVisibleCards();
    const activeIdx=cards.findIndex(c=>c.classList.contains('active'));
    bgHighlight(activeIdx>=0?activeIdx:0);
    try{modal.tabIndex=-1;modal.focus({preventScroll:true});}catch(_e){}
  },60);

  modal.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{slide().bg=b.dataset.bg;slide().bgImage='';slide().bgImageName='';slide().bgImageSource='';delete slide().bgImageTitle;delete slide().bgImageVersion;render();save();bgModal()});
  modal.querySelectorAll('[data-bg-filter]').forEach(btn=>btn.onclick=()=>{slide().bgFilter=btn.dataset.bgFilter||'none';render();save();bgModal()});

  modal.querySelectorAll('[data-bg-index]').forEach(btn=>btn.onclick=()=>{
    const item=bgItems[Number(btn.dataset.bgIndex)];
    if(!item)return;
    bgApplyFromCard(btn,true);
    modal.querySelectorAll('.bgChoice[data-bg-index]').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    toast((item.title||'Baggrund')+' valgt som baggrund');
  });

  modal.querySelector('#bgInfo').onclick=()=>{
    const img=new Image();
    img.onload=()=>{slide().bgImage=BUILTIN_INFOGRAFIK_BG;slide().bgImageName='README_infografik.png';slide().bgImageSource='builtin-url';slide().bgFilter=slide().bgFilter||'none';slide().bgFit='contain';render();save();toast('Online-infografik valgt som baggrund');bgModal()};
    img.onerror=()=>toast('Kunne ikke hente online-infografik');
    img.src=BUILTIN_INFOGRAFIK_BG;
  };
  modal.querySelector('#bgImg').onclick=()=>pickFile('image/*',(src,file)=>{slide().bgImage=src;slide().bgImageName=(file&&file.name)||'baggrundsbillede';slide().bgImageSource='local';slide().bgFilter=slide().bgFilter||'none';delete slide().bgImageTitle;delete slide().bgImageVersion;if(!slide().bgFit)slide().bgFit='contain';render();save();toast('Baggrundsbillede valgt');bgModal()});
  modal.querySelector('#bgUrl').onclick=()=>{
    const current=slide().bgImageSource==='url'?(slide().bgImage||''):'';
    const url=prompt('Indsæt URL til eksternt billede',current);
    if(url===null)return;
    const trimmed=String(url||'').trim();
    if(!trimmed){toast('Ingen URL indsat');return}
    if(!/^https?:\/\//i.test(trimmed)){toast('URL skal starte med http:// eller https://');return}
    slide().bgImage=trimmed;slide().bgImageName='eksternt baggrundsbillede';slide().bgImageSource='url';slide().bgFilter=slide().bgFilter||'none';delete slide().bgImageTitle;delete slide().bgImageVersion;if(!slide().bgFit)slide().bgFit='cover';render();save();toast('Eksternt baggrundsbillede valgt');bgModal();
  };
  modal.querySelector('#fit').onchange=e=>{slide().bgFit=e.target.value;render();save()};
  const clearBgBtn=modal.querySelector('#clearBg');if(clearBgBtn)clearBgBtn.onclick=()=>{slide().bgImage='';slide().bgImageName='';slide().bgImageSource='';delete slide().bgImageTitle;delete slide().bgImageVersion;render();save();bgModal()};
  modal.querySelector('#close').onclick=()=>{document.removeEventListener('keydown',window.__bgKeyHandler,true);modalBack.classList.remove('bgModalKeyboard','bgPreviewing');closeModal()};
}

function findPinButton(){
  return document.getElementById('pinBtn') || document.getElementById('pin') || document.querySelector('[data-action="pin"],.pinBtn,.pin');
}
function findBottomToolbar(){
  return document.querySelector('.toolbar,.bottomToolbar,#toolbar,#bottomToolbar');
}
function getToolbarKeepVisible(){
  return localStorage.getItem('maans_tavle_toolbar_keep_visible')==='1';
}
function setToolbarKeepVisible(on){
  localStorage.setItem('maans_tavle_toolbar_keep_visible',on?'1':'0');
  const pin=findPinButton();
  if(pin){
    pin.classList.toggle('pinned',on);
    pin.title=on?'Værktøjslinjen holdes synlig – klik for automatisk skjul':'Hold værktøjslinjen synlig';
    pin.setAttribute('aria-pressed',on?'true':'false');
  }
  const tb=findBottomToolbar();
  if(tb){
    tb.classList.toggle('open',on);
    tb.classList.toggle('show',on);
    tb.classList.toggle('pinned',on);
    tb.style.opacity=on?'1':'';
    tb.style.pointerEvents=on?'auto':'';
    if(on)tb.style.transform='translateX(-50%) translateY(0)';
    else tb.style.transform='';
  }
  document.body.classList.toggle('toolbarPinned',on);
}
function wireQuickPinButton(){
  const pin=findPinButton();
  if(!pin||pin.dataset.quickPinWired==='1')return;
  pin.dataset.quickPinWired='1';
  pin.addEventListener('click',ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    setToolbarKeepVisible(!getToolbarKeepVisible());
    toast(getToolbarKeepVisible()?'Værktøjslinjen holdes synlig':'Automatisk skjul er slået til');
  },true);
  setToolbarKeepVisible(getToolbarKeepVisible());
}

function collectEmbeddedMedia(){
  const items=[];
  const kindLabel=(src)=>{
    const ext=extFromDataUrl(src,'bin');
    if(ext==='pdf')return 'PDF';
    if(['png','jpg','webp','gif','svg'].includes(ext))return 'Billede';
    return 'Medie';
  };
  try{
    (state.slides||[]).forEach((sl,si)=>{
      const slideName=safeSlideTitle?safeSlideTitle(sl,si):('Tavle '+(si+1));
      if(sl.bgImage&&String(sl.bgImage).startsWith('data:')){
        items.push({type:'Baggrundsbillede',slide:slideName,name:`tavle-${si+1}-baggrund`,src:sl.bgImage});
      }
      (sl.widgets||[]).forEach((w,wi)=>{
        if(w.type==='image'&&w.data&&String(w.data.src||'').startsWith('data:')){
          items.push({type:'Billede',slide:slideName,name:w.data.name||`tavle-${si+1}-billede-${wi+1}`,src:w.data.src});
        }
        if(w.type==='pdf'&&w.data&&String(w.data.src||w.data.url||'').startsWith('data:')){
          items.push({type:'PDF',slide:slideName,name:w.data.name||`tavle-${si+1}-pdf-${wi+1}`,src:w.data.src||w.data.url});
        }
        if(w.type==='text'&&w.data&&typeof w.data.text==='string'){
          const src='data:text/plain;charset=utf-8,'+encodeURIComponent(w.data.text);
          items.push({type:'Tekst',slide:slideName,name:w.data.name||w.title||`tavle-${si+1}-tekst-${wi+1}.txt`,src});
        }
        if(w.type==='html'&&w.data&&typeof w.data.html==='string'){
          const src='data:text/html;charset=utf-8,'+encodeURIComponent(w.data.html);
          items.push({type:'HTML',slide:slideName,name:w.data.name||w.title||`tavle-${si+1}-html-${wi+1}.html`,src});
        }
        if(w.type==='link'&&w.data&&w.data.srcdoc){
          const src='data:text/html;charset=utf-8,'+encodeURIComponent(w.data.srcdoc);
          items.push({type:'HTML',slide:slideName,name:w.data.text||w.title||`tavle-${si+1}-html-${wi+1}.html`,src});
        }
      });
    });
  }catch(e){}
  return items.map((it,i)=>{
    const ext=extFromDataUrl(it.src);
    return {...it,ext,filename:safeFileName(it.name,ext),label:it.type||kindLabel(it.src),id:'mediaDl'+i};
  });
}

function cleanHtmlForStandalone(htmlDoc){
  // Fjern modal/overlay/toast og midlertidige UI-tilstande, så den gemte fil ikke åbner låst.
  htmlDoc=htmlDoc.replace(/<div id="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/⏳ Forbereder fil\.\.\./g,'💾 Gem HTML + data');
  htmlDoc=htmlDoc.replace(/Forbereder HTML-fil\.\.\./g,'');
  htmlDoc=htmlDoc.replace(/disabled=""/g,'');
  htmlDoc=htmlDoc.replace(/\sdisabled(=("|')disabled\2)?/g,'');
  htmlDoc=htmlDoc.replace(/\sdata-old-text="[^"]*"/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleData"[\s\S]*?<\/script>/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleBoot"[\s\S]*?<\/script>/g,'');
  return htmlDoc;
}
function makeStandaloneHtml(){
  const cleanState=stripTransientForExport(state);
  const payload=JSON.stringify(cleanState);
  let htmlDoc=document.documentElement.outerHTML;
  htmlDoc=cleanHtmlForStandalone(htmlDoc);

  // Boot-scriptet skal ligge før appens hovedscript, så den gemte fil starter med de rigtige tavler.
  const boot=`<script id="embeddedTavleBoot">(function(){try{localStorage.setItem('maans_interaktiv_tavle_v162_test', ${JSON.stringify(payload)});}catch(e){}})();<\/script>`;

  const firstScript=htmlDoc.indexOf('<script>');
  if(firstScript!==-1)htmlDoc=htmlDoc.slice(0,firstScript)+boot+htmlDoc.slice(firstScript);
  else if(htmlDoc.includes('</head>'))htmlDoc=htmlDoc.replace('</head>',boot+'</head>');
  else htmlDoc=boot+htmlDoc;

  return '<!doctype html>\n'+htmlDoc;
}
function exportStandaloneHtml(){

function wireRobustWidgetClose(){
  if(window.__robustWidgetCloseWired)return;
  window.__robustWidgetCloseWired=true;

  const isCloseButton=(el)=>{
    if(!el)return false;
    const txt=(el.textContent||'').trim();
    const act=(el.getAttribute?.('data-act')||el.getAttribute?.('data-action')||'').toLowerCase();
    return act==='del' || act==='delete' || act==='close' ||
      el.matches?.('.close,.x,.del,.delete,.remove,[aria-label="Luk"],[title="Luk"]')
      || txt==='×' || txt==='✕' || txt==='x' || txt==='X';
  };

  const handler=(e)=>{
    let btn=e.target.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    if(!btn && (e.clientX||e.clientY)){
      const hit=document.elementFromPoint(e.clientX,e.clientY);
      btn=hit&&hit.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    }
    if(!btn||!isCloseButton(btn))return;
    const widget=btn.closest?.('.widget');
    if(!widget)return;

    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();

    const id=widget.dataset.id || widget.dataset.widgetId || widget.id;
    const now=Date.now();
    if(widget.__closeActivatedAt && now-widget.__closeActivatedAt<700)return;
    widget.__closeActivatedAt=now;

    /* SAFE21: Widget-X følger samme regler som tastatur-sletning.
       Normal tavle: X -> papirkurv. Shift+X -> permanent sletning.
       Papirkurv: X -> permanent sletning. */
    try{
      const onTrash = !!(window.__trashBoardIsActive && window.__trashBoardIsActive());
      if(onTrash && window.__trashBoardPermanentById){
        window.__trashBoardPermanentById(id);
        return;
      }
      if(e.shiftKey && window.__tavlePermanentDeleteWidget){
        window.__tavlePermanentDeleteWidget(id);
        return;
      }
      if(window.__trashBoardDelete){
        window.__trashBoardDelete(id);
        return;
      }
    }catch(err){}

    /* Fallback fra den stabile version, hvis papirkurvlaget ikke er aktivt. */
    try{
      if(typeof removeWidget==='function'){
        removeWidget(id);
        return;
      }
    }catch(err){}

    try{
      const sl=slide();
      if(sl&&Array.isArray(sl.widgets)){
        sl.widgets=sl.widgets.filter(w=>String(w.id)!==String(id));
        save({silent:true});
        render();
        return;
      }
    }catch(err){}

    widget.remove();
    try{save({silent:true})}catch(err){}
  };

  ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(ev=>{
    document.addEventListener(ev,handler,{capture:true,passive:false});
  });
}

function clearWidgetDataForTemplate(w){
  w.data = w.data || {};

  // Bevar widgettype, titel, placering, størrelse, rotation, lås osv.
  // Ryd kun det konkrete eksempelindhold.
  if(w.type==='text'){
    w.data.text='';
    w.data.html='';
  }

  if(w.type==='image'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.alt;
  }

  if(w.type==='pdf'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.page;
  }

  if(w.type==='video'){
    delete w.data.url;
    delete w.data.src;
    delete w.data.embed;
    delete w.data.title;
    delete w.data.thumbnail;
  }

  if(w.type==='link'){
    delete w.data.url;
    w.data.text=w.data.text||'Link';
  }

  if(w.type==='wheel'){
    w.data.names=[];
    w.data.chosen=[];
    w.data.selected=[];
    w.data.result=[];
    w.data.current='';
  }

  if(w.type==='groups'){
    w.data.names=[];
    w.data.groups=[];
    w.data.result=[];
    w.data.grouped=[];
  }

  if(w.type==='wordcloud'){
    w.data.names=[];
    w.data.caseInsensitive = w.data.caseInsensitive!==false;
  }

  if(w.type==='poll'){
    w.data.question=w.data.question||'Hvordan går det?';
    w.data.options=w.data.options||['😀','🙂','😐','🙁','😡'];
    w.data.votes=w.data.options.map(()=>0);
    w.data.cloudView=false;
    w.data.showResults=false;
  }

  if(w.type==='timer'){
    w.data.running=false;
  }
}

  if(/\.(json|tavle|tavlefil)$/i.test(name) || file.type==='application/json'){
    const txt=await readFileAsText(file);
    return openTavleSaveText(txt,file)?{ok:true,kind:'backup',label:file&&file.name||'Tavlefil åbnet'}:{ok:false,kind:'error',label:'Kunne ikke åbne tavlefilen'};
  }
  if(typeof handleDroppedFile==='function'){
    return await handleDroppedFile(file,point);
  }
  toast('Import er ikke tilgængelig i denne version');
  return false;
}

function widgetNavigationOrder(){
  // Pil op/ned skal vælge widgets på den aktive tavle i en forudsigelig visuel rækkefølge.
  // Først fra øverst til nederst, derefter fra venstre mod højre.
  return (slide().widgets||[])
    .filter(w=>w && w.id)
    .slice()
    .sort((a,b)=>{
      const ay=Number(a.y)||0, by=Number(b.y)||0;
      const ax=Number(a.x)||0, bx=Number(b.x)||0;
      if(Math.abs(ay-by)>24) return ay-by;
      if(Math.abs(ax-bx)>24) return ax-bx;
      return (Number(a.z)||0)-(Number(b.z)||0);
    });
}
function selectAdjacentWidget(dir){
  const list=widgetNavigationOrder();
  if(!list.length) return false;
  let idx=list.findIndex(w=>String(w.id)===String(selected));
  if(idx<0){
    idx = dir>0 ? -1 : 0;
  }
  const next=list[(idx + dir + list.length) % list.length];
  if(!next) return false;
  select(next.id);
  try{
    const el=document.querySelector('.widget[data-id="'+CSS.escape(String(next.id))+'"]');
    if(el){
      el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});

}

function moveSelectedWidgetBySlideDirection(dir){

  if(t && (t.matches('input,textarea,select') || t.isContentEditable))return;
  if(modalBack && modalBack.style.display==='flex')return;
  if(app.classList.contains('drawActive'))return;

document.addEventListener('keydown',e=>{
  if(isIframeControlActive())return;
  const t=e.target;
  if(t && (t.matches('input,textarea,select') || t.isContentEditable)) return;
  if(app.classList.contains('drawActive')) return;

  if(e.key==='Escape' && pdfKeyboardWidgetId){
    clearPdfKeyboardControl();
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  if((e.key==='Delete'||e.key==='Backspace') && selected){
    e.preventDefault();
    e.stopPropagation();
    try{
      const api=window.tavleShortcutAPI||{};
      if(api.deleteSelectedWidgetShortcut) api.deleteSelectedWidgetShortcut();
    }catch(_e){}
    return;
  }

  if((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase()==='b'){
    const active=document.activeElement;
    const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable);
    if(!typing && applyRandomBackgroundToActiveSlide()){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }

  if((e.ctrlKey || e.metaKey) && !e.altKey && (e.key==='ArrowRight' || e.key==='ArrowLeft')){
    const dir=e.key==='ArrowRight' ? 1 : -1;
    const handled=selected ? moveSelectedWidgetBySlideDirection(dir) : moveActiveSlideByDirection(dir);
    if(handled){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }

  if(handlePdfArrowKey(e)) return;
  if(e.key==='ArrowDown'){
    if(selectAdjacentWidget(1)){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }
  if(e.key==='ArrowUp'){
    if(selectAdjacentWidget(-1)){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }
  if(e.key==='ArrowRight'){e.preventDefault();nextSlide()}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSlide()}
  if(/^[0-9]$/.test(e.key) && selected){
    if(toggleSelectedGroupLockByNumber(Number(e.key))){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }
  if(/^[1-9]$/.test(e.key)){e.preventDefault();goToSlide(Number(e.key)-1)}

});

<script>
/* v1.0.43: Link/iframe-widget selection guard.
   Formål:
   - Et klik/tap på iframe-widgettens flade skal vælge widgetten ligesom en tekstwidget.
   - Iframe-indhold må ikke stjæle klik, når man vil fokusere, rotere eller vælge widgetten.
   - Dobbeltklik/tap eller knapper som "Åbn/Aktiver webside" kan aktivere egentlig iframe-interaktion.
*/
(function(){
  if (window.__tavleIframeSelectionGuardV43) return;
  window.__tavleIframeSelectionGuardV43 = true;

  function isIframeWidget(el) {
    if (!el || !el.matches) return false;
    return el.matches('.link-widget, .iframe-widget, [data-type="link"], [data-type="iframe"]') || !!el.querySelector('iframe');
  }

  function closestIframeWidget(target) {
    if (!target || !target.closest) return null;
    const w = target.closest('.widget, .link-widget, .iframe-widget, [data-type="link"], [data-type="iframe"]');
    return isIframeWidget(w) ? w : null;
  }

  function isControl(target) {
    return !!(target && target.closest && target.closest(
      'button, a, input, textarea, select, .widget-header, .widget-toolbar, .widget-controls, .resize-handle, .rotate-handle, [data-action], .no-drag'
    ));
  }

  function selectWidget(widget, ev) {
    try { widget.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true, pointerId: ev.pointerId || 1, clientX: ev.clientX || 0, clientY: ev.clientY || 0})); } catch(e) {}
    try { widget.dispatchEvent(new MouseEvent('mousedown', {bubbles:true, clientX: ev.clientX || 0, clientY: ev.clientY || 0})); } catch(e) {}
    try { widget.click(); } catch(e) {}
    try { widget.focus && widget.focus(); } catch(e) {}

    widget.classList.add('selected');
    widget.setAttribute('data-selected', 'true');

    window.__lastSelectedIframeWidget = widget;
  }

  // First click selects widget. It does not activate the embedded page.
  document.addEventListener('pointerdown', function(ev){
    const widget = closestIframeWidget(ev.target);
    if (!widget) return;
    if (isControl(ev.target)) return;
    if (widget.classList.contains('iframe-interaction-enabled') || widget.classList.contains('is-iframe-active')) return;

    selectWidget(widget, ev);
  }, true);

  // Double-click/tap can activate the embedded web page temporarily.
  document.addEventListener('dblclick', function(ev){
    const widget = closestIframeWidget(ev.target);
    if (!widget || isControl(ev.target)) return;
    widget.classList.add('iframe-interaction-enabled', 'is-iframe-active');
    const iframe = widget.querySelector('iframe');
    if (iframe) iframe.style.pointerEvents = 'auto';
  }, true);

  // Escape returns iframe to safe/selectable mode.
  document.addEventListener('keydown', function(ev){
    if (ev.key !== 'Escape') return;
    document.querySelectorAll('.iframe-interaction-enabled, .is-iframe-active').forEach(function(widget){
      widget.classList.remove('iframe-interaction-enabled', 'is-iframe-active');
      const iframe = widget.querySelector && widget.querySelector('iframe');
      if (iframe) iframe.style.pointerEvents = 'none';
    });
  }, true);

  // If app has buttons with these labels, let them activate iframe interaction.
  document.addEventListener('click', function(ev){
    const btn = ev.target && ev.target.closest && ev.target.closest('button, a, [role="button"]');
    if (!btn) return;
    const label = (btn.textContent || btn.title || btn.getAttribute('aria-label') || '').trim().toLowerCase();
    if (!/(aktivér webside|aktiver webside|åbn|open|interager|brug webside)/.test(label)) return;
    const widget = closestIframeWidget(btn);
    if (!widget) return;
    widget.classList.add('iframe-interaction-enabled', 'is-iframe-active');
    const iframe = widget.querySelector('iframe');
    if (iframe) iframe.style.pointerEvents = 'auto';
  }, true);
})();
</script>

<script>

/* v1.0.85 rescue state unlock – no auto-arrange on app resume */
(function(){
  let rescueInProgress=false;

  function hardUnlockUi(){
    try{ if(window.clearIframeControl)window.clearIframeControl(); }catch(e){}
    document.body.classList.remove(
      'iframe-control-active',
      'widget-transform-active',
      'textSelecting',
      'isSelectingText',
      'dragging',
      'resizing',
      'rotating'
    );
    document.querySelectorAll('.widget').forEach(el=>{
      el.classList.remove(
        'linkIframeActive',
        'iframe-interaction-enabled',
        'is-iframe-active',
        'widgetTransforming',
        'dragging',
        'resizing',
        'rotating'
      );
      el.style.pointerEvents='';
    });
    document.querySelectorAll('.linkIframeShield').forEach(el=>{
      el.style.display='';
      el.style.pointerEvents='';
    });
    document.querySelectorAll('iframe').forEach(el=>{
      el.style.pointerEvents='';
    });
  }

  function clearUiFocusAndSelection(){
    try{
      if(document.activeElement && document.activeElement.blur)document.activeElement.blur();
    }catch(e){}
    try{
      const sel=window.getSelection&&window.getSelection();
      if(sel)sel.removeAllRanges();
    }catch(e){}
  }

  function finishRescue(btn){
    hardUnlockUi();
    clearUiFocusAndSelection();
    if(btn){
      btn.blur&&btn.blur();
      btn.classList.remove('active');
      btn.removeAttribute('aria-pressed');
      btn.classList.remove('rescueFlash');
    }
    rescueInProgress=false;
  }

  function manualRescueAll(btn){
    if(rescueInProgress)return;
    rescueInProgress=true;
    try{
      hardUnlockUi();
      clearUiFocusAndSelection();
      if(btn){
        btn.classList.remove('rescueFlash');
        void btn.offsetWidth;
        btn.classList.add('rescueFlash');
      }
      if(window.rescueWidgetsToViewport)window.rescueWidgetsToViewport({toast:true,arrange:true,resetRotation:true});
      setTimeout(()=>finishRescue(btn),80);
      setTimeout(()=>finishRescue(btn),320);
    }catch(e){
      console.error('Kunne ikke samle widgets',e);
      finishRescue(btn);
    }
  }

  function lightResumeUnlock(){
    // Do not move, resize, arrange or rotate widgets.
    hardUnlockUi();
    clearUiFocusAndSelection();
  }

  document.addEventListener('pointerdown',function(ev){
    const btn=ev.target&&ev.target.closest&&ev.target.closest('#rescueWidgets');
    if(!btn)return;
    ev.preventDefault();
    ev.stopPropagation();
    if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();
    manualRescueAll(btn);
  },true);

  document.addEventListener('click',function(ev){
    const btn=ev.target&&ev.target.closest&&ev.target.closest('#rescueWidgets');
    if(!btn)return;
    ev.preventDefault();
    ev.stopPropagation();
    if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();
    finishRescue(btn);
  },true);

  document.addEventListener('pointerdown',function(ev){
    if(ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable="true"],.textEditor'))return;
    const handle=ev.target&&ev.target.closest&&ev.target.closest('.chrome,.mini button,.resize,.rotater,.widget');
    if(handle)clearUiFocusAndSelection();
  },true);

  function enforceLinkMinSize(){
    try{
      const sl=typeof slide==='function'?slide():null;
      if(!sl||!Array.isArray(sl.widgets))return;
      let changed=false;
      sl.widgets.forEach(w=>{
        if(w.type==='link'){
          if(Number(w.w||0)<260){w.w=260;changed=true;}
          if(Number(w.h||0)<170){w.h=170;changed=true;}
        }
      });
      if(changed){
        if(typeof save==='function')save();
        document.querySelectorAll('.widget[data-type="link"]').forEach(el=>{
          const id=el.dataset.id;
          const w=sl.widgets.find(x=>String(x.id)===String(id));
          if(w){el.style.width=w.w+'px';el.style.height=w.h+'px';}
        });
      }
    }catch(e){}
  }

  document.addEventListener('pointerup',()=>setTimeout(enforceLinkMinSize,20),true);
  // On resize/orientation: only keep link minimums. Do NOT reposition/scale/rotate all widgets.
  window.addEventListener('resize',()=>setTimeout(enforceLinkMinSize,120),{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(enforceLinkMinSize,250),{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(lightResumeUnlock,120)});
  window.addEventListener('pageshow',()=>setTimeout(lightResumeUnlock,120),{passive:true});
  window.tavleLightResumeUnlock=lightResumeUnlock;
})();

    function moveOverviewSelection(dir){
      const items=currentOverviewItems();
      if(!items.length) return;
      const cols=Math.max(1,overviewCols||1);
      let next=activeIndex;
      if(dir==='right') next=activeIndex+1;
      if(dir==='left') next=activeIndex-1;
      if(dir==='down') next=activeIndex+cols;
      if(dir==='up') next=activeIndex-cols;
      setOverviewSelection(next);
    }
    function selectedOverviewWidget(){ return currentOverviewItems()[activeIndex] || currentOverviewItems()[0] || null; }

    function capture(){
      beforeState={
        bodyClasses:document.body.className,
        appClasses:app.className,
        selected:document.querySelector('.widget.selected') ? getId(document.querySelector('.widget.selected')) : '',
        wasFocus:isRealFocusActive()
      };
      stored=widgets().map(el=>({
        el:el,id:getId(el),
        left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height,
        transform:el.style.transform,transformOrigin:el.style.transformOrigin,zIndex:el.style.zIndex,
        transition:el.style.transition,pointerEvents:el.style.pointerEvents
      }));
    }
    function restore(){
      stored.forEach(s=>{
        const el=s.el && s.el.isConnected ? s.el : (s.id?document.querySelector('.widget[data-id="'+cssEscape(s.id)+'"]'):null);
        if(!el) return;
        el.style.left=s.left; el.style.top=s.top; el.style.width=s.width; el.style.height=s.height;
        el.style.transform=s.transform; el.style.transformOrigin=s.transformOrigin; el.style.zIndex=s.zIndex;
        el.style.transition=s.transition; el.style.pointerEvents=s.pointerEvents;

      });

      const wasFocus=!!(beforeState && beforeState.wasFocus);
      overviewOpen=false;
      app.classList.remove('widgetOverviewMode');
      document.body.classList.remove('widgetOverviewMode');
      setButtonActive(false);
      if(hint){ hint.remove(); hint=null; }
      restore();
      restoreModeClassesFromBefore();
      if(chosen){
        if(opts.maximize) maximizeChosenWidget(chosen);
        else if(opts.focus || wasFocus) focusChosenWidget(chosen);
        else selectWidget(chosen);
      }
      beforeState=null;
      try{ if(typeof window.toast==='function') window.toast(chosen?(opts.focus?'Widget i fokus':(opts.maximize?'Widget maksimeret':'Widget valgt')):'Widget-overblik lukket'); }catch(_e){}
    }
    function openOverview(){
      if(overviewOpen){ closeOverview(); return; }

      removeFocusModeClasses();
      app.classList.add('widgetOverviewMode');

      const rect=app.getBoundingClientRect();
      const topPad=86, bottomPad=118, sidePad=28, gap=12;
      const availW=Math.max(260, rect.width - sidePad*2);
      const availH=Math.max(220, rect.height - topPad - bottomPad);
      const n=ws.length;
      let best={cols:1,rows:n,score:Infinity,w:availW,h:availH};
      for(let cols=1; cols<=Math.min(n,5); cols++){
        const rows=Math.ceil(n/cols);
        const cellW=(availW-gap*(cols-1))/cols;
        const cellH=(availH-gap*(rows-1))/rows;
        const ratio=cellW/cellH;
        const score=Math.abs(Math.log(ratio/1.45)) + rows*.08;
        if(score<best.score) best={cols:cols,rows:rows,score:score,w:cellW,h:cellH};
      }
      overviewCols=Math.max(1,best.cols||1);
      const gridW=best.cols*best.w+(best.cols-1)*gap;
      const startX=Math.max(sidePad,(rect.width-gridW)/2);
      const startY=topPad;
      ws.forEach((el,i)=>{
        const col=i%best.cols, row=Math.floor(i/best.cols);
        const x=startX+col*(best.w+gap), y=startY+row*(best.h+gap);
        const oldW=el.offsetWidth||360, oldH=el.offsetHeight||240;
        const scale=Math.min(best.w/oldW, best.h/oldH, 1.05);
        const shownW=Math.max(150, Math.min(best.w, oldW*scale));
        const shownH=Math.max(105, Math.min(best.h, oldH*scale));
        el.style.transition='left .18s ease, top .18s ease, width .18s ease, height .18s ease, transform .18s ease, box-shadow .18s ease';
        el.style.left=Math.round(x+(best.w-shownW)/2)+'px';
        el.style.top=Math.round(y+(best.h-shownH)/2)+'px';
        el.style.width=Math.round(shownW)+'px';
        el.style.height=Math.round(shownH)+'px';
        el.style.transform='rotate(0deg)';
        el.style.transformOrigin='center center';
        el.style.zIndex=String(7000+i);
        el.style.pointerEvents='auto';
        el.classList.add('widgetOverviewItem');
        el.classList.remove('selected','focused','focusTarget');
      });
      const selectedId=(beforeState&&beforeState.selected)||'';
      activeIndex=Math.max(0, ws.findIndex(el=>getId(el)===selectedId));
      setOverviewSelection(activeIndex);
      hint=document.createElement('div');
      hint.className='widgetOverviewHint';
      hint.textContent='Widget-overblik: pile vælger i grid · Enter/tap åbner · F fokus · Shift+F maksimerer · ESC lukker';
      app.appendChild(hint);
      try{ if(typeof window.toast==='function') window.toast('Widget-overblik'); }catch(_e){}
    }

    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      if(overviewOpen) closeOverview(); else openOverview();
    });

    document.addEventListener('click',function(e){
      if(!overviewOpen) return;
      const w=e.target && e.target.closest && e.target.closest('.widgetOverviewItem');
      if(w){
        e.preventDefault(); e.stopPropagation();
        closeOverview(w);
        return;
      }
      if(e.target===btn || (e.target.closest && e.target.closest('#widgetCycle'))) return;
      if(e.target.closest && e.target.closest('.topbar')) return;
      e.preventDefault(); e.stopPropagation();
      closeOverview();
    },true);

    window.addEventListener('keydown',function(e){
      const key=String(e.key||'');
      const lower=key.toLowerCase();
      if((e.metaKey || e.ctrlKey) && !e.altKey && lower==='o'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        if(overviewOpen) closeOverview(); else openOverview();
        return;
      }
      if(!overviewOpen) return;
      /* v7: In overview, Cmd/Ctrl+Left/Right moves the selected widget to another board.
         Close overview first so temporary grid layout is never saved as widget geometry. */
      if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (key==='ArrowRight' || key==='ArrowLeft')){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        const chosen=selectedOverviewWidget();
        const dir=key==='ArrowRight' ? 1 : -1;
        closeOverview(chosen);
        setTimeout(function(){
          try{
            const id=getId(chosen);
            if(id){
              if(typeof window.select==='function') window.select(id);
              else if(typeof window.selectWidget==='function') window.selectWidget(id);
            }
            if(typeof moveSelectedWidgetBySlideDirection==='function') moveSelectedWidgetBySlideDirection(dir);
          }catch(_e){}
        },20);
        return;
      }
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter','Escape'].includes(key) || lower==='f'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      }
      if(key==='Escape'){
        closeOverview();
      }else if(key==='Enter'){
        closeOverview(selectedOverviewWidget());
      }else if(key==='ArrowRight'){
        moveOverviewSelection('right');
      }else if(key==='ArrowLeft'){
        moveOverviewSelection('left');
      }else if(key==='ArrowDown'){
        moveOverviewSelection('down');
      }else if(key==='ArrowUp'){
        moveOverviewSelection('up');
      }else if(lower==='f' && e.shiftKey){
        closeOverview(selectedOverviewWidget(),{maximize:true});
      }else if(lower==='f'){
        closeOverview(selectedOverviewWidget(),{focus:true});
      }
    },true);

    window.closeWidgetOverview=closeOverview;
    window.openWidgetOverview=openOverview;
    window.toggleWidgetOverview=function(){ if(overviewOpen) closeOverview(); else openOverview(); };
    setButtonActive(false);
  });
})();
</script>

    function afterNav(e){
      const k=String(e.key||'');
      if(isOverview()){
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)) setTimeout(normalizeOverviewSelection,0);

    document.addEventListener('keyup',afterNav,true);
    document.addEventListener('click',function(e){
      setTimeout(function(){ if(isOverview()) normalizeOverviewSelection(); else normalizeSelectedFocus(); },0);
    },true);

    /* Last-resort sync while in focus/overview after external handlers have changed selection. */
    let lastSel='';
    setInterval(function(){
      try{
        if(isOverview()){
          normalizeOverviewSelection();
          return;

        const sel=document.querySelector('.widget.selected') || document.querySelector('.widget.focused') || document.querySelector('.widget.focusTarget');
        const id=sel && sel.dataset ? String(sel.dataset.id||'') : '';
        if(id && (id!==lastSel || isFocusActive())){
          lastSel=id;
          normalizeSelectedFocus();
        }
      }catch(_e){}
    },250);
  });
})();

</script>

<script id="widget-overview-v8-fixed-clean-overview-slide-reset">
(function(){
  function ready(fn){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true}); else fn(); }
  ready(function(){
    var app=document.getElementById('app');
    if(!app) return;

    if(!document.getElementById('widget-overview-v8-fixed-style')){
      var st=document.createElement('style');
      st.id='widget-overview-v8-fixed-style';
      st.textContent=[
        /* Overview skal være ren: ingen topbar/toolbar, kun tavletitel bliver stående. */
        'body.widgetOverviewMode .topbar{display:none!important;opacity:0!important;pointer-events:none!important}',

        'body:not(.widgetOverviewMode) .widget.selected,body:not(.widgetOverviewMode) .widget.focused,body:not(.widgetOverviewMode) .widget.focusTarget{z-index:214748250!important}',
        'body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected{outline:6px solid #6d5dfc!important;box-shadow:0 0 0 4px rgba(109,93,252,.30),0 22px 52px rgba(0,0,0,.44)!important;z-index:214748250!important}'
      ].join('\n');
      document.head.appendChild(st);
    }

    function overviewOn(){ return document.body.classList.contains('widgetOverviewMode') || app.classList.contains('widgetOverviewMode'); }
    function clearFocusAndMax(){
      var classes=['focus-mode','focus-edit','focus-presentation','focus-maximized','focusMode','maximized-from-edit','maximizedFocus','focusMaximized'];
      classes.forEach(function(c){ document.body.classList.remove(c); app.classList.remove(c); });
      document.querySelectorAll('.widget').forEach(function(w){
        w.classList.remove('focused','focusTarget','maximized','maximizedFocus','focusMaximized');
        w.style.opacity='';
        w.style.filter='';
        w.style.visibility='';
      });
      document.querySelectorAll('#focusExit,#maxEmergencyExit,.focusExit,.maxEmergencyExit').forEach(function(el){
        if(el && el.style) el.style.display='none';
      });
    }

    /* Åbner overview rent, også hvis man kom fra fokus/maksimeret. Den gamle overview-logik husker stadig, om fokus var aktivt. */
    var openOld=window.openWidgetOverview;
    if(typeof openOld==='function' && !openOld.__v8FixedWrapped){
      var openNew=function(){
        var r=openOld.apply(this,arguments);
        setTimeout(function(){
          if(overviewOn()){
            clearFocusAndMax();
            document.body.classList.add('widgetOverviewMode');
            app.classList.add('widgetOverviewMode');
          }
        },0);
        return r;
      };
      openNew.__v8FixedWrapped=true;
      window.openWidgetOverview=openNew;
      window.toggleWidgetOverview=function(){
        if(overviewOn() && typeof window.closeWidgetOverview==='function') window.closeWidgetOverview();
        else window.openWidgetOverview();
      };
    }

    function wrapBoardChange(name){
      var old=window[name];
      if(typeof old!=='function' || old.__v8FixedWrapped) return;
      var fn=function(){
        if(overviewOn() && typeof window.closeWidgetOverview==='function') window.closeWidgetOverview();
        clearFocusAndMax();
        var r=old.apply(this,arguments);
        setTimeout(clearFocusAndMax,0);
        setTimeout(clearFocusAndMax,80);
        return r;
      };
      fn.__v8FixedWrapped=true;
      window[name]=fn;
    }
    wrapBoardChange('nextSlide');
    wrapBoardChange('prevSlide');

    /* Topbar-knapper og almindeligt tastatur-tavleskift må ikke trække fokus/max med over på næste tavle. */
    ['prev','next'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){ el.addEventListener('click',function(){ setTimeout(clearFocusAndMax,0); setTimeout(clearFocusAndMax,80); },true); }
    });
    document.addEventListener('keydown',function(e){
      var key=e.key||'';
      var lower=String(key).toLowerCase();
      if((e.metaKey||e.ctrlKey) && !e.altKey && !e.shiftKey && lower==='o'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        if(typeof window.toggleWidgetOverview==='function') window.toggleWidgetOverview();

      if(!overviewOn() && (key==='ArrowLeft' || key==='ArrowRight') && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey){
        setTimeout(clearFocusAndMax,0);
        setTimeout(clearFocusAndMax,80);
      }
    },true);
  });
})();
</script>
