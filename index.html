/* v1.0.16-dev: updated keyboard shortcuts */
(function(){
  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }
  ready(function(){
    const appEl=document.getElementById('app');
    const modalBackEl=document.getElementById('modalBack');
    let modeToastTimer=null;

    function isEditableElement(el){
      return !!(el && (
        (el.matches && el.matches('input,textarea,select,[contenteditable=\"true\"]')) ||
        el.isContentEditable ||
        (el.closest && el.closest('input,textarea,select,[contenteditable=\"true\"]'))
      ));
    }
    function isTyping(ev){
      // Brug både event target og activeElement. På iPad/Chrome kan activeElement være ustabilt
      // ved widgets med egne pointer-/focus-lag, mens event target stadig er korrekt.
      return isEditableElement(ev && ev.target) || isEditableElement(document.activeElement);
    }
    function modalOpen(){
      if(!modalBackEl) return false;
      const cs=getComputedStyle(modalBackEl);
      return cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0';
    }
    function ensureModeToast(){
      let el=document.getElementById('presentationModeToast');
      if(!el){
        el=document.createElement('div');
        el.id='presentationModeToast';
        el.className='presentationModeToast';
        document.body.appendChild(el);
      }
      return el;
    }
    window.showPresentationModeIndicator=function(){
      const on=!!(appEl && appEl.classList.contains('present'));
      const el=ensureModeToast();
      el.textContent=on?'Præsentation':'Redigering';
      el.className='presentationModeToast show '+(on?'present':'edit');
      clearTimeout(modeToastTimer);
      modeToastTimer=setTimeout(()=>el.classList.remove('show'),1100);
    };
    function togglePresentationFromShortcut(){
      const btn=document.getElementById('present');
      if(btn){
        // rely on the normal present button handler which updates UIState
        btn.click();
      } else if(appEl){
        // toggle the present class directly and update UIState accordingly
        const wasPresent=appEl.classList.contains('present');
        appEl.classList.toggle('present');
        UIState.mode = wasPresent ? 'editing' : 'presentation';
        try{ applyUIState(); }catch(_e){}
      }
      if(window.showPresentationModeIndicator) setTimeout(window.showPresentationModeIndicator,20);
    }
    // Keyboard shortcuts are kept in one table so functionality and help text stay in sync.
    const TAVLE_SHORTCUTS = {
      plain: {
        p: {label:'Skift redigering/præsentation', run:()=>togglePresentationFromShortcut()},
        r: {label:'Skift redigering/præsentation', run:()=>togglePresentationFromShortcut()},
        f: {label:'Fokus på valgt widget', run:api=>api.toggleFocusShortcut&&api.toggleFocusShortcut()},
        n: {label:'Ny tavle', run:api=>api.newSlideShortcut&&api.newSlideShortcut()},
        t: {label:'Værktøjslinje til/fra', run:api=>{
          if(api.toggleToolbarShortcut) api.toggleToolbarShortcut();
          else {
            const hidden=document.body.classList.contains('toolbar-is-hidden') || appEl.classList.contains('toolbarHidden');
            document.body.classList.toggle('toolbar-is-hidden', !hidden);
            appEl.classList.toggle('toolbarHidden', !hidden);
            try{ if(window.UIState) window.UIState.toolbarVisible = hidden; }catch(_e){}
          }
        }}
      },
      shift: {
        f: {label:'Maksimer valgt/fokuseret widget', run:api=>api.toggleMaximizedFocusShortcut&&api.toggleMaximizedFocusShortcut()},
        d: {label:'Duplikér aktiv tavle', run:api=>api.duplicateSlideShortcut&&api.duplicateSlideShortcut()},
        a: {label:'Tekst', widget:'a'},
        p: {label:'PDF', widget:'p'},
        i: {label:'Billede', widget:'i'},
        l: {label:'Link', widget:'l'},
        t: {label:'Timer', widget:'t'},
        u: {label:'Ur', widget:'u'},
        h: {label:'HTML', widget:'y'},
        j: {label:'Hjul', widget:'h'},
        r: {label:'Grupper', widget:'r'},
        s: {label:'Ordsky', widget:'s'},
        v: {label:'Video', widget:'v'},
        x: {label:'Afstemning', widget:'x'},
        m: {label:'Baggrund', widget:'m'},
        g: {label:'Grid', widget:'g'},
        b: {label:'Backup', widget:'b'},
        o: {label:'Hints til/fra', widget:'o'},
        n: {label:'Værktøjslinje til/fra (gammel)', run:()=>{
          const hidden=document.body.classList.contains('toolbar-is-hidden') || appEl.classList.contains('toolbarHidden');
          document.body.classList.toggle('toolbar-is-hidden', !hidden);
          appEl.classList.toggle('toolbarHidden', !hidden);
          try{
            if(window.UIState) window.UIState.toolbarVisible = hidden;
          }catch(_e){}
        }},
        '?': {label:'Hjælp', widget:'?'}
      }
    };
    window.TAVLE_SHORTCUTS = TAVLE_SHORTCUTS;

    function normalizeShortcutKey(e){
      const key=(e.key||'').toLowerCase();
      return (key==='?' || key==='/') ? '?' : key;
    }
    function runShortcut(e, entry, api){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();

      if(entry.run){
        entry.run(api);
        return true;
      }
      if(entry.widget && api.createShortcutWidget){
        api.createShortcutWidget(entry.widget);
        return true;
      }
      return false;
    }

    document.addEventListener('keydown',function(e){
      if(window.isIframeControlActive && window.isIframeControlActive()){
        if(e.key==='Escape' && window.clearIframeControl){
          e.preventDefault();
          window.clearIframeControl();
        }
        return;
      }
      if(e.defaultPrevented) return;
      if(isTyping(e) || modalOpen()) return;
      if((e.metaKey || e.ctrlKey) && !e.altKey){
        const modKey=normalizeShortcutKey(e);
        const api=window.tavleShortcutAPI||{};
        if(modKey==='d' && api.duplicateSelectedWidgetShortcut){
          e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
          api.duplicateSelectedWidgetShortcut();
          return;
        }
        if(modKey==='s' && api.saveShortcut){
          e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
          api.saveShortcut();
          return;
        }
        return;
      }
      if(e.altKey) return;

      const key=normalizeShortcutKey(e);
      const api=window.tavleShortcutAPI;

      if(!e.shiftKey && TAVLE_SHORTCUTS.plain[key]){
        runShortcut(e,TAVLE_SHORTCUTS.plain[key],api||{});
        return;
      }

      if(e.shiftKey && TAVLE_SHORTCUTS.shift[key]){
        if(!api && TAVLE_SHORTCUTS.shift[key].widget) return;
        runShortcut(e,TAVLE_SHORTCUTS.shift[key],api||{});
        return;
      }
    },true);
    const presentBtn=document.getElementById('present');
    if(presentBtn && !presentBtn.__modeIndicatorWired_v108){
      presentBtn.addEventListener('click',()=>setTimeout(window.showPresentationModeIndicator,40),true);
      presentBtn.__modeIndicatorWired_v108=true;
    }
  });
})();
</script>
<script>
(()=>{
const app=document.getElementById('app'), titleEl=document.getElementById('title'), draw=document.getElementById('draw'), ctx=draw.getContext('2d');
const modalBack=document.getElementById('modalBack'), modal=document.getElementById('modal'), fileInput=document.getElementById('fileInput');
const KEY='maans_interaktiv_tavle_v162_test'; let selected=null, z=20, drawMode='pen', isDrawing=false, timerHandles={};
let activeIframeWidgetId=null;
function isIframeControlActive(){
  return !!activeIframeWidgetId;
}
function setIframeControl(id,on){
  activeIframeWidgetId=on?String(id):null;
  document.body.classList.toggle('iframe-control-active',!!activeIframeWidgetId);
  if(!activeIframeWidgetId)document.querySelectorAll('.widget.htmlInteractive').forEach(el=>el.classList.remove('htmlInteractive'));
  document.querySelectorAll('.widget').forEach(el=>{
    el.classList.toggle('linkIframeActive',!!activeIframeWidgetId && String(el.dataset.id)===activeIframeWidgetId);
  });
}
function clearIframeControl(){
  setIframeControl(null,false);
}
function syncIframeControl(){
  if(!activeIframeWidgetId)return;

  if(!el)clearIframeControl();
  else setIframeControl(activeIframeWidgetId,true);

window.isIframeControlActive=isIframeControlActive;
window.setIframeControl=setIframeControl;
window.syncIframeControl=syncIframeControl;
window.clearIframeControl=clearIframeControl;



/* v1.0.41: Isoler localStorage når Tavle kører inde i en Link-widget/iframe.
   Problemet var, at en iframe med samme origin (fx maans.github.io/Tavle inde i Tavle)
   læste de samme maans_* localStorage-nøgler som hovedappen og derfor viste samme tavle.
   Løsning: Når appen er embedded, får alle maans_* nøgler automatisk et separat scope.
   Link-widgetten tilføjer selv ?tavle_embed_scope=<widget-id> til Tavle-links, så flere
   indlejrede tavler også får hver sin lille "sandkasse". */
(function(){
  try{
    if(window.self===window.top) return;
    const params=new URLSearchParams(window.location.search||'');
    const rawScope=params.get('tavle_embed_scope') || params.get('tavleStorageScope') || 'embedded';
    const safeScope=String(rawScope).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,48) || 'embedded';
    const prefix='maans_iframe_'+safeScope+'__';
    const proto=Storage.prototype;
    if(proto.__maansTavleScopedStoragePatched) return;
    const nativeGet=proto.getItem;
    const nativeSet=proto.setItem;
    const nativeRemove=proto.removeItem;
    const nativeKey=proto.key;
    const mapKey=function(k){
      k=String(k||'');
      return /^maans_/.test(k) ? prefix+k : k;
    };
    proto.getItem=function(k){return nativeGet.call(this,mapKey(k));};
    proto.setItem=function(k,v){return nativeSet.call(this,mapKey(k),v);};
    proto.removeItem=function(k){return nativeRemove.call(this,mapKey(k));};
    proto.key=function(i){return nativeKey.call(this,i);};
    Object.defineProperty(proto,'__maansTavleScopedStoragePatched',{value:true,configurable:false});
    window.__TAVLE_IFRAME_STORAGE_SCOPE__=safeScope;
  }catch(e){
    console.warn('Tavle iframe storage-scope kunne ikke aktiveres',e);
  }
})();

function tavleIsSameAppUrl(url){
  try{
    const u=new URL(String(url||''),window.location.href);
    const here=new URL(window.location.href);
    const norm=p=>String(p||'/').replace(/\/index\.html$/,'/').replace(/\/+$/,'/');
    return u.origin===here.origin && norm(u.pathname)===norm(here.pathname);
  }catch(e){return false}
}
function tavleIframeSrc(url,w){
  try{
    const u=new URL(String(url||''),window.location.href);
    if(tavleIsSameAppUrl(u.href)){
      u.searchParams.set('tavle_embed_scope',(w&&w.id)?String(w.id):('widget_'+Date.now()));
      return u.href;
    }
  }catch(e){}
  return url;
}

  /*
   * Central UI state
   *
   * The board has grown to support multiple modes (editing vs presentation),
   * selection, focus and maximized widgets, and toolbar pinning/visibility.  In
   * older versions these pieces of state were scattered across a handful of
   * globals and DOM classes.  Here we introduce a single `UIState` object
   * which holds the authoritative values for these flags.  Whenever UI
   * behaviour changes (selecting a widget, entering focus/presentation, pinning
   * the toolbar), update this object and call `applyUIState()` to
   * synchronise the DOM.  This makes it much easier to reason about the
   * current mode of the application.
   */
  const UIState = {
    // 'editing' or 'presentation'
    mode: 'editing',
    // id of the currently selected widget (string), or null
    selectedWidgetId: null,
    // id of the widget in focus mode (string), or null
    focusedWidgetId: null,
    // id of the maximized widget in focus mode (string), or null
    maximizedWidgetId: null,
    // whether the toolbar is pinned (persisted to localStorage)
    toolbarPinned: (localStorage.getItem('maans_toolbar_pinned') === '1'),
    // whether the toolbar is visible at the moment
    toolbarVisible: true,
    // current focus mode: null | 'edit' | 'presentation'
    focusMode: null,
    // true while a widget is temporarily maximized
    focusMaximized: false
  };

  /**
   * Toolbar controller
   *
   * All toolbar-related operations funnel through this object.  Calling
   * `Toolbar.show()` or `Toolbar.hide()` updates both the DOM and
   * `UIState.toolbarVisible`.  Pinning/unpinning persists to
   * localStorage.
   */
  const Toolbar = {
    show(){
      document.body.classList.remove('toolbar-is-hidden');
      app.classList.remove('toolbarHidden');
      UIState.toolbarVisible = true;
    },
    hide(){
      document.body.classList.add('toolbar-is-hidden');
      document.body.classList.add('hints-in-toolbar-space');
      app.classList.add('toolbarHidden');
      UIState.toolbarVisible = false;
    },
    toggle(){
      if(UIState.toolbarVisible) this.hide(); else this.show();
    },
    pin(){
      UIState.toolbarPinned = true;
      document.body.classList.remove('hints-in-toolbar-space');
      this.show();
      try{ localStorage.setItem('maans_toolbar_pinned','1'); }catch(_e){}
      if(typeof updatePinButtons==='function') updatePinButtons();
    },
    unpin(){
      UIState.toolbarPinned = false;
      try{ localStorage.removeItem('maans_toolbar_pinned'); }catch(_e){}
      if(typeof updatePinButtons==='function') updatePinButtons();
    },
    togglePin(){
      UIState.toolbarPinned ? this.unpin() : this.pin();
    }
  };

  /**
   * Apply UI state to the DOM.
   *
   * This function synchronises the CSS classes of the application with the
   * current `UIState` values.  It updates selection highlighting,
   * focus/maximized widgets, presentation mode, and pinned toolbars.  Call
   * this after mutating `UIState`.
   */
  function applyUIState(){
  try{syncFocusBodyClasses();}catch(_e){}
    // update overall mode
    app.classList.toggle('present', UIState.mode === 'presentation');
    // focus-mode must only be active when the user has explicitly entered
    // focus mode or maximized a widget. A remembered focusedWidgetId alone

/*
 * The app can be run from a local file (file://), via GitHub Pages or
 * wrapped in an iframe/Quine.  When running from a local file the code
 * prefixes relative asset paths with the GitHub base so assets are
 * discoverable offline.  When loaded in an iframe (for example the
 * HTML-widget preview) the inner document runs at a blob: or about:
 * origin which confuses the original detection.  To support runtime
 * configuration we expose a couple of globals on window and compute
 * whether we should apply the fallback on demand.
 */

// Default base for assets hosted in the Tavle repository.  This value can
// be overridden by parent contexts via postMessage (see below).
const DEFAULT_TAVLE_ASSET_BASE='https://maans.github.io/Tavle/';
// If a parent document defines window.TAVLE_ASSET_BASE we honour that,
// otherwise fall back to the default.
if(typeof window.TAVLE_ASSET_BASE==='undefined'){
  window.TAVLE_ASSET_BASE=DEFAULT_TAVLE_ASSET_BASE;
}

// Helper to decide if the app should load assets from the remote base.
// When running from a local file the location protocol is 'file:', but
// this flag may be overridden at runtime by the parent context via
// postMessage.  See message listener below.
function isRunningFromFile(){
  // Prefer an explicitly configured value on the window.  Only accept
  // booleans to avoid overriding with undefined or strings.
  if(typeof window.RUNNING_FROM_FILE==='boolean'){
    return window.RUNNING_FROM_FILE;
  }
  return location.protocol==='file:';
}

// Asset resolver.  Given a relative path this function prefixes the
// configured base if we determine the app is running from a local file.
function resolveAssetPath(path){
  path=String(path||'').trim();
  if(!path)return '';
  // leave data:, blob:, http(s) URLs untouched
  if(/^data:/i.test(path) || /^blob:/i.test(path) || /^https?:\/\//i.test(path))return path;
  // remove leading './'
  path=path.replace(/^\.\//,'');
  const running=isRunningFromFile();
  const base=window.TAVLE_ASSET_BASE || DEFAULT_TAVLE_ASSET_BASE;
  return running ? (base + path) : path;
}

// Listen for environment messages from parent contexts (e.g. the
// HTML-widget preview).  When a message contains a `tavle_env` key we
// update global flags accordingly.  Only boolean values are accepted for
// RUNNING_FROM_FILE; any truthy string for TAVLE_ASSET_BASE will be used.
window.addEventListener('message',event=>{
  try{
    const env=event.data&&event.data.tavle_env;
    if(!env)return;
    if(typeof env.RUNNING_FROM_FILE==='boolean'){
      window.RUNNING_FROM_FILE=env.RUNNING_FROM_FILE;
    }
    if(env.TAVLE_ASSET_BASE){
      window.TAVLE_ASSET_BASE=env.TAVLE_ASSET_BASE;
    }
  }catch(_e){}
});

function renderClock(){
  if(!clockEl)return;
  const s=Object.assign({enabled:false,style:'glass',position:'bottomRight',date:true,seconds:false,format24:true,focus:false},clockSettings());
  const clockStyle=s.style||'glass';
  const clockPos=s.position||'bottomRight';
  const sceneCompact=(clockStyle==='stage' && clockPos!=='bottomCenter');
  document.body.classList.toggle('clock-focus-visible', !!s.focus);
  clockEl.className='globalClock '+(s.enabled?'':'hiddenClock')+' '+clockStyle+' clockPos-'+clockPos+(s.seconds?' clockHasSeconds':'')+(sceneCompact?' clockSceneCompact':'');
  if(!s.enabled)return;
  const now=new Date();
  if(s.style==='analog'){
    const h=now.getHours()%12, m=now.getMinutes(), sec=now.getSeconds();
    const hr=(h*30)+(m/2), mn=m*6, sc=sec*6;
    clockEl.innerHTML=`<div class="clockFace"><div class="clockHand hour" style="transform:rotate(${hr}deg)"></div><div class="clockHand min" style="transform:rotate(${mn}deg)"></div><div class="clockHand sec" style="transform:rotate(${sc}deg)"></div><div class="clockDot"></div></div>`;
    return;
  }
  const opts={hour:'2-digit',minute:'2-digit',hour12:!s.format24};
  if(s.seconds)opts.second='2-digit';
  const time=now.toLocaleTimeString('da-DK',opts);
  const date=s.date?now.toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short'}):'';
  clockEl.innerHTML=`<div class="clockTime">${time}</div>${date?`<div class="clockDate">${date}</div>`:''}`;
}

  let changed=0, x=b.x, y=b.y, rowH=0;
  widgets.forEach((w,i)=>{
    const before=[w.x,w.y,w.w,w.h,w.rotation||0].join('|');
    fitWidgetToViewport(w,{resetRotation:opts.resetRotation!==false});
    if(opts.arrange){

// Parse a delimited text file into a dataset object.  If a header row is
// present the first row will be used as column names.  Otherwise columns
// are named generically (col1, col2, ...).  A best-effort delimiter
// detection is performed: tab, semicolon or comma.
function parseDatasetFromText(text,name){
  text=String(text||'');
  // remove BOM
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(!lines.length){return null;}
  // guess delimiter based on first non-empty line
  let delim=',';
  const first=lines[0];
  const counts={comma:(first.match(/,/g)||[]).length, semicolon:(first.match(/;/g)||[]).length, tab:(first.match(/\t/g)||[]).length};
  const maxDelim=Object.entries(counts).reduce((a,b)=>a[1]>=b[1]?a:b);
  if(maxDelim[1]>0){if(maxDelim[0]==='tab') delim='\t'; else if(maxDelim[0]==='semicolon') delim=';'; else delim=',';}
  // simple CSV parser: split on delimiter outside of quotes.  Quotes may
  // contain escaped quotes.
  function splitLine(line){
    const arr=[];
    let cur='';
    let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(inQuotes && line[i+1]==='"'){cur+= '"'; i++; continue;}
        inQuotes=!inQuotes;
        continue;
      }
      if(!inQuotes && ch===delim){arr.push(cur);cur='';continue;}
      cur+=ch;
    }
    arr.push(cur);
    return arr;
  }
  const rows=lines.map(splitLine);
  let columns=[];
  // check if first row is header: treat as header if all cells are non-empty strings and not all numeric
  const headerCandidate=rows[0];
  const numericCells=headerCandidate.filter(c=>/^\s*-?\d+(\.\d+)?\s*$/.test(c)).length;
  const isHeader=numericCells< headerCandidate.length/2;
  if(isHeader){
    columns=headerCandidate.map(c=>String(c||'').trim()||'Kolonne');
    rows.shift();
  }else{
    const maxLen=Math.max(...rows.map(r=>r.length));
    columns=Array.from({length:maxLen},(_,i)=>'Kolonne '+(i+1));
  }
  // normalize rows length
  const normalized=rows.map(r=>{
    const arr=Array.from({length:columns.length},(_,i)=>String(r[i]||'').trim());
    return arr;
  });
  return {
    id:'ds'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name: name || 'Datasæt',
    type:'csv',
    columns:columns,
    rows:normalized,
    sourceName:name||'',
    importedAt:Date.now()

}

function extFromDataUrl(dataUrl,fallback='bin'){
  const m=String(dataUrl||'').match(/^data:([^;,]+)/);
  const type=m?m[1]:'';
  if(type.includes('pdf'))return 'pdf';
  if(type.includes('png'))return 'png';
  if(type.includes('jpeg')||type.includes('jpg'))return 'jpg';
  if(type.includes('webp'))return 'webp';
  if(type.includes('gif'))return 'gif';
  if(type.includes('svg'))return 'svg';
  if(type.includes('html'))return 'html';
  if(type.includes('plain'))return 'txt';
  return fallback;
}
function safeFileName(name,ext){
  name=String(name||'fil').replace(/[\\/:*?"<>|]+/g,'-').trim()||'fil';

  return name;
}

  const a=document.createElement('a');
  const ext=extFromDataUrl(dataUrl);
  a.href=dataUrl;
  a.download=safeFileName(filename||'medie',ext);
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function renderPdfJsWidget(w,c){
  const src=w.data.src||w.data.url||'';
  const viewer=c.querySelector('.pdfJsViewer');
  const label=c.querySelector('.pdfPageLabel');
  const prev=c.querySelector('.pdfPrev');
  const next=c.querySelector('.pdfNext');
  if(!viewer)return;
  if(!src){
    viewer.innerHTML='<div class="pdfJsEmpty">Vælg lokal PDF eller indsæt direkte PDF-URL</div>';
    if(label)label.textContent='Side –';
    if(prev)prev.disabled=true;if(next)next.disabled=true;
    return;
  }
  w.data.page=Math.max(1,Number(w.data.page||1));
  const token=(w._pdfRenderToken||0)+1;w._pdfRenderToken=token;
  pdfJsStatus(viewer,'Indlæser PDF…');
  try{
    const pdfjs=await ensurePdfJs();
    let task;
    if(isEmbeddedPdf(src)) task=pdfjs.getDocument({data:dataUrlToUint8Array(src)});
    else task=pdfjs.getDocument({url:src,withCredentials:false});
    const pdf=await task.promise;
    if(w._pdfRenderToken!==token)return;
    w._pdfDoc=pdf;
    w.data.page=Math.min(Math.max(1,w.data.page),pdf.numPages);
    w.data.pages=pdf.numPages;
    const page=await pdf.getPage(w.data.page);
    if(w._pdfRenderToken!==token)return;
    viewer.innerHTML='<canvas class="pdfJsCanvas"></canvas>';
    const canvas=viewer.querySelector('canvas');
    const ctx=canvas.getContext('2d');
    const base=page.getViewport({scale:1});
    const available=Math.max(260,viewer.clientWidth-28);
    const scale=available/base.width;
    const viewport=page.getViewport({scale});
    canvas.width=Math.floor(viewport.width);
    canvas.height=Math.floor(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    if(w._pdfRenderToken!==token)return;
    viewer.scrollTop=0;
    viewer.scrollLeft=Math.max(0,(canvas.width-viewer.clientWidth)/2);
    if(label)label.textContent='Side '+w.data.page+' / '+pdf.numPages;
    if(prev)prev.disabled=w.data.page<=1;
    if(next)next.disabled=w.data.page>=pdf.numPages;
  }catch(err){
    console.warn('PDF.js fejl',err);
    let small='Prøv at hente PDF’en lokalt og vælg den fra enheden.';
    if(isProbablyDriveUrl(src)) small='Google Drive-links virker ofte ikke direkte i widgets. Download PDF’en eller brug et direkte PDF-link.';
    pdfJsStatus(viewer,'PDF kunne ikke vises',small);
    if(label)label.textContent='Side –';
    if(prev)prev.disabled=true;if(next)next.disabled=true;
  }
}
function pdfJsGoPage(w,c,delta){
  if(!w||!w.data)return;
  const max=Number(w.data.pages||w._pdfDoc&&w._pdfDoc.numPages||0);
  const cur=Math.max(1,Number(w.data.page||1));
  const next=max?Math.min(max,Math.max(1,cur+delta)):Math.max(1,cur+delta);
  if(next===cur)return;
  w.data.page=next;
  save();
  renderPdfJsWidget(w,c);
}

function clearStuckInteractionState(){

  // We cannot reach the local drag/res/rot variables here, but a synthetic
  // pointercancel plus toolbar/app cleanup prevents most stuck UI states.
  try{
    document.querySelectorAll('.widget,.chrome,.resize,.rotater').forEach(el=>{
      try{ el.releasePointerCapture && [...(el.__activePointers||[])].forEach(id=>el.releasePointerCapture(id)); }catch(_e){}
    });
  }catch(_e){}
  document.body.classList.remove('toolbar-is-hidden');
  try{app.classList.remove('toolbarHidden')}catch(_e){}
}

function buildWordCloudItems(names,caseInsensitive=true){
  const counts=new Map();
  (names||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(line=>{
    const key=caseInsensitive?line.toLocaleLowerCase('da'):line;
    if(!counts.has(key))counts.set(key,{label:line,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[line]=(item.variants[line]||0)+1;
    // Vis den mest brugte variant af store/små bogstaver.
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });
  const items=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=items[0]?.count||1;
  return items.map(it=>{
    const scale=it.count/max;
    return {...it,size:14+scale*38,weight:400+Math.round(scale*500),opacity:.62+scale*.38};
  });
}
function renderWordCloud(w){

  return items.map(it=>`<span data-count="${esc(it.count)}" data-label="${esc(it.label)}" title="${esc(it.count+' gange')}" style="font-size:${it.size}px;font-weight:${it.weight};opacity:${it.opacity}">${esc(it.label)}</span>`).join('');
}

function randomBoardTheme(){
  // Fælles random-pulje: farve/gradient-swatches + alle billedbaggrunde.
  const swatches=(typeof TAVLE_RANDOM_SWATCHES!=='undefined' && Array.isArray(TAVLE_RANDOM_SWATCHES))
    ? TAVLE_RANDOM_SWATCHES.map(sw=>({...sw,kind:'swatch'}))
    : [];
  const images=(typeof TAVLE_BACKGROUNDS!=='undefined' && Array.isArray(TAVLE_BACKGROUNDS))
    ? TAVLE_BACKGROUNDS.filter(bg=>bg && bg.src).map(bg=>({...bg,kind:'image'}))
    : [];
  const library=[...swatches,...images];
  if(!library.length)return null;

  const used=new Set();
  try{
    (state.slides||[]).forEach(s=>{
      if(s.bgImageSource==='swatch' && s.bgImageTitle)used.add('swatch:'+s.bgImageTitle);
      if(!s.bgImage && s.bg)used.add('swatch-bg:'+String(s.bg));
      if(s.bgImage)used.add('image:'+String(s.bgImage).replace(/^.*backgrounds\//,'backgrounds/'));
    });
  }catch(_e){}

  const unused=library.filter(bg=>{
    if(bg.kind==='swatch')return !used.has('swatch:'+bg.title) && !used.has('swatch-bg:'+String(bg.bg));
    return !used.has('image:'+String(bg.src).replace(/^.*backgrounds\//,'backgrounds/'));
  });
  const pool=unused.length ? unused : library;
  return pool[Math.floor(Math.random()*pool.length)];
}

function wheelCloudItems(w){
  const counts=new Map();
  (w.data.chosen||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(x=>{
    const key=x.toLocaleLowerCase('da');
    if(!counts.has(key))counts.set(key,{label:x,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[x]=(item.variants[x]||0)+1;
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });

  const arr=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=arr[0]?.count||1;

  // Stable hand-tuned positions: largest around centre, others distributed around it.
  const slots=[
    [50,42,0],[34,35,-5],[66,36,4],[43,61,2],[60,62,-4],
    [25,52,5],[76,51,-5],[31,72,-3],[70,73,3],[22,28,-6],
    [79,27,6],[50,78,0],[18,65,4],[84,66,-4],[38,22,3],
    [63,22,-3],[28,83,2],[73,84,-2],[16,42,-4],[88,43,4],
    [47,27,-2],[56,55,5],[39,50,-5],[64,50,2]
  ];

  return arr.map((it,i)=>{
    const scale=it.count/max;
    const s=slots[i%slots.length];
    const ring=Math.floor(i/slots.length);
    const seed=(it.label.length*17+it.count*31+i*13);
    const jitterX=((seed%9)-4) + ring*1.7;
    const jitterY=(((seed*3)%9)-4) + ring*1.4;

      ...it,
      size:22+scale*64,
      opacity:.62+scale*.38,
      x:Math.max(12,Math.min(88,s[0]+jitterX)),
      y:Math.max(14,Math.min(86,s[1]+jitterY)),
      rot:s[2]
    };
  });
}

function normalizeLinkUrl(url){
  url=String(url||'').trim();
  if(!url)return '';
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  return url;

function askLink(w){
  if(!canEditWidgets())return;

  const defaultTitle='Link';
  const currentTitle=String(w.data.text||'').trim();
  const titleValue=(currentTitle && currentTitle!=='Klikbart link') ? currentTitle : defaultTitle;
  const urlValue=String(w.data.url||'').trim();

  showModal(`<h2>Link</h2>
    <p style="margin-top:0;opacity:.75;font-weight:800">Samme adresse kan vises som almindeligt link eller som indlejret webside/iframe via knappen i widgetens topbjælke.</p>
    <label>Titel
      <input id="lt" placeholder="Link" value="${esc(titleValue)}">
    </label>
    <label>Adresse
      <input id="lu" placeholder="Indsæt URL" value="${esc(urlValue)}">
    </label>
    <button id="ok">Gem</button>
    <button id="cancel">Luk</button>`);

  const titleInput=modal.querySelector('#lt');
  const urlInput=modal.querySelector('#lu');

  function selectAllOnFocus(input){
    if(!input)return;
    let selectedOnce=false;
    const doSelect=()=>{
      try{
        input.focus({preventScroll:true});
        input.setSelectionRange(0,String(input.value||'').length);
        selectedOnce=true;
      }catch(e){
        try{input.select();selectedOnce=true;}catch(_e){}
      }
    };
    input.addEventListener('focus',()=>setTimeout(doSelect,0));
    input.addEventListener('pointerdown',()=>{
      if(!selectedOnce)setTimeout(doSelect,0);
    });
    input.addEventListener('click',()=>{
      if(!selectedOnce)setTimeout(doSelect,0);
    });
    input.addEventListener('blur',()=>{selectedOnce=false;});
  }

  selectAllOnFocus(titleInput);
  selectAllOnFocus(urlInput);

  function saveLink(){
    w.data.text=titleInput.value.trim()||defaultTitle;
    w.data.url=normalizeLinkUrl(urlInput.value);
    if(!w.data.view)w.data.view='link';
    closeModal();
    render();
    save();
  }

  modal.querySelector('#ok').onclick=saveLink;
  modal.querySelector('#cancel').onclick=closeModal;

  [titleInput,urlInput].forEach(input=>{
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        saveLink();
      }
    });
  });

  setTimeout(()=>{
    try{
      titleInput.focus({preventScroll:true});
      titleInput.setSelectionRange(0,String(titleInput.value||'').length);
    }catch(e){try{titleInput.select()}catch(_e){}}
  },60);
}

  showModal(`<h2>Baggrund</h2>
    <p style="margin-top:0;opacity:.75;font-weight:800">${hasImg?'Baggrundsbillede er valgt. Justér visning, filter eller fjern billedet.':'Vælg en farve, vælg en tavlebaggrund, vælg et lokalt billede eller indsæt en billed-URL.'}</p>
    <div class="bgLibraryWrap v46">

      <div class="bgGridToggleRow"><button id="bgGridToggle" class="bgGridToggleBtn ${slide().grid?'active':''}" type="button">Gitter: ${slide().grid?'Til':'Fra'} <small>Shift+G</small></button></div>
      <div class="bgFilterBar">${filterButtons}</div>
      <div class="bgCategoryBar v46">${categoryButtons}</div>
      <div class="bgSelectorTools">
        <input id="bgSearch" type="search" placeholder="Søg fx musik, klassisk, HD, rolig, geografi…" autocomplete="off">
        <span class="bgLibraryCount" id="bgCount"></span>
      </div>
      <div class="bgGrid v46" id="bgGrid">${bgCards}</div>
    </div>
    <hr>
    <div class="bgActions">
      <button id="bgInfo">${isInfoBg?'✓ Online-infografik som baggrund':'Brug online-infografik som baggrund'}</button>
      <button id="bgImg">Vælg lokalt baggrundsbillede</button>

      <select id="fit">
        <option value="cover" ${fit==='cover'?'selected':''}>cover – fyld tavlen</option>

        <option value="auto" ${fit==='auto'?'selected':''}>auto – original størrelse</option>
      </select>

  const bgGridToggle=modal.querySelector('#bgGridToggle');

  function toggleBgGrid(){

  if(bgGridToggle)bgGridToggle.onclick=e=>{e.preventDefault();e.stopPropagation();toggleBgGrid()};

  function applyBgLibraryFilter(){
    const cat=window.__tavleBgCat||'alle';

  modal.querySelectorAll('[data-bg-cat]').forEach(btn=>btn.onclick=()=>{
    window.__tavleBgCat=btn.dataset.bgCat||'alle';
    modal.querySelectorAll('[data-bg-cat]').forEach(b=>b.classList.toggle('active',b===btn));
    applyBgLibraryFilter();
    setTimeout(()=>bgHighlight(0),0);
  });
  const searchInput=modal.querySelector('#bgSearch');
  if(searchInput)searchInput.oninput=()=>{applyBgLibraryFilter();setTimeout(()=>bgHighlight(0),0)};
  applyBgLibraryFilter();

  // Keyboardstyring for baggrundsvælger: pile markerer, Space previewer, Enter vælger/lukker, ESC gendanner/lukker.
  modalBack.classList.add('bgModalKeyboard');
  const bgOriginal={
    bg:slide().bg,
    bgImage:slide().bgImage,
    bgImageName:slide().bgImageName,

    bgImageTitle:slide().bgImageTitle,
    bgImageVersion:slide().bgImageVersion,
    bgFilter:slide().bgFilter,

  };
  let bgKbIndex=0;
  function bgVisibleCards(){
    return Array.from(modal.querySelectorAll('.bgChoice[data-bg-index]')).filter(c=>!c.classList.contains('hiddenByFilter'));
  }
  function bgHighlight(i){
    const cards=bgVisibleCards();
    modal.querySelectorAll('.bgChoice[data-bg-index]').forEach(c=>c.classList.remove('kbSelected','kbPreview'));
    if(!cards.length)return;
    bgKbIndex=Math.max(0,Math.min(cards.length-1,i));
    const card=cards[bgKbIndex];
    card.classList.add('kbSelected');
    try{card.scrollIntoView({block:'nearest',inline:'nearest'});}catch(_e){}
  }
  function bgGridColumns(){
    const cards=bgVisibleCards();
    if(cards.length<2)return 1;
    const top=cards[0].getBoundingClientRect().top;
    let cols=0;
    for(const c of cards){
      if(Math.abs(c.getBoundingClientRect().top-top)<10)cols++;
      else break;
    }
    return Math.max(1,cols||3);

  function bgFlashPreviewTransparency(){

  function bgApplyFromCard(card, permanent){

      slide().bg=item.bg;

  function bgRestore(){

  function bgKeyHandler(e){
    if(modalBack.style.display!=='flex')return;
    if(!modal || !/Baggrund/i.test(modal.textContent||''))return;
    const active=document.activeElement;
    const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    if(typing){
      if(e.key==='Enter'){
        e.preventDefault();
        active.blur();
      }else if(e.key==='Escape'){
        e.preventDefault();
        bgRestore();
        bgClose();
      }
      return;
    }
    if(e.shiftKey && String(e.key||'').toLowerCase()==='g'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      toggleBgGrid();
      return;
    }
    if(e.key==='ArrowRight'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex+1);
      return;
    }
    if(e.key==='ArrowLeft'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex-1);
      return;
    }
    if(e.key==='ArrowDown'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex+bgGridColumns());
      return;
    }
    if(e.key==='ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgHighlight(bgKbIndex-bgGridColumns());
      return;
    }
    if(/^[1-6]$/.test(e.key)){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgApplyFilterByNumber(Number(e.key));
      return;
    }
    if(e.key==='Home'){
      e.preventDefault(); e.stopPropagation(); bgClearPreviewTransparency(); bgHighlight(0); return;
    }
    if(e.key==='End'){
      e.preventDefault(); e.stopPropagation(); bgClearPreviewTransparency(); bgHighlight(bgVisibleCards().length-1); return;
    }
    if(e.key===' '){
      const cards=bgVisibleCards(), card=cards[bgKbIndex];
      if(card){
        e.preventDefault(); e.stopPropagation();
        if(modalBack.classList.contains('bgPreviewing')){
          bgClearPreviewTransparency();
        }else{
          bgApplyFromCard(card,false);
          bgFlashPreviewTransparency();
        }
      }
      return;
    }
    if(e.key==='Enter'){
      const cards=bgVisibleCards(), card=cards[bgKbIndex];
      if(card){
        e.preventDefault(); e.stopPropagation();
        bgClearPreviewTransparency();
        bgApplyFromCard(card,true);

        bgClose();
      }
      return;
    }
    if(e.key==='Escape'){
      e.preventDefault(); e.stopPropagation();
      bgClearPreviewTransparency();
      bgRestore();
      bgClose();
      return;
    }
  }
  modal.addEventListener('pointerdown',()=>bgClearPreviewTransparency(),true);
  if(window.__bgKeyHandler)document.removeEventListener('keydown',window.__bgKeyHandler,true);
  window.__bgKeyHandler=bgKeyHandler;
  document.addEventListener('keydown',bgKeyHandler,true);

  modal.querySelectorAll('[data-bg-index]').forEach(btn=>btn.onclick=()=>{
    const item=bgItems[Number(btn.dataset.bgIndex)];
    if(!item)return;
    bgApplyFromCard(btn,true);

  });

  modal.querySelector('#bgInfo').onclick=()=>{
    const img=new Image();
    img.onload=()=>{slide().bgImage=BUILTIN_INFOGRAFIK_BG;slide().bgImageName='README_infografik.png';slide().bgImageSource='builtin-url';slide().bgFilter=slide().bgFilter||'none';slide().bgFit='contain';render();save();toast('Online-infografik valgt som baggrund');bgModal()};
    img.onerror=()=>toast('Kunne ikke hente online-infografik');

function tavleDownloadTextFile(filename,text,mime='text/plain'){
  const blob=new Blob([text],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function tavlePickTextFile(accept,cb){
  const input=document.createElement('input');
  input.type='file';
  input.accept=accept||'.json,application/json';
  input.onchange=()=>{
    const f=input.files&&input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(String(r.result||''),f);
    r.onerror=()=>toast('Kunne ikke læse filen');
    r.readAsText(f,'utf-8');
  };
  input.click();
}
function tavleHarvestLists(st){
  const bank=wheelListBank();
  try{
    (st.slides||[]).forEach(sl=>(sl.widgets||[]).forEach(w=>{
      if((w.type==='wheel'||w.type==='groups')&&w.data&&Array.isArray(w.data.names)&&w.data.names.length){
        const base=w.type==='groups'?'Liste fra grupper':'Liste fra hjul';
        const name=(w.title||base).trim();
        if(!bank[name])bank[name]=w.data.names.filter(Boolean);
      }
    }));
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
  }catch(e){}
}
function tavleRestoreLists(data){
  try{
    const bank=wheelListBank();
    if(data&&data.wheelLists&&typeof data.wheelLists==='object')Object.assign(bank,data.wheelLists);
    if(data&&data.lists&&typeof data.lists==='object')Object.assign(bank,data.lists);
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
    if(!(data&&data.options&&data.options.templateOnly) && !(data&&data.state&&data.state.isTemplateOnly)){
      tavleHarvestLists(data.state||data);
    }
  }catch(e){}
}

function collectEmbeddedMedia(){
  const items=[];
  const kindLabel=(src)=>{
    const ext=extFromDataUrl(src,'bin');
    if(ext==='pdf')return 'PDF';
    if(['png','jpg','webp','gif','svg'].includes(ext))return 'Billede';
    return 'Medie';
  };
  try{
    (state.slides||[]).forEach((sl,si)=>{
      const slideName=safeSlideTitle?safeSlideTitle(sl,si):('Tavle '+(si+1));
      if(sl.bgImage&&String(sl.bgImage).startsWith('data:')){
        items.push({type:'Baggrundsbillede',slide:slideName,name:`tavle-${si+1}-baggrund`,src:sl.bgImage});
      }
      (sl.widgets||[]).forEach((w,wi)=>{
        if(w.type==='image'&&w.data&&String(w.data.src||'').startsWith('data:')){
          items.push({type:'Billede',slide:slideName,name:w.data.name||`tavle-${si+1}-billede-${wi+1}`,src:w.data.src});
        }
        if(w.type==='pdf'&&w.data&&String(w.data.src||w.data.url||'').startsWith('data:')){
          items.push({type:'PDF',slide:slideName,name:w.data.name||`tavle-${si+1}-pdf-${wi+1}`,src:w.data.src||w.data.url});
        }
        if(w.type==='text'&&w.data&&typeof w.data.text==='string'){
          const src='data:text/plain;charset=utf-8,'+encodeURIComponent(w.data.text);
          items.push({type:'Tekst',slide:slideName,name:w.data.name||w.title||`tavle-${si+1}-tekst-${wi+1}.txt`,src});
        }
        if(w.type==='html'&&w.data&&typeof w.data.html==='string'){
          const src='data:text/html;charset=utf-8,'+encodeURIComponent(w.data.html);
          items.push({type:'HTML',slide:slideName,name:w.data.name||w.title||`tavle-${si+1}-html-${wi+1}.html`,src});
        }
        if(w.type==='link'&&w.data&&w.data.srcdoc){
          const src='data:text/html;charset=utf-8,'+encodeURIComponent(w.data.srcdoc);
          items.push({type:'HTML',slide:slideName,name:w.data.text||w.title||`tavle-${si+1}-html-${wi+1}.html`,src});
        }
      });
    });
  }catch(e){}
  return items.map((it,i)=>{
    const ext=extFromDataUrl(it.src);
    return {...it,ext,filename:safeFileName(it.name,ext),label:it.type||kindLabel(it.src),id:'mediaDl'+i};
  });
}

function cleanHtmlForStandalone(htmlDoc){
  // Fjern modal/overlay/toast og midlertidige UI-tilstande, så den gemte fil ikke åbner låst.
  htmlDoc=htmlDoc.replace(/<div id="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/⏳ Forbereder fil\.\.\./g,'💾 Gem HTML + data');
  htmlDoc=htmlDoc.replace(/Forbereder HTML-fil\.\.\./g,'');
  htmlDoc=htmlDoc.replace(/disabled=""/g,'');
  htmlDoc=htmlDoc.replace(/\sdisabled(=("|')disabled\2)?/g,'');
  htmlDoc=htmlDoc.replace(/\sdata-old-text="[^"]*"/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleData"[\s\S]*?<\/script>/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleBoot"[\s\S]*?<\/script>/g,'');
  return htmlDoc;
}
function makeStandaloneHtml(){
  const cleanState=stripTransientForExport(state);
  const payload=JSON.stringify(cleanState);
  let htmlDoc=document.documentElement.outerHTML;
  htmlDoc=cleanHtmlForStandalone(htmlDoc);

  // Boot-scriptet skal ligge før appens hovedscript, så den gemte fil starter med de rigtige tavler.
  const boot=`<script id="embeddedTavleBoot">(function(){try{localStorage.setItem('maans_interaktiv_tavle_v162_test', ${JSON.stringify(payload)});}catch(e){}})();<\/script>`;

  const firstScript=htmlDoc.indexOf('<script>');
  if(firstScript!==-1)htmlDoc=htmlDoc.slice(0,firstScript)+boot+htmlDoc.slice(firstScript);
  else if(htmlDoc.includes('</head>'))htmlDoc=htmlDoc.replace('</head>',boot+'</head>');
  else htmlDoc=boot+htmlDoc;

  return '<!doctype html>\n'+htmlDoc;
}
function exportStandaloneHtml(){

function wireRobustWidgetClose(){
  if(window.__robustWidgetCloseWired)return;
  window.__robustWidgetCloseWired=true;

  const isCloseButton=(el)=>{
    if(!el)return false;
    const txt=(el.textContent||'').trim();
    const act=(el.getAttribute?.('data-act')||el.getAttribute?.('data-action')||'').toLowerCase();
    return act==='del' || act==='delete' || act==='close' ||
      el.matches?.('.close,.x,.del,.delete,.remove,[aria-label="Luk"],[title="Luk"]')
      || txt==='×' || txt==='✕' || txt==='x' || txt==='X';
  };

  const handler=(e)=>{
    let btn=e.target.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    if(!btn && (e.clientX||e.clientY)){
      const hit=document.elementFromPoint(e.clientX,e.clientY);
      btn=hit&&hit.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    }
    if(!btn||!isCloseButton(btn))return;
    const widget=btn.closest?.('.widget');
    if(!widget)return;

    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();

    const id=widget.dataset.id || widget.dataset.widgetId || widget.id;
    const now=Date.now();
    if(widget.__closeActivatedAt && now-widget.__closeActivatedAt<700)return;
    widget.__closeActivatedAt=now;
    try{
      if(typeof removeWidget==='function'){
        removeWidget(id);
        return;
      }
    }catch(err){}

    try{
      const sl=slide();
      if(sl&&Array.isArray(sl.widgets)){
        sl.widgets=sl.widgets.filter(w=>String(w.id)!==String(id));
        save({silent:true});
        render();
        return;
      }
    }catch(err){}

    widget.remove();
    try{save({silent:true})}catch(err){}
  };

  ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(ev=>{
    document.addEventListener(ev,handler,{capture:true,passive:false});
  });
}

function clearWidgetDataForTemplate(w){
  w.data = w.data || {};

  // Bevar widgettype, titel, placering, størrelse, rotation, lås osv.
  // Ryd kun det konkrete eksempelindhold.
  if(w.type==='text'){
    w.data.text='';
    w.data.html='';
  }

  if(w.type==='image'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.alt;
  }

  if(w.type==='pdf'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.page;
  }

  if(w.type==='video'){
    delete w.data.url;
    delete w.data.src;
    delete w.data.embed;
    delete w.data.title;
    delete w.data.thumbnail;
  }

  if(w.type==='link'){
    delete w.data.url;
    w.data.text=w.data.text||'Link';
  }

  if(w.type==='wheel'){
    w.data.names=[];
    w.data.chosen=[];
    w.data.selected=[];
    w.data.result=[];
    w.data.current='';
  }

  if(w.type==='groups'){
    w.data.names=[];
    w.data.groups=[];
    w.data.result=[];
    w.data.grouped=[];
  }

  if(w.type==='wordcloud'){
    w.data.names=[];
    w.data.caseInsensitive = w.data.caseInsensitive!==false;
  }

  if(w.type==='poll'){
    w.data.question=w.data.question||'Hvordan går det?';
    w.data.options=w.data.options||['😀','🙂','😐','🙁','😡'];
    w.data.votes=w.data.options.map(()=>0);
    w.data.cloudView=false;
    w.data.showResults=false;
  }

  if(w.type==='timer'){
    w.data.running=false;
  }
}

function cloneForSaveFile(options={}){
  const copy=JSON.parse(JSON.stringify(state));
  try{
    copy.settings = copy.settings || {};
    copy.isTemplateOnly = !!options.templateOnly;

    if(options.templateOnly){
      // Ryd globale/lokale lister fra skabelonen.
      copy.lists={};
      copy.wheelLists={};
      copy.savedLists={};

      (copy.slides||[]).forEach(sl=>{
        // Ryd baggrundsbilleder, men bevar evt. farve/grundlæggende layout.
        delete sl.bgImage;
        delete sl.backgroundImage;
        delete sl.image;
        if(sl.bg && String(sl.bg).startsWith('data:')) delete sl.bg;
        if(sl.background && String(sl.background).startsWith('data:')) delete sl.background;

        (sl.widgets||[]).forEach(clearWidgetDataForTemplate);
      });
    }
  }catch(e){}
  return copy;
}

function handlePdfArrowKey(e){
  const target=activePdfKeyboardTarget();
  if(!target) return false;
  const key=e.key;
  if(key==='ArrowLeft'){
    pdfJsGoPage(target.w,target.content,-1);

  }else if(key==='ArrowUp'){

    target.viewer.scrollTop += Math.max(80,target.viewer.clientHeight*0.25);

function widgetNavigationOrder(){
  // Pil op/ned skal vælge widgets på den aktive tavle i en forudsigelig visuel rækkefølge.
  // Først fra øverst til nederst, derefter fra venstre mod højre.
  return (slide().widgets||[])
    .filter(w=>w && w.id)
    .slice()
    .sort((a,b)=>{
      const ay=Number(a.y)||0, by=Number(b.y)||0;
      const ax=Number(a.x)||0, bx=Number(b.x)||0;
      if(Math.abs(ay-by)>24) return ay-by;
      if(Math.abs(ax-bx)>24) return ax-bx;
      return (Number(a.z)||0)-(Number(b.z)||0);
    });
}
function selectAdjacentWidget(dir){

/* v1.0.43: Link/iframe-widget selection guard.
   Formål:
   - Et klik/tap på iframe-widgettens flade skal vælge widgetten ligesom en tekstwidget.
   - Iframe-indhold må ikke stjæle klik, når man vil fokusere, rotere eller vælge widgetten.

(function(){

  function isIframeWidget(el) {
    if (!el || !el.matches) return false;
    return el.matches('.link-widget, .iframe-widget, [data-type="link"], [data-type="iframe"]') || !!el.querySelector('iframe');
  }

  function closestIframeWidget(target) {
    if (!target || !target.closest) return null;
    const w = target.closest('.widget, .link-widget, .iframe-widget, [data-type="link"], [data-type="iframe"]');
    return isIframeWidget(w) ? w : null;
  }

  function isControl(target) {
    return !!(target && target.closest && target.closest(

    ));
  }

  function selectWidget(widget, ev) {

    try { widget.dispatchEvent(new MouseEvent('mousedown', {bubbles:true, clientX: ev.clientX || 0, clientY: ev.clientY || 0})); } catch(e) {}

    widget.setAttribute('data-selected', 'true');

  }

  document.addEventListener('pointerdown', function(ev){
    const widget = closestIframeWidget(ev.target);
    if (!widget) return;
    if (isControl(ev.target)) return;
    if (widget.classList.contains('iframe-interaction-enabled') || widget.classList.contains('is-iframe-active')) return;

  document.addEventListener('dblclick', function(ev){
    const widget = closestIframeWidget(ev.target);

    if (iframe) iframe.style.pointerEvents = 'auto';

        body.widgetOverviewMode .widgetOverviewItem .chrome,

        body.widgetOverviewMode .widgetOverviewItem .widget-control,

        body.widgetOverviewMode .widgetOverviewItem .content{
          height:100%!important;border-radius:14px!important;overflow:hidden!important;
