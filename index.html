color:white;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;cursor:move;font-weight:700;font-size:14px}.mini{display:flex;gap:5px}.mini button{padding:4px 8px;font-size:12px;background:#4b5563}.content{height:calc(100% - 34px);overflow:auto;background:rgba(255,255,255,.94);border-radius:0 0 12px 12px}.widget:not(.selected) .content{height:100%;border-radius:12px;background:transparent;overflow:hidden}.widget:not(.selected){box-shadow:0 8px 20px rgba(0,0,0,.12)}.widget.locked:not(.selected){outline:none}.widget.selected.locked{outline:3px dashed #6b7280}.resize{position:absolute;right:-8px;bottom:-8px;width:24px;height:24px;border-radius:50%;background:white;border:3px solid var(--accent);cursor:nwse-resize}.rotater{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:white;border:3px solid var(--accent);display:grid;place-items:center;font-weight:bold;color:var(--accent);cursor:grab}.text{height:100%;display:flex;flex-direction:column}.textTools{display:flex;padding:6px 10px;background:#f3f4f6;border-bottom:1px solid #e5e7eb;gap:8px;align-items:center;flex-wrap:wrap}.text textarea{width:100%;flex:1;border:0;padding:16px;font-size:var(--fs,24px);resize:none;background:white}.videoBox{height:100%;background:#222;color:white;display:grid;place-items:center;text-align:center;padding:18px}.videoBox iframe{width:100%;height:100%;border:0}.videoBox a{color:white;font-size:24px;font-weight:800}.timerBox{padding:18px;text-align:center}.timerBox .display{font-size:58px;font-weight:900;margin:18px}.timerBox input{width:70px;padding:6px}.timerBox button,.wheel button,.linkBox button,.modal button{background:var(--accent);color:white;border:0;border-radius:8px;padding:8px 12px;margin:3px}.wheel{height:100%;display:grid;gap:12px;padding:12px;overflow:hidden;box-sizing:border-box}.wheel:not(.editing){grid-template-columns:minmax(260px,58%) minmax(220px,42%)}.wheel.editing{grid-template-columns:minmax(260px,52%) minmax(260px,48%)}.wheelBox{min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}.wheelCanvas{width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1/1;object-fit:contain;border-radius:50%;box-shadow:0 0 0 8px white,0 4px 12px #999}.wheelSide{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;align-content:start}.winner{font-size:clamp(28px,5vw,76px);font-weight:900;text-align:center;line-height:1}.wheelControls,.wheelTools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.wheel .chosen{font-size:14px;min-height:0;overflow:auto;overflow-wrap:anywhere;background:#f3f4f6;padding:8px;border-radius:8px}.wheel textarea{width:100%;height:130px}.wheel .editArea{display:none;min-width:0;overflow:auto}.wheel.editing .editArea{display:block}.wheel.editing .wheelSide{grid-template-rows:auto auto minmax(80px,.7fr) auto}@media(max-width:700px){.wheel:not(.editing),.wheel.editing{grid-template-columns:1fr}.wheelBox{height:260px}}.linkBox{height:100%;display:grid;place-items:center;text-align:center;padding:20px}.linkBox a{font-size:30px;color:#1559d6;font-weight:800}.imageWidget img{width:100%;height:100%;object-fit:contain;display:block}.pdfBox{height:100%;display:grid;place-items:center;padding:20px;text-align:center}.pdfBox iframe,.pdfBox object{width:100%;height:100%;border:0}.drawLayer{position:absolute;inset:0;z-index:850;pointer-events:none}.drawLayer.active{pointer-events:auto;cursor:crosshair}.app.drawActive .widget{filter:saturate(.7) brightness(.9)}.app.drawActive:after{content:'TEGNETILSTAND – klik blyanten igen eller Luk for at stoppe';position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:1100;background:rgba(17,24,39,.9);color:white;border-radius:999px;padding:9px 16px;font-weight:900;pointer-events:none}.drawPanel{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:1001;background:rgba(255,255,255,.96);border-radius:14px;padding:10px;box-shadow:0 10px 24px #0004;display:none;gap:8px;align-items:center;max-width:92vw;overflow:auto}.drawPanel.show{display:flex}.drawPanel button.active{background:#6d5dfc;color:white}.modalBackdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:center;justify-content:center}.modal{width:min(640px,90vw);background:white;border-radius:18px;padding:22px;box-shadow:0 25px 55px rgba(0,0,0,.35)}.modal h2{margin-top:0}.modal input,.modal textarea,.modal select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;margin:6px 0 12px}.hidden{display:none!important}.present .toolbar,.present .topbar,.present .chrome,.present .resize,.present .rotater,.present .drawPanel{display:none!important}.present .title{display:none}.present .widget{box-shadow:none;outline:none}.present .content{height:100%;border-radius:12px}.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#111827;color:white;padding:10px 16px;border-radius:999px;z-index:3000;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){.toolbar{gap:8px;max-width:96vw;overflow-x:auto}.tool button{width:44px;height:44px}.title{font-size:18px}.topbar{scale:.9;transform-origin:top right}}

<body>
<div id="app" class="app">
  <div id="title" class="title" contenteditable="true">Min undervisningstavle</div>
  <div class="topbar"><button id="prev">◀</button><b id="slideInfo">1/1</b><button id="next">▶</button><button id="addSlide">+ tavle</button><button id="clearSlide">🧹</button><button id="drawTop" title="Tegn til/fra">✎</button><button id="present">⛶</button></div>
  <canvas id="draw" class="drawLayer"></canvas>
  <div class="drawPanel" id="drawPanel"><b>Tegn</b><input id="penColor" type="color" value="#000000"><input id="penSize" type="range" min="2" max="40" value="6"><button data-drawmode="pen" class="active">Fri</button><button data-drawmode="line">Linje</button><button data-drawmode="rect">Firkant</button><button data-drawmode="circle">Cirkel</button><button data-drawmode="eraser">Viskelæder</button><button id="drawClear">Ryd</button><button id="drawOff">Luk</button></div>
  <div class="toolbar">
    <div class="tool"><button data-tool="text">Aa</button><span>tekst</span></div><div class="tool"><button data-tool="video">▶</button><span>video</span></div><div class="tool"><button data-tool="draw" title="Tegn til/fra">✎</button><span>tegn</span></div><div class="tool"><button data-tool="wheel">🎲</button><span>hjul</span></div><div class="tool"><button data-tool="timer">⌛</button><span>timer</span></div><div class="tool"><button data-tool="image">🖼️</button><span>billede</span></div><div class="tool"><button data-tool="link">🔗</button><span>link</span></div><div class="tool"><button data-tool="pdf">PDF</button><span>pdf</span></div><div class="tool"><button data-tool="bg">🎨</button><span>baggrund</span></div><div class="tool"><button data-tool="grid">#</button><span>grid</span></div><div class="tool pinTool"><button id="pinToolbar" title="Fastgør/skjul værktøjslinje">📌</button><span>pin</span></div><div class="tool"><button data-tool="save">💾</button><span>backup</span></div>
  </div>
  <button id="toolbarPeek" class="toolbarPeek">værktøjer ▲</button>
  <div id="modalBack" class="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div id="toast" class="toast"></div>
</div>
<input id="fileInput" type="file" class="hidden">
<script>
(()=>{
const app=document.getElementById('app'), titleEl=document.getElementById('title'), draw=document.getElementById('draw'), ctx=draw.getContext('2d');
const modalBack=document.getElementById('modalBack'), modal=document.getElementById('modal'), fileInput=document.getElementById('fileInput');
const KEY='maans_interaktiv_tavle_v15'; let selected=null, z=20, drawMode='pen', isDrawing=false, timerHandles={};
let state=load()||{active:0,slides:[{title:'Min undervisningstavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]}]};
function uid(){return Math.random().toString(36).slice(2,10)}
function slide(){return state.slides[state.active]}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function save(){try{slide().draw=draw.toDataURL('image/png');localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Kunne ikke gemme: filen er måske for stor')}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function applyBg(){const s=slide();app.style.background=s.bg||'linear-gradient(135deg,#edf6ff,#dff8e8)'; if(s.bgImage){app.style.backgroundImage=`url(${s.bgImage}), ${s.bg}`;app.style.backgroundSize=`${s.bgFit||'cover'}, cover`;app.style.backgroundRepeat='no-repeat, no-repeat';app.style.backgroundPosition='center, center'}else{app.style.backgroundSize='cover';app.style.backgroundRepeat='no-repeat';app.style.backgroundPosition='center'}app.classList.toggle('grid',!!s.grid);titleEl.textContent=s.title||'Min undervisningstavle'}
function resizeCanvas(){const old=draw.toDataURL();draw.width=innerWidth*devicePixelRatio;draw.height=innerHeight*devicePixelRatio;draw.style.width=innerWidth+'px';draw.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);loadDraw(old)}
function loadDraw(src){ctx.clearRect(0,0,innerWidth,innerHeight); if(!src)return; const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight); im.src=src}
window.addEventListener('resize',resizeCanvas);
function render(){document.querySelectorAll('.widget').forEach(e=>e.remove());applyBg();document.getElementById('slideInfo').textContent=(state.active+1)+'/'+state.slides.length;resizeCanvas();loadDraw(slide().draw);slide().widgets.forEach(w=>makeWidget(w));save()}
function addWidget(type,data={}){const w={id:uid(),type,x:140+Math.random()*80,y:130+Math.random()*80,w:type==='wheel'?860:(type==='text'?420:520),h:type==='wheel'?560:(type==='timer'?260: type==='link'?230:320),z:z++,rotation:0,locked:false,title:titles[type]||type,data};slide().widgets.push(w);makeWidget(w);select(w.id);save();return w}
const titles={text:'Tekst',video:'Video',wheel:'Lykkehjulet',timer:'Timer',image:'Billede',link:'Link',pdf:'PDF'};
function transformFor(w){return`translate(${w.x}px,${w.y}px) rotate(${w.rotation||0}deg)`}
function makeWidget(w){const el=document.createElement('div');el.className='widget '+(w.type==='image'?'imageWidget':'');el.dataset.id=w.id;el.style.width=w.w+'px';el.style.height=w.h+'px';el.style.setProperty('--widget-w', w.w+'px');el.style.setProperty('--widget-h', w.h+'px');el.style.zIndex=w.z;el.style.transform=transformFor(w);el.innerHTML=`<div class="chrome"><span>${w.title||titles[w.type]}</span><div class="mini"><button data-act="up">⬆</button><button data-act="down">⬇</button><button data-act="lock">${w.locked?'🔒':'🔓'}</button><button data-act="dup">⧉</button><button data-act="del">×</button></div></div><div class="content"></div><div class="resize"></div><div class="rotater">↻</div>`;app.appendChild(el);fillContent(el,w); wireWidget(el,w);}
function fillContent(el,w){const c=el.querySelector('.content');c.className='content '+w.type; if(w.type==='text'){c.innerHTML=`<textarea placeholder="Skriv her...">${esc(w.data.text||'')}</textarea>`;c.querySelector('textarea').oninput=e=>{w.data.text=e.target.value;save()}}
 if(w.type==='video'){const id=ytId(w.data.url||''); c.innerHTML=`<div class="videoBox">${id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe><div class="hidden"><a target="_blank" href="https://youtu.be/${id}">Åbn på YouTube</a></div>`:`<div><a href="#">Indsæt YouTube-link</a><p>Hvis indlejring blokeres på iPad, brug linket til YouTube.</p></div>`}</div>`;c.onclick=()=>askVideo(w)}
 if(w.type==='timer'){w.data.seconds??=180;w.data.left??=w.data.seconds; c.innerHTML=`<div class="timerBox"><div><input class="min" type="number" value="${Math.floor(w.data.seconds/60)}"> min <input class="sec" type="number" value="${w.data.seconds%60}"> sek <button class="set">Sæt</button></div><div class="display">${fmt(w.data.left)}</div><button class="start">Start</button><button class="pause">Pause</button><button class="reset">Reset</button></div>`;wireTimer(c,w)}
 if(w.type==='wheel'){w.data.names??=['Anna','Bertram','Caroline','Emil','Ida'];w.data.original??=[...w.data.names];w.data.chosen??=[];w.data.editing??=false;c.innerHTML=`<div class="wheel ${w.data.editing?'editing':''}"><div class="wheelBox"><canvas class="wheelCanvas" width="900" height="900"></canvas><button class="spin spinCenter">Drej</button></div><div class="wheelSide"><div class="winner">${w.data.winner||''}</div><div class="wheelControls"><button class="spin">Drej hjulet</button><button class="editNames">${w.data.editing?'Skjul liste':'Rediger liste'}</button></div><div class="chosen"><b>Valgte:</b><br>${w.data.chosen.join(', ')||'Ingen endnu'}</div><div class="editArea"><textarea>${w.data.names.join('\n')}</textarea><div class="wheelTools"><button class="names">Gem navne</button><button class="saveList">Gem liste</button><button class="loadList">Hent liste</button><button class="resetPool">Nulstil pulje</button></div></div></div></div>`;drawWheel(c.querySelector('canvas'),w,0);wireWheel(c,w)}
 if(w.type==='link'){c.innerHTML=`<div class="linkBox"><a target="_blank" href="${esc(w.data.url||'#')}">${esc(w.data.text||'Klikbart link')}</a><button class="edit">Rediger link</button></div>`;c.querySelector('.edit').onclick=()=>askLink(w)}
 if(w.type==='image'){c.innerHTML=w.data.src?`<img src="${w.data.src}">`:`<div class="linkBox"><button>Vælg billede</button></div>`;c.onclick=e=>{ if(!w.data.src) pickFile('image/*',src=>{w.data.src=src;fillContent(el,w);save()}) }}

}
function wireWidget(el,w){el.addEventListener('pointerdown',e=>{select(w.id);});el.querySelector('[data-act=del]').onclick=e=>{e.stopPropagation(); if(confirm('Slet widget?')){slide().widgets=slide().widgets.filter(x=>x.id!==w.id);el.remove();save()}};el.querySelector('[data-act=up]').onclick=e=>{e.stopPropagation();w.z=++z;el.style.zIndex=w.z;save()};el.querySelector('[data-act=down]').onclick=e=>{e.stopPropagation();w.z=Math.max(1,w.z-2);el.style.zIndex=w.z;save()};el.querySelector('[data-act=lock]').onclick=e=>{e.stopPropagation();w.locked=!w.locked;render()};el.querySelector('[data-act=dup]').onclick=e=>{e.stopPropagation();let n=JSON.parse(JSON.stringify(w));n.id=uid();n.x+=30;n.y+=30;n.z=++z;slide().widgets.push(n);render()};
 let drag=false,rot=false,res=false,start={}; const chrome=el.querySelector('.chrome'), rh=el.querySelector('.rotater'), rez=el.querySelector('.resize');
 chrome.addEventListener('pointerdown',e=>{if(w.locked)return;setToolbarHidden(true);drag=true;start={x:e.clientX,y:e.clientY,wx:w.x,wy:w.y};chrome.setPointerCapture(e.pointerId)});
 rez.addEventListener('pointerdown',e=>{if(w.locked)return;e.stopPropagation();setToolbarHidden(true);res=true;start={x:e.clientX,y:e.clientY,ww:w.w,wh:w.h};rez.setPointerCapture(e.pointerId)});
 rh.addEventListener('pointerdown',e=>{if(w.locked)return;e.stopPropagation();select(w.id);rot=true;start={cx:w.x+w.w/2,cy:w.y+w.h/2};rh.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(drag){w.x=start.wx+e.clientX-start.x;w.y=start.wy+e.clientY-start.y;el.style.transform=transformFor(w)} if(res){w.w=Math.max(120,start.ww+e.clientX-start.x);w.h=Math.max(90,start.wh+e.clientY-start.y);el.style.width=w.w+'px';el.style.height=w.h+'px';el.style.setProperty('--widget-w',w.w+'px');el.style.setProperty('--widget-h',w.h+'px')} if(rot){let deg=Math.atan2(e.clientY-start.cy,e.clientX-start.cx)*180/Math.PI+90;if(e.shiftKey)deg=Math.round(deg/15)*15;w.rotation=deg;el.style.transform=transformFor(w)}});
 ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(drag||res||rot)save();drag=res=rot=false}));}
function select(id){selected=id;document.querySelectorAll('.widget').forEach(e=>{let on=id&&e.dataset.id===id;e.classList.toggle('selected',!!on);let w=slide().widgets.find(x=>x.id===e.dataset.id);if(w)e.classList.toggle('locked',!!w.locked)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ytId(url){let m=String(url).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:''}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
let audioCtx=null;
function ensureAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(freq=880,dur=.18,type='sine',gain=.14){try{ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function alarmSound(){ensureAudio();[0,220,440,760,980].forEach((d,i)=>setTimeout(()=>beep(i%2?700:1040,.22,'square',.12),d))}
function wheelTick(){beep(420,.045,'triangle',.09)}
function wheelLand(){ensureAudio();beep(880,.14,'sine',.18);setTimeout(()=>beep(1175,.18,'sine',.18),125);setTimeout(()=>beep(1568,.18,'sine',.14),260)}
function wireTimer(c,w){const disp=c.querySelector('.display');c.querySelector('.set').onclick=()=>{w.data.seconds=(+c.querySelector('.min').value||0)*60+(+c.querySelector('.sec').value||0);w.data.left=w.data.seconds;disp.textContent=fmt(w.data.left);save()};c.querySelector('.start').onclick=()=>{clearInterval(timerHandles[w.id]);timerHandles[w.id]=setInterval(()=>{w.data.left--;disp.textContent=w.data.left<=0?'TID!':fmt(w.data.left);if(w.data.left<=0){clearInterval(timerHandles[w.id]);alarmSound()}save()},1000)};c.querySelector('.pause').onclick=()=>clearInterval(timerHandles[w.id]);c.querySelector('.reset').onclick=()=>{clearInterval(timerHandles[w.id]);w.data.left=w.data.seconds;disp.textContent=fmt(w.data.left);save()}}
function drawWheel(canvas,w,rot=0){const names=(w.data.names||[]).filter(Boolean),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=Math.min(W,H)*0.47;ctx.clearRect(0,0,W,H);const cols=['#ff6b6b','#ffd93d','#4ade80','#60a5fa','#c084fc','#fb923c'];if(!names.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#eee';ctx.fill();return}names.forEach((n,i)=>{let a1=rot+i*2*Math.PI/names.length,a2=rot+(i+1)*2*Math.PI/names.length;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();ctx.fillStyle=cols[i%cols.length];ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate((a1+a2)/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.font=`800 ${Math.max(20,Math.min(44,210/names.length+12))}px system-ui`;ctx.fillStyle='#111827';let label=n.length>23?n.slice(0,22)+'…':n;ctx.fillText(label,r-24,0);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=Math.max(10,W*.018);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+r-8,cy);ctx.lineTo(cx+r+50,cy-22);ctx.lineTo(cx+r+50,cy+22);ctx.closePath();ctx.fillStyle='#111827';ctx.fill()}
function wireWheel(c,w){const canv=c.querySelector('canvas');
 c.querySelector('.editNames').onclick=()=>{w.data.editing=!w.data.editing;fillContent(c.closest('.widget'),w);save()};
 const saveNames=()=>{w.data.names=c.querySelector('textarea').value.split('\n').map(x=>x.trim()).filter(Boolean);w.data.original=[...w.data.names,...(w.data.chosen||[])];w.data.winner='';fillContent(c.closest('.widget'),w);save()};
 const namesBtn=c.querySelector('.names'); if(namesBtn)namesBtn.onclick=saveNames;
 const resetBtn=c.querySelector('.resetPool'); if(resetBtn)resetBtn.onclick=()=>{w.data.names=[...(w.data.original||w.data.names||[])];w.data.chosen=[];w.data.winner='';fillContent(c.closest('.widget'),w);save()};
 const saveList=c.querySelector('.saveList'); if(saveList)saveList.onclick=()=>{const name=prompt('Navn på liste:','Min elevliste'); if(!name)return; const bank=JSON.parse(localStorage.getItem('maans_wheel_lists')||'{}'); bank[name]=[...w.data.names,...(w.data.chosen||[])]; localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));toast('Liste gemt')};
 const loadList=c.querySelector('.loadList'); if(loadList)loadList.onclick=()=>{const bank=JSON.parse(localStorage.getItem('maans_wheel_lists')||'{}');const keys=Object.keys(bank); if(!keys.length){toast('Ingen gemte lister');return} showModal('<h2>Hent liste</h2>'+keys.map(k=>`<button class="pickList" data-k="${k}">${k}</button>`).join(' ')+'<hr><button id="close">Luk</button>');modal.querySelectorAll('.pickList').forEach(btn=>btn.onclick=()=>{const pick=btn.dataset.k;w.data.names=[...bank[pick]];w.data.original=[...bank[pick]];w.data.chosen=[];w.data.winner='';closeModal();fillContent(c.closest('.widget'),w);save()});modal.querySelector('#close').onclick=closeModal};
 c.querySelector('.spin').onclick=()=>{let btn=c.querySelector('.spin');let names=w.data.names;if(!names.length){toast('Puljen er tom');return}btn.disabled=true;let winner=names[Math.floor(Math.random()*names.length)],t=0,lastTick=0;const anim=setInterval(()=>{t+=.32;drawWheel(canv,w,t);if(t-lastTick>.9){wheelTick();lastTick=t}if(t>9){clearInterval(anim);btn.disabled=false;wheelLand();w.data.winner=winner;c.querySelector('.winner').textContent=winner;setTimeout(wheelLand,80);if(confirm(winner+' blev valgt. Fjern fra puljen?')){w.data.names=w.data.names.filter(n=>n!==winner);w.data.chosen.push(winner);fillContent(c.closest('.widget'),w)}save()}},30)}}
function pickFile(accept,cb){fileInput.accept=accept;fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);fileInput.value=''};fileInput.click()}
function showModal(html){modal.innerHTML=html;modalBack.style.display='flex'} function closeModal(){modalBack.style.display='none'} modalBack.onclick=e=>{if(e.target===modalBack)closeModal()}
function askVideo(w){showModal(`<h2>Video</h2><input id="vurl" placeholder="YouTube-link" value="${esc(w.data.url||'')}"><button id="ok">Gem</button><button id="cancel">Luk</button><p>Hvis YouTube blokerer embed, vises link/åbn eksternt.</p>`);modal.querySelector('#ok').onclick=()=>{w.data.url=modal.querySelector('#vurl').value;closeModal();render()};modal.querySelector('#cancel').onclick=closeModal}
function askLink(w){showModal(`<h2>Link</h2><input id="lt" placeholder="Tekst" value="${esc(w.data.text||'Klikbart link')}"><input id="lu" placeholder="URL" value="${esc(w.data.url||'https://')}"><button id="ok">Gem</button>`);modal.querySelector('#ok').onclick=()=>{w.data.text=modal.querySelector('#lt').value;w.data.url=modal.querySelector('#lu').value;closeModal();render()}}
function askPdfLink(w){showModal(`<h2>PDF-link</h2><input id="pt" placeholder="Tekst" value="${esc(w.data.text||'Åbn PDF')}"><input id="pu" placeholder="PDF URL" value="${esc(w.data.src||'')}"><button id="ok">Gem</button>`);modal.querySelector('#ok').onclick=()=>{w.data.text=modal.querySelector('#pt').value;w.data.src=modal.querySelector('#pu').value;closeModal();render()}}
function bgModal(){showModal(`<h2>Baggrund</h2><div id="bgPreview" style="height:180px;border-radius:14px;border:1px solid #ddd;background:${slide().bgImage?'url('+slide().bgImage+') center/contain no-repeat':'#f3f4f6'};margin-bottom:12px"></div><button data-bg="linear-gradient(135deg,#edf6ff,#dff8e8)">Lys grøn/blå</button><button data-bg="linear-gradient(135deg,#0f172a,#064e3b)">Mørk</button><button data-bg="linear-gradient(135deg,#fef3c7,#fed7aa)">Varm</button><hr><button id="bgImg">Vælg baggrundsbillede</button><select id="fit"><option>cover</option><option>contain</option><option>auto</option></select><button id="clearBg">Fjern billede</button><button id="close">Luk</button>`);modal.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{slide().bg=b.dataset.bg;render()});modal.querySelector('#bgImg').onclick=()=>pickFile('image/*',src=>{slide().bgImage=src;render();closeModal()});modal.querySelector('#fit').onchange=e=>{slide().bgFit=e.target.value;render()};modal.querySelector('#clearBg').onclick=()=>{slide().bgImage='';render()};modal.querySelector('#close').onclick=closeModal}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='interaktiv-tavle-v15.json';a.click()}
function importJson(){pickFile('application/json',src=>fetch(src).then(r=>r.json()).then(j=>{state=j;render();toast('Importeret')}))}

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='text')addWidget('text',{text:'Skriv instruktion her…',fontSize:24});if(t==='video'){let w=addWidget('video',{url:''});askVideo(w)}if(t==='draw'){setDrawActive(!app.classList.contains('drawActive'))}if(t==='wheel')addWidget('wheel',{});if(t==='timer')addWidget('timer',{});if(t==='image')addWidget('image',{});if(t==='link'){let w=addWidget('link',{text:'Klikbart link',url:'https://'});askLink(w)}if(t==='pdf')addWidget('pdf',{});if(t==='bg')bgModal();if(t==='grid'){slide().grid=!slide().grid;render()}if(t==='save')saveModal()});

app.addEventListener('pointerdown',e=>{
  if(e.target===app || e.target===titleEl){ select(null); }
});

document.getElementById('prev').onclick=()=>prevSlide();document.getElementById('next').onclick=()=>nextSlide();document.getElementById('addSlide').onclick=()=>{state.slides.push({title:'Ny tavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]});state.active=state.slides.length-1;render()};document.getElementById('clearSlide').onclick=()=>{if(confirm('Ryd denne tavle?')){slide().widgets=[];slide().draw='';render()}};document.getElementById('drawTop').onclick=()=>setDrawActive(!app.classList.contains('drawActive'));document.getElementById('present').onclick=()=>{app.classList.toggle('present');select(null)};

['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>ensureAudio(),{once:false,passive:true}));

function nextSlide(){if(state.active<state.slides.length-1){state.active++;render();toast('Tavle '+(state.active+1))}}
function prevSlide(){if(state.active>0){state.active--;render();toast('Tavle '+(state.active+1))}}
function goToSlide(i){if(i>=0&&i<state.slides.length){state.active=i;render();toast('Tavle '+(state.active+1))}}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.matches('input,textarea,select') || t.isContentEditable)) return;
  if(app.classList.contains('drawActive')) return;
  if(e.key==='ArrowRight'){e.preventDefault();nextSlide()}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSlide()}
  if(/^[1-9]$/.test(e.key)){e.preventDefault();goToSlide(Number(e.key)-1)}
  if(e.key==='0'){e.preventDefault();goToSlide(9)}
});
let swipeStart=null;
app.addEventListener('pointerdown',e=>{
  if(app.classList.contains('drawActive')) return;
  if(e.target.closest('.widget,.toolbar,.topbar,.modalBackdrop,.toolbarPeek')) return;
  swipeStart={x:e.clientX,y:e.clientY,t:Date.now()};
});
app.addEventListener('pointerup',e=>{
  if(!swipeStart) return;
  const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
  if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)*1.5){
    dx<0 ? nextSlide() : prevSlide();
  }
  swipeStart=null;
});
titleEl.oninput=()=>{slide().title=titleEl.textContent;save()};
function drawPt(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
let drawStart=null, drawSnapshot=null;
function setDrawActive(on){draw.classList.toggle('active',on);app.classList.toggle('drawActive',on);document.getElementById('drawPanel').classList.toggle('show',on);document.querySelectorAll('[data-tool="draw"],#drawTop').forEach(b=>b&&b.classList.toggle('active',on));if(on)select(null)}
function setDrawTool(mode){drawMode=mode;document.querySelectorAll('[data-drawmode]').forEach(b=>b.classList.toggle('active',b.dataset.drawmode===mode))}
function setupStroke(){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+document.getElementById('penSize').value;ctx.strokeStyle=document.getElementById('penColor').value;ctx.fillStyle=document.getElementById('penColor').value}
function restoreSnapshot(){if(drawSnapshot)ctx.putImageData(drawSnapshot,0,0)}
function drawShape(from,to){setupStroke();if(drawMode==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth*=2;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();ctx.globalCompositeOperation='source-over';return}ctx.globalCompositeOperation='source-over';ctx.beginPath();if(drawMode==='line'){ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke()}else if(drawMode==='rect'){ctx.strokeRect(from.x,from.y,to.x-from.x,to.y-from.y)}else if(drawMode==='circle'){let rx=(to.x-from.x)/2,ry=(to.y-from.y)/2;ctx.ellipse(from.x+rx,from.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke()}else{ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke()}}
draw.addEventListener('pointerdown',e=>{if(!draw.classList.contains('active'))return;isDrawing=true;draw.setPointerCapture(e.pointerId);drawStart=drawPt(e);drawSnapshot=ctx.getImageData(0,0,draw.width,draw.height);if(drawMode==='pen'||drawMode==='eraser'){ctx.beginPath();ctx.moveTo(drawStart.x,drawStart.y)}});
draw.addEventListener('pointermove',e=>{if(!isDrawing)return;const p=drawPt(e);if(drawMode==='pen'||drawMode==='eraser'){drawShape(drawStart,p);drawStart=p}else{restoreSnapshot();drawShape(drawStart,p)}});
draw.addEventListener('pointerup',e=>{if(!isDrawing)return;const p=drawPt(e);if(!(drawMode==='pen'||drawMode==='eraser')){restoreSnapshot();drawShape(drawStart,p)}isDrawing=false;drawSnapshot=null;ctx.globalCompositeOperation='source-over';save()});
draw.addEventListener('pointercancel',()=>{isDrawing=false;drawSnapshot=null;ctx.globalCompositeOperation='source-over'});
document.querySelectorAll('[data-drawmode]').forEach(b=>b.onclick=()=>setDrawTool(b.dataset.drawmode));
document.getElementById('drawClear').onclick=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);slide().draw='';save()};
document.getElementById('drawOff').onclick=()=>setDrawActive(false);

const toolbarEl=document.querySelector('.toolbar'), toolbarPeek=document.getElementById('toolbarPeek'), pinToolbar=document.getElementById('pinToolbar');
let toolbarPinned=false, toolbarTimer=null;
function setToolbarHidden(on){if(toolbarPinned)on=false;app.classList.toggle('toolbarHidden',on)}
function showToolbarTemp(){setToolbarHidden(false);clearTimeout(toolbarTimer);if(!toolbarPinned)toolbarTimer=setTimeout(()=>setToolbarHidden(true),2400)}
pinToolbar.onclick=e=>{e.stopPropagation();toolbarPinned=!toolbarPinned;app.classList.toggle('toolbarPinned',toolbarPinned);pinToolbar.textContent=toolbarPinned?'📍':'📌';showToolbarTemp();save()};
toolbarPeek.onclick=()=>showToolbarTemp();
app.addEventListener('pointermove',e=>{if(e.clientY>innerHeight-130)showToolbarTemp()});
app.addEventListener('pointerdown',e=>{if(e.target.closest('.toolbar,.toolbarPeek'))showToolbarTemp()});
setTimeout(()=>setToolbarHidden(true),2200);

render();
})();
