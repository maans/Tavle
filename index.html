  opacity:0!important;
  pointer-events:none!important;
}


/* v33: prevent accidental tap-through every time tools are opened */
.app.toolbarBlocked .toolbar button{
  pointer-events:none!important;
}
.app.toolbarBlocked .toolbar{
  opacity:.88;
}



/* v38: hard hide multi-tavle controls at 1 slide */
.onlyMultiHidden{
  display:none!important;
  visibility:hidden!important;
  pointer-events:none!important;
}

/* v43 group generator */
.content.groups{background:white}
.groupsBox{
  height:100%;
  display:grid;
  grid-template-columns:minmax(260px,.85fr) minmax(260px,1.15fr);
  gap:12px;
  padding:12px;
  box-sizing:border-box;
  overflow:hidden;
}
.groupsControls{
  min-height:0;
  display:grid;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  gap:8px;
  overflow:hidden;
}
.groupsControls textarea{
  width:100%;
  height:100%;
  min-height:120px;
  resize:none;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:10px;
  font-size:15px;
}
.groupsRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.groupsRow input{width:76px;border:1px solid #cbd5e1;border-radius:10px;padding:8px;font-size:17px}
.groupsResult{
  min-height:0;overflow:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;
  padding:12px;font-size:clamp(18px,2.2vw,30px);line-height:1.35;
}
.groupCard{background:white;border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.groupCard b{display:block;margin-bottom:5px;color:#312e81}
.groupSpin{position:relative;display:grid;place-items:center;min-height:0}
.groupWheel{width:min(100%,52vh);height:auto;aspect-ratio:1/1;border-radius:50%;box-shadow:0 0 0 8px white,0 4px 12px #999}
.groupSpinBtn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;
  padding:14px 18px;background:#6d5dfc;color:white;font-weight:900;font-size:clamp(16px,2.2vw,28px);
  box-shadow:0 8px 20px rgba(0,0,0,.25)
}
.groupSpinBtn:disabled{opacity:.55}
.groupsBox.flashGroups{animation:groupsFlash .55s ease}
@keyframes groupsFlash{0%{filter:drop-shadow(0 0 0 rgba(109,93,252,0));transform:scale(1)}45%{filter:drop-shadow(0 0 16px rgba(109,93,252,.55));transform:scale(1.01)}100%{filter:drop-shadow(0 0 0 rgba(109,93,252,0));transform:scale(1)}}
@media(max-width:760px){.groupsBox{grid-template-columns:1fr;grid-template-rows:auto 1fr}.groupSpin{min-height:230px}}
.present .groupsControls textarea,.present .groupsControls .editOnly{display:none!important}
.present .groupsBox{grid-template-columns:1fr}
.present .groupSpin{display:none}


/* v44: group list auto-hide after groups are made */
.groupsBox.groupsListHidden .groupsControls{
  grid-template-rows:auto minmax(0,1fr);
}
.groupsBox.groupsListHidden .groupsControls .editOnly,
.groupsBox.groupsListHidden .groupsControls textarea{
  display:none!important;
}
.groupsBox.groupsListHidden .groupsResult{
  grid-row:1 / -1;
  font-size:clamp(22px,2.8vw,38px);
}
.groupsBox.groupsListHidden{
  grid-template-columns:minmax(260px,.75fr) minmax(320px,1.25fr);
}
.groupsBox.groupsListHidden .groupWheel{
  width:min(100%,60vh);
}

<body>

  </div>

  <div id="modalBack" class="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div id="toast" class="toast"></div>
</div>
<input id="fileInput" type="file" class="hidden">
<script>
(()=>{
const app=document.getElementById('app'), titleEl=document.getElementById('title'), draw=document.getElementById('draw'), ctx=draw.getContext('2d');
const modalBack=document.getElementById('modalBack'), modal=document.getElementById('modal'), fileInput=document.getElementById('fileInput');
const KEY='maans_interaktiv_tavle_v48'; let selected=null, z=20, drawMode='pen', isDrawing=false, timerHandles={};
let toolClickBlockUntil=0;
let embeddedData=window.__TAVLE_DATA__||null;
let state=(embeddedData&&embeddedData.state)||load()||{active:0,slides:[{title:'Min undervisningstavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]}]};
if(embeddedData&&embeddedData.wheelLists){try{localStorage.setItem('maans_wheel_lists',JSON.stringify(embeddedData.wheelLists))}catch(e){}}
if(embeddedData&&embeddedData.settings){try{Object.entries(embeddedData.settings).forEach(([k,v])=>localStorage.setItem(k,v))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10)}
function slide(){return state.slides[state.active]}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function save(opts={}){
  try{
    if(draw&&draw.toDataURL&&slide())slide().draw=draw.toDataURL('image/png');
  }catch(e){}
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    window.__lastSaveFailed=false;
    return true;
  }catch(e){
    if(!opts.silent && !window.__lastSaveFailed){
      toast('Kunne ikke gemme lokalt: projektet er måske for stort. Brug JSON-backup eller Gem som fil.');
    }
    window.__lastSaveFailed=true;
    return false;
  }
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function applyBg(){const s=slide();app.style.background=s.bg||'linear-gradient(135deg,#edf6ff,#dff8e8)'; if(s.bgImage){app.style.backgroundImage=`url(${s.bgImage}), ${s.bg}`;app.style.backgroundSize=`${s.bgFit||'cover'}, cover`;app.style.backgroundRepeat='no-repeat, no-repeat';app.style.backgroundPosition='center, center'}else{app.style.backgroundSize='cover';app.style.backgroundRepeat='no-repeat';app.style.backgroundPosition='center'}app.classList.toggle('grid',!!s.grid);titleEl.textContent=s.title||'Min undervisningstavle'}
function resizeCanvas(){const old=draw.toDataURL();draw.width=innerWidth*devicePixelRatio;draw.height=innerHeight*devicePixelRatio;draw.style.width=innerWidth+'px';draw.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);loadDraw(old)}
function loadDraw(src){ctx.clearRect(0,0,innerWidth,innerHeight); if(!src)return; const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,innerWidth,innerHeight); im.src=src}
window.addEventListener('resize',resizeCanvas);

function updateSlidesOverviewVisibility(){
  const btn=document.getElementById('slidesOverview');
  if(!btn) return;
  const hide = !state || !state.slides || state.slides.length <= 1;
  btn.hidden = hide;
  btn.style.display = hide ? 'none' : '';
  btn.classList.toggle('onlyMultiHidden', hide);
}

function render(){document.querySelectorAll('.widget').forEach(e=>e.remove());applyBg();document.getElementById('slideInfo').textContent=(state.active+1)+'/'+state.slides.length;updateSlidesOverviewVisibility();resizeCanvas();loadDraw(slide().draw);slide().widgets.forEach(w=>makeWidget(w));save()}
function addWidget(type,data={}){const w={id:uid(),type,x:140+Math.random()*80,y:130+Math.random()*80,w:(type==='wheel'||type==='groups')?860:(type==='text'?420:520),h:type==='wheel'?560:(type==='groups'?520:(type==='timer'?260: type==='link'?230:320)),z:z++,rotation:0,locked:false,title:titles[type]||type,data};slide().widgets.push(w);makeWidget(w);select(w.id);save();return w}
const titles={text:'Tekst',video:'Video',wheel:'Lykkehjulet',groups:'Grupper',timer:'Timer',image:'Billede',link:'Link',pdf:'PDF'};
function transformFor(w){return`translate(${w.x}px,${w.y}px) rotate(${w.rotation||0}deg)`}
function makeWidget(w){const el=document.createElement('div');el.className='widget '+(w.type==='image'?'imageWidget':'');el.dataset.id=w.id;el.style.width=w.w+'px';el.style.height=w.h+'px';el.style.setProperty('--widget-w', w.w+'px');el.style.setProperty('--widget-h', w.h+'px');el.style.zIndex=w.z;el.style.transform=transformFor(w);el.innerHTML=`<div class="chrome"><span>${w.title||titles[w.type]}</span><div class="mini"><button data-act="up">⬆</button><button data-act="down">⬇</button><button data-act="lock">${w.locked?'🔒':'🔓'}</button><button data-act="move" title="Flyt eller kopiér til anden tavle">↪</button><button data-act="del">×</button></div></div><div class="content"></div><div class="resize"></div><div class="rotater">↻</div>`;app.appendChild(el);fillContent(el,w); wireWidget(el,w);}

function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeGroupsFromList(names,size){names=shuffleArray(names.filter(Boolean));size=Math.max(1,Number(size)||2);const groups=[];for(let i=0;i<names.length;i+=size)groups.push(names.slice(i,i+size));if(groups.length>1&&groups[groups.length-1].length===1){groups[groups.length-2].push(groups[groups.length-1][0]);groups.pop()}return groups}
function renderGroups(groups){if(!groups||!groups.length)return '<p>Ingen grupper endnu.</p>';return groups.map((g,i)=>`<div class="groupCard"><b>Gruppe ${i+1}</b>${g.map(esc).join('<br>')}</div>`).join('')}
function drawGroupWheel(canvas,names,rot=0){const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=Math.min(W,H)*.46;ctx.clearRect(0,0,W,H);const list=names&&names.length?names:['Grupper'];const cols=['#ff6b6b','#ffd93d','#4ade80','#60a5fa','#c084fc','#fb923c'];list.forEach((name,i)=>{const a1=rot+i*2*Math.PI/list.length,a2=rot+(i+1)*2*Math.PI/list.length;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();ctx.fillStyle=cols[i%cols.length];ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate((a1+a2)/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#111827';ctx.font=`800 ${Math.max(18,Math.min(36,180/list.length+10))}px system-ui`;let label=String(name||'');if(label.length>18)label=label.slice(0,17)+'…';ctx.fillText(label,r-18,0);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=Math.max(10,W*.018);ctx.stroke()}
function wireGroups(c,w){const canvas=c.querySelector('.groupWheel');drawGroupWheel(canvas,(w.data.names||[]).slice(0,18),w.data.rot||0);const textarea=c.querySelector('.groupNames'),sizeInput=c.querySelector('.groupSize');const showBtn=c.querySelector('.showGroupList');if(showBtn)showBtn.onclick=()=>{w.data.listHidden=false;fillContent(c.closest('.widget'),w);save()};c.querySelector('.toGroups').onclick=()=>{w.data.names=textarea.value.split('\n').map(x=>x.trim()).filter(Boolean);w.data.size=Math.max(1,Number(sizeInput.value)||2);w.data.groups=makeGroupsFromList(w.data.names,w.data.size);w.data.rot=0;w.data.listHidden=true;fillContent(c.closest('.widget'),w);save();toast('Grupper dannet')};c.querySelector('.newGroups').onclick=()=>{w.data.names=textarea.value.split('\n').map(x=>x.trim()).filter(Boolean);w.data.size=Math.max(1,Number(sizeInput.value)||2);if(!w.data.names.length){toast('Indsæt en liste først');return}const btn=c.querySelector('.groupSpinBtn');btn.disabled=true;const duration=1800+Math.random()*600,start=performance.now(),endRot=(5+Math.random()*2)*Math.PI*2;function frame(now){const p=Math.min(1,(now-start)/duration),rot=endRot*easeOutCubic(p);drawGroupWheel(canvas,(w.data.names||[]).slice(0,18),rot);if(p<1)requestAnimationFrame(frame);else{w.data.rot=endRot;w.data.groups=makeGroupsFromList(w.data.names,w.data.size);w.data.listHidden=true;btn.disabled=false;wheelLand();fillContent(c.closest('.widget'),w);setTimeout(()=>{const nb=c.closest('.widget').querySelector('.groupsBox');if(nb){nb.classList.add('flashGroups');setTimeout(()=>nb.classList.remove('flashGroups'),650)}},60);save()}}requestAnimationFrame(frame)};c.querySelector('.loadGroupList').onclick=()=>{const bank=wheelListBank();const keys=Object.keys(bank).sort((a,b)=>a.localeCompare(b,'da'));if(!keys.length){toast('Ingen gemte lister');return}showModal('<h2>Hent liste til grupper</h2><p>Vælg en liste – den sættes ind i gruppeværktøjet.</p>'+keys.map(k=>`<button class="pickList" data-k="${esc(k)}">${esc(k)}</button>`).join(' ')+'<hr><button id="close">Luk</button>');modal.querySelectorAll('.pickList').forEach(btn=>btn.onclick=()=>{const pick=btn.dataset.k;w.data.names=[...bank[pick]];w.data.groups=[];w.data.rot=0;w.data.listHidden=false;closeModal();fillContent(c.closest('.widget'),w);save();toast('Liste hentet')});modal.querySelector('#close').onclick=closeModal};c.querySelector('.saveGroupList').onclick=()=>openSaveListModal({data:{names:textarea.value.split('\n').map(x=>x.trim()).filter(Boolean),chosen:[]}})}

function fillContent(el,w){const c=el.querySelector('.content');c.className='content '+w.type; if(w.type==='text'){c.innerHTML=`<textarea placeholder="Skriv her...">${esc(w.data.text||'')}</textarea>`;const ta=c.querySelector('textarea');ta.oninput=e=>{if(app.classList.contains('present'))return;w.data.text=e.target.value;save()};ta.onkeydown=e=>{if(e.key==='Escape'||(e.key==='Enter'&&!e.shiftKey)){e.preventDefault();ta.blur();select(null)}};ta.onfocus=()=>{if(app.classList.contains('present'))ta.blur()}}
 if(w.type==='video'){const id=ytId(w.data.url||''); c.innerHTML=`<div class="videoBox">${id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe><div class="hidden"><a target="_blank" href="https://youtu.be/${id}">Åbn på YouTube</a></div>`:`<div><a href="#">Indsæt YouTube-link</a><p>Hvis indlejring blokeres på iPad, brug linket til YouTube.</p></div>`}</div>`;c.onclick=()=>askVideo(w)}
 if(w.type==='timer'){w.data.seconds??=180;w.data.left??=w.data.seconds; c.innerHTML=`<div class="timerBox"><div><input class="min" type="number" value="${Math.floor(w.data.seconds/60)}"> min <input class="sec" type="number" value="${w.data.seconds%60}"> sek <button class="set">Sæt</button></div><div class="display">${fmt(w.data.left)}</div><button class="start">Start</button><button class="pause">Pause</button><button class="reset">Reset</button></div>`;wireTimer(c,w)}
 if(w.type==='wheel'){w.data.names??=['Anna','Bertram','Caroline','Emil','Ida'];w.data.original??=[...w.data.names];w.data.chosen??=[];w.data.editing??=false;c.innerHTML=`<div class="wheel ${w.data.editing?'editing':''}"><div class="wheelBox"><canvas class="wheelCanvas" width="900" height="900"></canvas><button class="spin spinCenter">Drej</button></div><div class="wheelSide"><div class="winner"></div><div class="wheelControls"><button class="spin">Drej hjulet</button><button class="editNames">${w.data.editing?'Skjul liste':'Rediger liste'}</button></div><div class="chosen"><b>Valgte:</b><br>${w.data.chosen.join(', ')||'Ingen endnu'}</div><div class="editArea"><textarea>${w.data.names.join('\n')}</textarea><div class="wheelTools"><button class="names">Til hjul</button><button class="saveList">Gem liste</button><button class="loadList">Hent liste</button><button class="resetPool">Nulstil pulje</button></div></div></div></div>`;drawWheel(c.querySelector('canvas'),w,w.data.rot||0);wireWheel(c,w)}
 if(w.type==='groups'){w.data.names??=[];w.data.size??=2;w.data.groups??=[];c.innerHTML=`<div class="groupsBox ${w.data.listHidden?'groupsListHidden':''}"><div class="groupSpin"><canvas class="groupWheel" width="700" height="700"></canvas><button class="groupSpinBtn newGroups">Dan grupper</button></div><div class="groupsControls"><div class="groupsRow"><button class="showGroupList">Vis/rediger liste</button></div><div class="groupsRow editOnly"><button class="loadGroupList">Hent liste</button><button class="saveGroupList">Gem liste</button></div><div class="groupsRow editOnly"><label>Personer pr. gruppe <input class="groupSize" type="number" min="1" max="12" value="${w.data.size}"></label><button class="toGroups">Til grupper</button></div><textarea class="groupNames editOnly" placeholder="Én person/ting pr. linje">${esc((w.data.names||[]).join('\n'))}</textarea><div class="groupsResult">${renderGroups(w.data.groups)}</div></div></div>`;wireGroups(c,w)}
 if(w.type==='link'){c.innerHTML=`<div class="linkBox"><a target="_blank" href="${esc(w.data.url||'#')}">${esc(w.data.text||'Klikbart link')}</a><button class="edit">Rediger link</button></div>`;c.querySelector('.edit').onclick=()=>askLink(w)}
 if(w.type==='image'){if(w.data.src){c.innerHTML=`<img src="${esc(w.data.src)}">`}else{c.innerHTML=`<div class="imageChoice"><button class="localImg">Vælg billede fra enhed</button><button class="urlImg">Indsæt billede fra URL</button></div>`;c.querySelector('.localImg').onclick=()=>pickFile('image/*',src=>{w.data.src=src;fillContent(el,w);save()});c.querySelector('.urlImg').onclick=()=>askImageUrl(w)}}
 if(w.type==='pdf'){c.innerHTML=w.data.src?`<div class="pdfBox"><object data="${w.data.src}" type="application/pdf"><a target="_blank" href="${w.data.src}">${esc(w.data.text||'Åbn PDF')}</a></object></div>`:`<div class="pdfBox"><button>Vælg lokal PDF</button><button class="linkpdf">Brug link</button><p>Google Drive kan blokere iframe. Lokal PDF er mest stabil.</p></div>`;c.onclick=e=>{if(e.target.className==='linkpdf')askPdfLink(w); else if(!w.data.src)pickFile('application/pdf',src=>{w.data.src=src;fillContent(el,w);save()})}}
}

function safeSlideTitle(s,i){return (s.title&&String(s.title).trim()) ? s.title : 'Tavle '+(i+1)}
function ensureVisibleOnSlide(w){
  w.x=Math.max(20,Math.min(w.x,innerWidth-Math.min(w.w,innerWidth*.9)-20));
  w.y=Math.max(70,Math.min(w.y,innerHeight-Math.min(w.h,innerHeight*.82)-120));
}
function moveWidgetToSlide(widgetId,targetIndex){
  if(targetIndex<0||targetIndex>=state.slides.length)return;
  const cur=slide();
  const i=cur.widgets.findIndex(x=>x.id===widgetId);
  if(i<0)return;
  const [widget]=cur.widgets.splice(i,1);
  ensureVisibleOnSlide(widget);
  state.slides[targetIndex].widgets.push(widget);
  state.active=targetIndex;
  render();
  select(widget.id);
  toast('Flyttet til tavle '+(targetIndex+1));
  save();
}
function copyWidgetToSlide(widgetId,targetIndex){
  if(targetIndex<0||targetIndex>=state.slides.length)return;
  const widget=slide().widgets.find(x=>x.id===widgetId);
  if(!widget)return;
  const copy=JSON.parse(JSON.stringify(widget));
  copy.id=uid();
  copy.x+=30; copy.y+=30; copy.z=++z;
  ensureVisibleOnSlide(copy);
  state.slides[targetIndex].widgets.push(copy);
  state.active=targetIndex;
  render();
  select(copy.id);
  toast('Kopieret til tavle '+(targetIndex+1));
  save();
}
function newSlideForWidget(widgetId,copy=false){
  state.slides.push({title:'Ny tavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]});
  const idx=state.slides.length-1;
  copy ? copyWidgetToSlide(widgetId,idx) : moveWidgetToSlide(widgetId,idx);
}
function widgetMoveModal(w){
  let rows=state.slides.map((s,i)=>`
    <div class="slideMoveRow">
      <b>${i+1}. ${esc(safeSlideTitle(s,i))}${i===state.active?' (nu)':''}</b>
      <div class="actions">
        <button data-target="${i}" ${i===state.active?'disabled':''}>Vælg</button>
      </div>
    </div>`).join('');
  showModal(`<h2>Flyt widget</h2>
    <p><b>${esc(w.title||titles[w.type]||'Widget')}</b></p>
    <label style="display:flex;gap:10px;align-items:center;background:#f3f4f6;border-radius:12px;padding:10px;margin:10px 0">
      <input id="keepCopy" type="checkbox"> Behold kopi på denne tavle
    </label>
    <div class="slideList">${rows}</div>
    <hr>
    <button id="moveNew">Flyt til ny tavle</button>
    <button id="close">Luk</button>`);
  const useCopy=()=>modal.querySelector('#keepCopy').checked;
  modal.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{const i=+b.dataset.target;closeModal();useCopy()?copyWidgetToSlide(w.id,i):moveWidgetToSlide(w.id,i)});
  modal.querySelector('#moveNew').onclick=()=>{closeModal();newSlideForWidget(w.id,useCopy())};

function wheelWinnerAtPointer(names,rot){
  if(!names || !names.length)return '';
  const two=Math.PI*2, step=two/names.length;
  const a=((0-rot)%two+two)%two; // fixed pointer is at 0 radians/right side
  const idx=Math.floor(a/step)%names.length;
  return names[idx];
}

}

function wheelIndexFromCanvasEvent(canvas,e,w){
  const names=w.data.names||[];
  if(!names.length)return -1;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*canvas.width;
  const y=(e.clientY-rect.top)/rect.height*canvas.height;
  const cx=canvas.width/2, cy=canvas.height/2;
  const dx=x-cx, dy=y-cy;
  const dist=Math.hypot(dx,dy);
  const r=Math.min(canvas.width,canvas.height)*0.47;
  if(dist>r || dist<r*.14)return -1; // ignore outside wheel and center button area
  const two=Math.PI*2, step=two/names.length, rot=w.data.rot||0;
  const a=((Math.atan2(dy,dx)-rot)%two+two)%two;
  return Math.floor(a/step)%names.length;
}

}

  modal.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.active=+b.dataset.go;closeModal();render();save()});
  modal.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{swapSlides(+b.dataset.up,+b.dataset.up-1);slideOverviewModal()});
  modal.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{swapSlides(+b.dataset.down,+b.dataset.down+1);slideOverviewModal()});
  modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{deleteSlideAt(+b.dataset.del);slideOverviewModal()});
  modal.querySelector('#newSlideFromOverview').onclick=()=>{state.slides.push({title:'Ny tavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]});state.active=state.slides.length-1;render();slideOverviewModal();save()};
  modal.querySelector('#close').onclick=closeModal;
}


document.querySelectorAll('.toolbar [data-tool], .toolbar button').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    if(Date.now()<toolClickBlockUntil){
      e.preventDefault();
      e.stopPropagation();
    }
  },true);
});

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=e=>{if(app.classList.contains('toolbarBlocked')||Date.now()<toolClickBlockUntil){e.preventDefault();e.stopPropagation();return}const t=b.dataset.tool;if(t==='text')addWidget('text',{text:'Skriv instruktion her…',fontSize:24});if(t==='video'){let w=addWidget('video',{url:''});askVideo(w)}if(t==='draw'){setDrawActive(!app.classList.contains('drawActive'))}if(t==='wheel')addWidget('wheel',{});if(t==='groups')addWidget('groups',{});if(t==='timer')addWidget('timer',{});if(t==='image')addWidget('image',{});if(t==='link'){let w=addWidget('link',{text:'Klikbart link',url:'https://'});askLink(w)}if(t==='pdf')addWidget('pdf',{});if(t==='bg')bgModal();if(t==='grid'){slide().grid=!slide().grid;render()}if(t==='save')saveModal()});

app.addEventListener('pointerdown',e=>{
  if(e.target===app || e.target===titleEl){ select(null); }
});

document.getElementById('prev').onclick=()=>prevSlide();document.getElementById('next').onclick=()=>nextSlide();document.getElementById('slidesOverview').onclick=slideOverviewModal;document.getElementById('addSlide').onclick=()=>{state.slides.push({title:'Ny tavle',bg:'linear-gradient(135deg,#edf6ff,#dff8e8)',bgImage:'',bgFit:'cover',grid:false,draw:'',widgets:[]});state.active=state.slides.length-1;render()};document.getElementById('clearSlide').onclick=()=>{if(confirm('Ryd denne tavle?')){slide().widgets=[];slide().draw='';render()}};document.getElementById('drawTop').onclick=()=>setDrawActive(!app.classList.contains('drawActive'));document.getElementById('present').onclick=()=>{app.classList.toggle('present');select(null);document.activeElement&&document.activeElement.blur();titleEl.contentEditable=app.classList.contains('present')?'false':'true'};

['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>ensureAudio(),{once:false,passive:true}));

function nextSlide(){if(state.active<state.slides.length-1){state.active++;render();toast('Tavle '+(state.active+1))}}
function prevSlide(){if(state.active>0){state.active--;render();toast('Tavle '+(state.active+1))}}
function goToSlide(i){if(i>=0&&i<state.slides.length){state.active=i;render();toast('Tavle '+(state.active+1))}}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.matches('input,textarea,select') || t.isContentEditable)) return;
  if(app.classList.contains('drawActive')) return;
  if(e.key==='ArrowRight'){e.preventDefault();nextSlide()}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSlide()}
  if(/^[1-9]$/.test(e.key)){e.preventDefault();goToSlide(Number(e.key)-1)}
  if(e.key==='0'){e.preventDefault();goToSlide(9)}
});
let swipeStart=null;
app.addEventListener('pointerdown',e=>{
  if(app.classList.contains('drawActive')) return;
  if(e.target.closest('.widget,.toolbar,.topbar,.modalBackdrop,.toolbarPeek')) return;
  swipeStart={x:e.clientX,y:e.clientY,t:Date.now()};
});
app.addEventListener('pointerup',e=>{
  if(!swipeStart) return;
  const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
  if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)*1.5){
    dx<0 ? nextSlide() : prevSlide();
  }
  swipeStart=null;
});
titleEl.oninput=()=>{slide().title=titleEl.textContent;save()};titleEl.onkeydown=e=>{if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();titleEl.blur();save()}};
function drawPt(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
let drawStart=null, drawSnapshot=null;
function setDrawActive(on){draw.classList.toggle('active',on);app.classList.toggle('drawActive',on);document.getElementById('drawPanel').classList.toggle('show',on);document.querySelectorAll('[data-tool="draw"],#drawTop').forEach(b=>b&&b.classList.toggle('active',on));if(on)select(null)}
function setDrawTool(mode){drawMode=mode;document.querySelectorAll('[data-drawmode]').forEach(b=>b.classList.toggle('active',b.dataset.drawmode===mode))}
function setupStroke(){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+document.getElementById('penSize').value;ctx.strokeStyle=document.getElementById('penColor').value;ctx.fillStyle=document.getElementById('penColor').value}
function restoreSnapshot(){if(drawSnapshot)ctx.putImageData(drawSnapshot,0,0)}
function drawShape(from,to){setupStroke();if(drawMode==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth*=2;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();ctx.globalCompositeOperation='source-over';return}ctx.globalCompositeOperation='source-over';ctx.beginPath();if(drawMode==='line'){ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke()}else if(drawMode==='rect'){ctx.strokeRect(from.x,from.y,to.x-from.x,to.y-from.y)}else if(drawMode==='circle'){let rx=(to.x-from.x)/2,ry=(to.y-from.y)/2;ctx.ellipse(from.x+rx,from.y+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.stroke()}else{ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke()}}
draw.addEventListener('pointerdown',e=>{if(!draw.classList.contains('active'))return;isDrawing=true;draw.setPointerCapture(e.pointerId);drawStart=drawPt(e);drawSnapshot=ctx.getImageData(0,0,draw.width,draw.height);if(drawMode==='pen'||drawMode==='eraser'){ctx.beginPath();ctx.moveTo(drawStart.x,drawStart.y)}});
draw.addEventListener('pointermove',e=>{if(!isDrawing)return;const p=drawPt(e);if(drawMode==='pen'||drawMode==='eraser'){drawShape(drawStart,p);drawStart=p}else{restoreSnapshot();drawShape(drawStart,p)}});
draw.addEventListener('pointerup',e=>{if(!isDrawing)return;const p=drawPt(e);if(!(drawMode==='pen'||drawMode==='eraser')){restoreSnapshot();drawShape(drawStart,p)}isDrawing=false;drawSnapshot=null;ctx.globalCompositeOperation='source-over';save()});
draw.addEventListener('pointercancel',()=>{isDrawing=false;drawSnapshot=null;ctx.globalCompositeOperation='source-over'});
document.querySelectorAll('[data-drawmode]').forEach(b=>b.onclick=()=>setDrawTool(b.dataset.drawmode));
document.getElementById('drawClear').onclick=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);slide().draw='';save()};
document.getElementById('drawOff').onclick=()=>setDrawActive(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setDrawActive(false)});



const toolbarEl=document.querySelector('.toolbar'),
      toolbarPeek=document.getElementById('toolbarPeek'),
      pinToolbar=document.getElementById('pinToolbar'),
      toolbarPinFloat=document.getElementById('toolbarPinFloat'),
      toolbarOpts=document.getElementById('toolbarOpts');

let toolbarPinned=localStorage.getItem('maans_toolbar_pinned')==='1',
    toolbarTimer=null,
    toolbarDelay=Number(localStorage.getItem('maans_toolbar_delay')||5000);

let toolbarBlockTimer=null;
function blockToolbarClicks(ms=650){toolClickBlockUntil=Date.now()+ms;app.classList.add('toolbarBlocked');clearTimeout(toolbarBlockTimer);toolbarBlockTimer=setTimeout(()=>app.classList.remove('toolbarBlocked'),ms)}
function setToolbarHidden(on){
  if(toolbarPinned) on=false;
  app.classList.toggle('toolbarHidden',on);
  toolbarPinFloat.classList.toggle('pinned',toolbarPinned);
}
function updatePinButtons(){
  pinToolbar.textContent=toolbarPinned?'📍':'📌';
  toolbarPinFloat.textContent=toolbarPinned?'📍':'📌';
  toolbarPinFloat.title=toolbarPinned?'Frigør værktøjslinje':'Fastgør værktøjslinje';
}
function showToolbarTemp(){
  setToolbarHidden(false);
  clearTimeout(toolbarTimer);
  if(!toolbarPinned) toolbarTimer=setTimeout(()=>setToolbarHidden(true),toolbarDelay);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && app.classList.contains('toolbarHidden')){
    showToolbarTemp();
  }
});

}
function toggleToolbarPin(){
  toolbarPinned=!toolbarPinned;
  localStorage.setItem('maans_toolbar_pinned',toolbarPinned?'1':'0');
  app.classList.toggle('toolbarPinned',toolbarPinned);
  updatePinButtons();
  showToolbarTemp();
}
function toolbarSettingsModal(){
  showModal(`<h2>Værktøjslinje</h2>
    <div class="toolbarSettings">
      <label><span>Auto-skjul efter sekunder</span><input id="tbDelay" type="number" min="1" max="30" value="${Math.round(toolbarDelay/1000)}"></label>
      <label><span>Fastgør værktøjslinjen</span><input id="tbPinned" type="checkbox" ${toolbarPinned?'checked':''}></label>
    </div>
    <p>Standard er 5 sekunder.</p>
    <button id="ok">Gem</button><button id="close">Luk</button>`);
  modal.querySelector('#ok').onclick=()=>{
    toolbarDelay=Math.max(1,Math.min(30,Number(modal.querySelector('#tbDelay').value||5)))*1000;
    toolbarPinned=modal.querySelector('#tbPinned').checked;
    localStorage.setItem('maans_toolbar_delay',String(toolbarDelay));
    localStorage.setItem('maans_toolbar_pinned',toolbarPinned?'1':'0');
    app.classList.toggle('toolbarPinned',toolbarPinned);
    updatePinButtons();
    closeModal();
    showToolbarTemp();
  };
  modal.querySelector('#close').onclick=closeModal;
}
pinToolbar.onclick=e=>{
  e.stopPropagation();
  toolbarPinned=false;
  localStorage.setItem('maans_toolbar_pinned','0');
  app.classList.remove('toolbarPinned');
  updatePinButtons();
  clearTimeout(toolbarTimer);
  setToolbarHidden(true);
};
toolbarPinFloat.onclick=e=>{e.preventDefault();e.stopPropagation();toggleToolbarPin();showToolbarTemp();blockToolbarClicks(750)};
toolbarOpts.onclick=e=>{e.stopPropagation();toolbarSettingsModal()};
toolbarPeek.onclick=e=>{e.preventDefault();e.stopPropagation();showToolbarTemp();blockToolbarClicks(750)};
app.addEventListener('pointermove',e=>{if(e.clientY>innerHeight-130)showToolbarTemp()});
app.addEventListener('pointerdown',e=>{if(e.target.closest('.toolbar,.toolbarPeek,.toolbarPinFloat'))showToolbarTemp()});
updatePinButtons();
app.classList.toggle('toolbarPinned',toolbarPinned);
setTimeout(()=>setToolbarHidden(true),toolbarDelay);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && app.classList.contains('toolbarHidden')){
    showToolbarTemp();
  }
});


const __render_original = render;
render = function(){
  __render_original();
  updateSlidesOverviewVisibility();
};
render();updateSlidesOverviewVisibility();
})();


</script>
</body></html>
