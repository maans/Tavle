</style>
<script>
(function(){
  'use strict';
  /* SAFE24 cleanup2:
     Den gamle modal/localStorage-papirkurv fra v1.2.46 er fjernet.
     Den fungerende papirkurv er nu board-baseret og findes i PAPIRKURV / INTERNAL TRASH BOARD.
     Denne lille cleanup-hook bevares, fordi board-papirkurven kalder window.__tavleCleanupWidget
     for at stoppe hjul/iframe-processer, før en widget flyttes eller slettes. */
  function cleanupWidgetProcesses(id){
    try{ if(window.__tavleStopWheel) window.__tavleStopWheel(id,true); }catch(e){}
    try{ if(typeof activeIframeWidgetId!=='undefined' && activeIframeWidgetId&&String(activeIframeWidgetId)===String(id)) clearIframeControl(); }catch(e){}
  }
  window.__tavleCleanupWidget=cleanupWidgetProcesses;
  function getWidgetByIdOnCurrent(id){
    try{return (slide().widgets||[]).find(w=>String(w.id)===String(id))||null;}catch(e){return null;}
  }

  // Wheel cleanup: cancel RAF/timeouts and make Stop/Space reliable.
  const wheelJobs=new Map();
  function jobFor(id){let j=wheelJobs.get(String(id)); if(!j){j={raf:0,timers:new Set(),token:0}; wheelJobs.set(String(id),j)} return j;}
  function wheelSetTimeout(id,fn,ms){const j=jobFor(id); const t=setTimeout(()=>{j.timers.delete(t);fn()},ms); j.timers.add(t); return t;}
  window.__tavleStopWheel=function(id,silent){
    if(!id)return;
    const j=jobFor(id); j.token++;
    if(j.raf){cancelAnimationFrame(j.raf);j.raf=0}
    j.timers.forEach(t=>clearTimeout(t)); j.timers.clear();
    let w=null; try{w=(state.slides||[]).flatMap(sl=>sl.widgets||[]).find(x=>String(x.id)===String(id));}catch(e){}
    if(w&&w.type==='wheel'){w.data=w.data||{}; w.data.autoRunning=false; w.data.spinning=false;}
    if(!silent)try{toast('Hjul stoppet')}catch(e){}
    try{render(); if(w)select(w.id,{editText:false}); save();}catch(e){}
  };
  if(typeof runWheelSpin==='function'){
    runWheelSpin=function(c,w,{auto=false,onDone=null}={}){
      const el=c.closest('.widget'); if(!el||!w)return;
      const id=w.id; const j=jobFor(id); const token=++j.token;
      const canv=el.querySelector('canvas'); const btn=el.querySelector('.spinCenter')||el.querySelector('.spin');
      let names=[...(w.data.names||[])];
      if(!names.length){toast('Puljen er tom'); if(onDone)onDone(false); return;}
      w.data.spinning=true; if(btn){btn.disabled=false;btn.textContent='Stop';btn.classList.add('running')}
      const idx=Math.floor(Math.random()*names.length), winner=names[idx];
      const duration=auto?1050+Math.random()*350:2600+Math.random()*700;
      const startRot=w.data.rot||0;
      const endRot=startRot+targetRotationForIndex(idx,names.length,auto?3+Math.floor(Math.random()*2):6+Math.floor(Math.random()*3));
      const startTime=performance.now(); let lastTick=0;
      function finish(ok){w.data.spinning=false; if(btn){btn.disabled=false;btn.textContent=w.data.autoRunning?'Stop':'Drej';btn.classList.toggle('running',!!w.data.autoRunning)} if(onDone)onDone(ok,winner);}
      function frame(nowTime){
        if(j.token!==token || !document.body.contains(el) || !getWidgetByIdOnCurrent(id)){finish(false);return;}
        const p=Math.min(1,(nowTime-startTime)/duration),rot=startRot+(endRot-startRot)*easeOutCubic(p);
        drawWheel(canv,w,rot);
        if(nowTime-lastTick>(auto?120:95) && p<.94){wheelTick();lastTick=nowTime}
        if(p<1){j.raf=requestAnimationFrame(frame)}else{
          j.raf=0; drawWheel(canv,w,endRot); wheelLand(); if(!auto)wheelSetTimeout(id,wheelLand,80); animateWinner(c,winner);
          w.data.chosen=w.data.chosen||[]; w.data.chosen.push(winner);
          if(!w.data.keepPool){ if(auto){w.data.names.splice(idx,1)} else if(confirm(winner+' blev valgt. Fjern fra puljen?')){w.data.names.splice(idx,1)} }
          w.data.winner=''; w.data.rot=0; w.data.statsView=!!(w.data.statsView || auto); w.data.spinning=false;
          fillContent(el,w); save(); finish(true);
        }
      }
      j.raf=requestAnimationFrame(frame);
    };
  }
  if(typeof startWheelAuto==='function'){
    startWheelAuto=function(c,w){
      const el=c.closest('.widget'); if(!el||!w)return;
      if(w.data.autoRunning||w.data.spinning){window.__tavleStopWheel(w.id);return;}
      w.data.autoRunning=true; w.data.statsView=true; fillContent(el,w); save();
      let remaining=w.data.keepPool?Math.max(1,parseInt(w.data.autoCount||1,10)):Math.min(Math.max(1,parseInt(w.data.autoCount||1,10)),(w.data.names||[]).length);
      const step=()=>{
        if(!w.data.autoRunning || remaining<=0 || !(w.data.names||[]).length){w.data.autoRunning=false;w.data.spinning=false;fillContent(el,w);save();return;}
        remaining--;
        runWheelSpin(el.querySelector('.content')||el,w,{auto:true,onDone:(ok)=>{ if(ok&&w.data.autoRunning)wheelSetTimeout(w.id,step,180); else {w.data.spinning=false;w.data.autoRunning=false;save();} }});
      };
      wheelSetTimeout(w.id,step,60);
    };
  }
  document.addEventListener('keydown',function(e){
    const key=(e.key||'').toLowerCase();
    if((e.code==='Space'||e.key===' ')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
      const tag=(e.target&&e.target.tagName||'').toLowerCase(); if(/input|textarea|select/.test(tag))return;
      const w=selected?getWidgetByIdOnCurrent(selected):null; if(w&&w.type==='wheel'){
        e.preventDefault(); if(w.data&&(w.data.autoRunning||w.data.spinning)) window.__tavleStopWheel(w.id); else {const el=document.querySelector('.widget[data-id="'+CSS.escape(String(w.id))+'"]'); if(el) runWheelSpin(el.querySelector('.content')||el,w,{auto:false});}
      }
    }
  },true);

  // Make the spin button a reliable Stop button when running.
  document.addEventListener('click',function(e){
    const btn=e.target.closest&&e.target.closest('.spinCenter'); if(!btn)return;
    const el=btn.closest('.widget'); if(!el)return; const w=getWidgetByIdOnCurrent(el.dataset.id); if(!w||w.type!=='wheel')return;
    if(w.data&&(w.data.autoRunning||w.data.spinning)){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();window.__tavleStopWheel(w.id);}
  },true);

  // Text/dataset: all text widgets can become dataset widgets; all dataset assets remain editable as text.
  /* SAFE77 LOCAL MAP: data/listeflow
   Formål:
   - Datawidget og listewidget skal være appens fælles data-mellemstationer.
   - Aktiviteter bør hente lister herfra i stedet for hver især at importere filer.
   - Fremtidige ændringer bør samle flowet: import/drop -> data/liste -> aktivitet.
   Særligt:
   - Test CSV/TSV/XLSX, Æ/Ø/Å, kolonnevalg og eksport efter ændringer.
   - Undgå datamodelændringer uden migration og backup-test.
   - KahooPardy har følsomt template-/importområde og må ikke ændres her. */
function createDatasetWidgetFromList(name,items){
    items=(items||[]).map(x=>String(x||'').trim()).filter(Boolean);
    if(!items.length){try{toast('Listen er tom')}catch(e){};return null;}
    name=String(name||'Liste').trim()||'Liste';

    // 1) Register in the shared list bank immediately, so all Hent liste modals can use it.
    try{
      const bank=(typeof wheelListBank==='function') ? wheelListBank() : {};
      bank[name]=[...items];
      if(typeof saveWheelListBank==='function') saveWheelListBank(bank);
      else localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
    }catch(e){console.warn('Kunne ikke gemme liste i fælles listebank',e)}

    // 2) Create visible editable list-widget on the tavle.
    const w=addDroppedWidget('text',{text:items.join('\n'),kind:'list',listAsset:true,createdFromDataset:true,sharedListName:name},{x:180,y:120},name);
    if(w){
      w.title=name;
      w.data=w.data||{};
      w.data.kind='list';
      w.data.listAsset=true;
      w.data.createdFromDataset=true;
      w.data.sharedListName=name;
      w.w=Math.min(520,Math.max(360,innerWidth*.36));
      w.h=Math.min(520,Math.max(300,innerHeight*.40));
      try{fitWidgetToViewport(w)}catch(e){}
      render(); select(w.id,{editText:true}); save();
      try{toast('Liste oprettet og gemt: '+items.length+' punkter')}catch(e){}
    }
    return w;
  }
  window.createDatasetWidgetFromList=createDatasetWidgetFromList;
  const oldMakeWidget=makeWidget;
  makeWidget=function(w){
    oldMakeWidget(w);
    try{
      const el=document.querySelector('.widget[data-id="'+CSS.escape(String(w.id))+'"]'); if(!el)return;
      if(w.type==='text'){
        const mini=el.querySelector('.mini');
        if(mini && !mini.querySelector('[data-act="textDatasetToggle"]')){
          const b=document.createElement('button'); b.type='button'; b.dataset.act='textDatasetToggle'; b.title=w.data&&w.data.datasetId?'Skift/parse datasæt':'Vis som datasæt'; b.textContent=w.data&&w.data.datasetId?'📊':'T⇄📊';
          mini.insertBefore(b,mini.querySelector('[data-act="max"]')||mini.firstChild);
          b.onclick=function(e){e.preventDefault();e.stopPropagation();
            w.data=w.data||{};
            if(w.data.datasetId && w.data.datasetView!==false){w.data.datasetView=false; const ds=findDatasetById(w.data.datasetId); w.data.text=datasetToDelimitedText(ds||{columns:[],rows:[]},'\t');}
            else {try{const parsed=parseDatasetFromText(w.data.text||'',String(w.title||'Datasæt').replace(/^📊\s*/,'')); if(!parsed)throw new Error('Ingen tabeldata fundet'); parsed.id=w.data.datasetId||parsed.id; updateDatasetInState(parsed); w.data.datasetId=parsed.id; w.data.datasetView=true; w.title='📊 '+(parsed.name||w.title||'Datasæt');}catch(err){toast('Kunne ikke vise som datasæt: '+(err&&err.message||'ukendt fejl'));return;}}
            render(); select(w.id,{editText:false}); save();
          };
        }
        // If in plain text mode, add a visible button above textarea as well.
        if(!(w.data&&w.data.datasetId) || w.data.datasetView===false){
          const content=el.querySelector('.content.text .text');
          if(content && !content.querySelector('.datasetAsPreview')){
            const bar=document.createElement('div'); bar.className='datasetTextTools';
            const btn=document.createElement('button'); btn.type='button'; btn.className='datasetAsPreview'; btn.textContent=(w.data&&w.data.datasetId)?'Opdater datasæt / vis preview':'Vis som datasæt';
            const hint=document.createElement('span'); hint.className='datasetTextHint'; hint.textContent='Skriv tabel som TSV/CSV og vis den som datasæt.';
            bar.appendChild(btn); bar.appendChild(hint); content.insertBefore(bar,content.firstChild);
            btn.onclick=function(e){e.preventDefault();e.stopPropagation();try{const parsed=parseDatasetFromText(w.data.text||'',String(w.title||'Datasæt').replace(/^📊\s*/,'')); if(!parsed)throw new Error('Ingen tabeldata fundet'); parsed.id=w.data.datasetId||parsed.id; updateDatasetInState(parsed); w.data.datasetId=parsed.id; w.data.datasetView=true; w.title='📊 '+(parsed.name||w.title||'Datasæt'); render();select(w.id,{editText:false});save();}catch(err){toast('Kunne ikke parse tabel: '+(err&&err.message||'ukendt fejl'))}};
          }
        }
      }
    }catch(e){console.warn('dataset postprocess failed',e)}
  };

  // Save list/result now creates a visible text/dataset widget instead of a hidden list asset.
  openSaveListModal=function(w){
    const items=wheelListNamesForSave(w).map(x=>String(x||'').trim()).filter(Boolean);
    showModal(`<h2>Gem som tekst/datasæt-widget</h2><p>Listen bliver oprettet som en synlig widget på tavlen. Den kan redigeres, downloades og hentes af andre widgets som datasæt.</p><label>Navn<input id="listName" value="Min liste"></label><button id="createListWidget">Opret widget</button><button id="close">Luk</button>`);
    const input=modal.querySelector('#listName'); setTimeout(()=>{try{input.focus();input.select()}catch(e){}},50);
    modal.querySelector('#createListWidget').onclick=function(){const name=String(input.value||'Min liste').trim()||'Min liste'; if(!items.length){toast('Listen er tom');return;} closeModal(); createDatasetWidgetFromList(name,items);};
    modal.querySelector('#close').onclick=closeModal;
  };

  // Download content: dataset widgets download raw CSV/TSV instead of preview text.
  if(typeof collectEmbeddedMedia==='function'){
    const oldCollect=collectEmbeddedMedia;
    collectEmbeddedMedia=function(){
      const items=oldCollect().filter(it=>!(it.type==='Tekst'&&/^📊\s*Datasæt:/m.test(decodeURIComponent(String(it.src||'').split(',')[1]||''))));
      try{(state.slides||[]).forEach((sl,si)=>{const slideName=(typeof safeSlideTitle==='function'?safeSlideTitle(sl,si):('Tavle '+(si+1)));(sl.widgets||[]).forEach((w,wi)=>{if(w.type==='text'&&w.data&&w.data.datasetId){const ds=findDatasetById(w.data.datasetId); if(ds){const txt=datasetToDelimitedText(ds,'\t');items.push({type:'Datasæt',slide:slideName,name:(ds.name||w.title||`datasæt-${wi+1}`)+'.tsv',src:'data:text/tab-separated-values;charset=utf-8,'+encodeURIComponent(txt),ext:'tsv',filename:safeFileName((ds.name||w.title||`datasæt-${wi+1}`),'tsv'),label:'Datasæt',id:'datasetDl'+si+'_'+wi});}}})})}catch(e){}
      return items;
    };
  }

  // Import summary should also close on Enter.
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('importSummaryCard')?.classList.contains('show')){closeImportSummary();}},true);
})();
</script>


<script id="maans-mm06-visible-widget-lists">
(function(){
  'use strict';
  if(window.__maansMM06VisibleWidgetLists) return;
  window.__maansMM06VisibleWidgetLists = true;

  function mm06Esc(v){
    try{ return (typeof esc==='function') ? esc(v) : String(v==null?'':v).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }
    catch(_e){ return String(v==null?'':v); }
  }
  function mm06CurrentWidgets(){
    try{
      const sl = (typeof slide==='function') ? slide() : null;
      return (sl && Array.isArray(sl.widgets)) ? sl.widgets : [];
    }catch(_e){ return []; }
  }
  function mm06DatasetById(id){
    try{
      if(typeof findDatasetById==='function') return findDatasetById(id);
      const arr = Array.isArray(state && state.datasets) ? state.datasets : [];
      return arr.find(ds => String(ds && ds.id) === String(id));
    }catch(_e){ return null; }
  }
  function mm06DatasetColumnItems(ds,colIndex){
    try{
      return (ds && Array.isArray(ds.rows) ? ds.rows : [])
        .map(row => String((row || [])[colIndex] == null ? '' : (row || [])[colIndex]).trim())
        .filter(Boolean);
    }catch(_e){ return []; }
  }
  function mm06TextItems(txt){
    return String(txt||'')
      .split(/\r?\n|[,;]+/)
      .map(x => String(x||'').trim())
      .filter(Boolean)
      .filter(x => !/^📊\s*Datasæt:?/i.test(x) && !/^\d+\s*rækker\s*[·,]/i.test(x) && !/^Tip:/i.test(x));
  }
  function mm06VisibleListSources(excludeId){
    const out=[];
    const seen=new Set();
    const addSource=function(src){
      const key=String(src.kind||'')+'|'+String(src.widgetId||'')+'|'+String(src.datasetId||'')+'|'+String(src.colIndex==null?'':src.colIndex)+'|'+String(src.name||'');
      if(seen.has(key)) return;
      seen.add(key); out.push(src);
    };
    mm06CurrentWidgets().forEach(function(w){
      if(!w || String(w.id)===String(excludeId)) return;
      const title=String(w.title || (w.type==='text'?'Tekst':'Widget')).replace(/^📊\s*/,'').trim() || 'Widget';
      if(w.type==='text' && w.data){
        if(w.data.datasetId){
          const ds=mm06DatasetById(w.data.datasetId);
          if(ds && Array.isArray(ds.rows) && ds.rows.length){
            const cols=(Array.isArray(ds.columns) && ds.columns.length) ? ds.columns : ['Kolonne 1'];
            if(cols.length===1){
              addSource({kind:'widgetDatasetCol',widgetId:w.id,datasetId:ds.id,colIndex:0,name:title,items:mm06DatasetColumnItems(ds,0)});
            }else{
              cols.forEach(function(col,i){
                addSource({kind:'widgetDatasetCol',widgetId:w.id,datasetId:ds.id,colIndex:i,name:title+' – '+String(col||('Kolonne '+(i+1))),items:mm06DatasetColumnItems(ds,i)});
              });
            }
          }
        }else{
          const items=mm06TextItems(w.data.text||'');
          if(items.length) addSource({kind:'widgetText',widgetId:w.id,name:title,items:items});
        }
      }
    });
    return out.filter(src => Array.isArray(src.items) && src.items.length);
  }
  function mm06SavedListButtons(keys){
    return keys.length ? keys.map(k => '<button class="pickList" data-k="'+mm06Esc(k)+'">'+mm06Esc(k)+'</button>').join(' ') : '<p>Ingen gemte lister endnu.</p>';
  }
  function mm06AllDatasetHtml(){
    let html='';
    try{
      const dsets=Array.isArray(state && state.datasets) ? state.datasets : [];
      if(dsets.length){
        html += '<h3>Alle datasæt</h3>';
        html += dsets.map(function(ds){
          const cols=(ds.columns||[]).map(function(col,i){return '<button class="pickDatasetCol" data-ds="'+mm06Esc(ds.id)+'" data-col="'+i+'">'+mm06Esc(col||('Kolonne '+(i+1)))+'</button>';}).join(' ');
          return '<div class="datasetPick"><span>'+mm06Esc(ds.name||'Datasæt')+'</span> '+cols+'</div>';
        }).join('');
      }
    }catch(_e){}
    return html;
  }
  function mm06VisibleWidgetsHtml(sources){
    if(!sources.length) return '';
    return '<h3>Synlige liste-widgets</h3><div class="mm06WidgetLists">'+sources.map(function(src,i){
      return '<button class="pickVisibleWidgetList" data-mm06-i="'+i+'">'+mm06Esc(src.name)+' <small>('+src.items.length+')</small></button>';
    }).join(' ')+'</div>';
  }
  function mm06InstallGroupLoadHandler(c,w){
    try{
      const loadBtn=c && c.querySelector && c.querySelector('.loadGroupList');
      if(!loadBtn) return;
      loadBtn.onclick=function(ev){
        if(ev){ev.preventDefault(); ev.stopPropagation();}
        const useList=function(pick,items){
          items=(items||[]).map(x=>String(x||'').trim()).filter(Boolean);
          if(!items.length){ if(typeof toast==='function') toast('Listen er tom'); return; }
          w.data=w.data||{};
          w.data.names=[...items];
          w.data.groups=[];
          w.data.groupLocks=[];
          w.data.rot=0;
          w.data.listHidden=false;

<!-- v1.2.45-mM-17: keep editable list-widget linked to shared list bank -->
<script>
(function(){
  'use strict';
  if(window.__maansMM17ListWidgetBankSync) return;

  function lines(txt){
    return String(txt||'').split(/\r?\n/).map(function(x){return String(x||'').trim();}).filter(Boolean);
  }
  function syncListWidgetToBank(w){
    try{
      if(!w || w.type!=='text' || !w.data) return;
      if(!(w.data.kind==='list' || w.data.listAsset===true || w.data.createdFromDataset===true)) return;
      var name=String(w.data.sharedListName || w.title || 'Liste').replace(/^📊\s*/,'').trim();
      if(!name) return;
      var items=lines(w.data.text||'');
      var bank=(typeof wheelListBank==='function') ? wheelListBank() : {};
      bank[name]=items;
      if(typeof saveWheelListBank==='function') saveWheelListBank(bank);
      else localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
    }catch(e){console.warn('mM17 sync list-widget failed',e);}
  }
  function currentWidgets(){
    try{var s=(typeof slide==='function')?slide():null; return (s&&Array.isArray(s.widgets))?s.widgets:[];}catch(e){return [];}
  }
  function syncAll(){
    currentWidgets().forEach(syncListWidgetToBank);
  }

  // Sync when list-widget textareas are edited and lose focus.
  document.addEventListener('change',function(e){
    try{
      var ta=e.target && e.target.closest && e.target.closest('textarea');
      if(!ta) return;
      var root=ta.closest('.widget');
      if(!root) return;
      var id=root.dataset.id;
      var w=currentWidgets().find(function(x){return String(x.id)===String(id);});
      if(w) syncListWidgetToBank(w);
    }catch(err){}
  },true);
  document.addEventListener('blur',function(e){
    try{
      var ta=e.target && e.target.closest && e.target.closest('textarea');
      if(!ta) return;
      var root=ta.closest('.widget');
      if(!root) return;
      var id=root.dataset.id;
      var w=currentWidgets().find(function(x){return String(x.id)===String(id);});
      if(w) syncListWidgetToBank(w);
    }catch(err){}
  },true);

  var oldSave=window.save;
  if(typeof oldSave==='function' && !oldSave.__mm17Wrapped){
    var wrapped=function(){
      syncAll();
      return oldSave.apply(this,arguments);
    };

    window.save=wrapped;
    try{save=wrapped;}catch(e){}
  }
  window.mm17SyncListWidgets=syncAll;
})();

<script>
(function(){
  'use strict';
  if(window.__maansMM18ListBankIncludesWidgets) return;
  window.__maansMM18ListBankIncludesWidgets = true;

  function getSlidesWidgets(){
    try{
      if(typeof slide==='function'){
        var s=slide();
        if(s && Array.isArray(s.widgets)) return s.widgets;
      }
    }catch(e){}
    try{
      if(typeof state!=='undefined' && state && Array.isArray(state.slides)){
        var sl=state.slides[Number(state.current||0)] || state.slides[0];
        return (sl && Array.isArray(sl.widgets)) ? sl.widgets : [];
      }
    }catch(e){}
    return [];
  }
  function lines(txt){
    return String(txt||'').split(/\r?\n/).map(function(x){return String(x||'').trim();}).filter(Boolean);
  }
  function isListWidget(w){
    if(!w || w.type!=='text' || !w.data || w.data.datasetId) return false;
    var title=String(w.title||'').replace(/^📊\s*/,'').trim();
    if(w.data.kind==='list' || w.data.listAsset===true || w.data.createdFromDataset===true) return true;
    if(/^Liste fra\s+/i.test(title) || /liste/i.test(title)) return true;
    // Fallback: a plain text widget with several short lines is probably a list-widget in this workflow.
    var items=lines(w.data.text||'');
    return items.length>=3 && items.length<=500 && items.every(function(x){return x.length<=140;});
  }
  function widgetLists(){
    var out={};
    getSlidesWidgets().forEach(function(w){
      if(!isListWidget(w)) return;
      var title=String((w.data && w.data.sharedListName) || w.title || 'Liste').replace(/^📊\s*/,'').trim() || 'Liste';
      var items=lines(w.data.text||'');
      if(items.length) out[title]=items;
    });
    return out;
  }

  var nativeWheelListBank = (typeof wheelListBank==='function') ? wheelListBank : null;
  window.wheelListBank = function(){
    var bank={};
    try{ if(nativeWheelListBank) bank=nativeWheelListBank() || {}; }catch(e){ bank={}; }
    var wlists=widgetLists();
    Object.keys(wlists).forEach(function(k){ bank[k]=wlists[k]; });
    return bank;
  };
  try{ wheelListBank=window.wheelListBank; }catch(e){}

  // Also persist visible list widgets into localStorage before any Hent liste modal is shown.
  function persistWidgetLists(){
    try{
      var raw={};
      if(nativeWheelListBank) raw=nativeWheelListBank() || {};
      var wlists=widgetLists();
      Object.keys(wlists).forEach(function(k){ raw[k]=wlists[k]; });
      if(typeof saveWheelListBank==='function') saveWheelListBank(raw);
      else localStorage.setItem('maans_wheel_lists',JSON.stringify(raw));
    }catch(e){console.warn('mM18 persist list widgets failed',e);}
  }

  document.addEventListener('click',function(e){
    try{
      var btn=e.target && e.target.closest && e.target.closest('button,[role="button"]');
      if(!btn) return;
      if(/Hent\s+liste|Lister/i.test(String(btn.textContent||btn.title||btn.getAttribute('aria-label')||''))){
        persistWidgetLists();
      }
    }catch(err){}
  },true);

  var oldSave=window.save;
  if(typeof oldSave==='function' && !oldSave.__mm18Wrapped){
    var wrapped=function(){
      persistWidgetLists();
      return oldSave.apply(this,arguments);
    };
    wrapped.__mm18Wrapped=true;
    window.save=wrapped;
    try{save=wrapped;}catch(e){}
  }

  setTimeout(persistWidgetLists,0);
  setInterval(persistWidgetLists,2500);
  window.mm18PersistListWidgets=persistWidgetLists;
})();

<script id="maans-trash-board-phase2-safe16-overview-keys">
(function(){
  'use strict';
  function isTyping(e){
    var t=e&&e.target,a=document.activeElement;
    function m(x){return !!(x&&(x.matches&&x.matches('input,textarea,select,[contenteditable="true"]')||x.isContentEditable||x.closest&&x.closest('input,textarea,select,[contenteditable="true"]')));}

  }
  function trashActive(){try{return !!(window.__trashBoardIsActive&&window.__trashBoardIsActive())||document.body.classList.contains('trashBoardActive');}catch(_e){return false;}}
  function selectedEl(){return document.querySelector('.widget.selected[data-id]')||document.querySelector('.widget[data-id]');}
  function selectedId(){var el=document.querySelector('.widget.selected[data-id]'); if(el)return el.dataset.id; try{return window.__trashBoardSelectedId&&window.__trashBoardSelectedId();}catch(_e){} return null;}
  function selectId(id){try{ if(typeof window.select==='function') window.select(id,{editText:false}); else {document.querySelectorAll('.widget').forEach(function(x){x.classList.toggle('selected',x.dataset.id===String(id));});} }catch(_e){}}

    return false;
  }
  function navTrash(dir){
    var items=[].slice.call(document.querySelectorAll('.app.trashBoardActive .widget[data-id], body.trashBoardActive .widget[data-id]'));
    if(!items.length)return false;
    var cur=document.querySelector('.widget.selected[data-id]')||items[0];
    if(!document.querySelector('.widget.selected[data-id]')){selectId(cur.dataset.id);return true;}
    var cr=cur.getBoundingClientRect(), cx=cr.left+cr.width/2, cy=cr.top+cr.height/2;
    var best=null,bestScore=Infinity;
    items.forEach(function(el){
      if(el===cur)return;
      var r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, dx=x-cx, dy=y-cy;
      var ok=false, score=Infinity;
      if(dir==='right'&&dx>8){ok=true;score=dx*3+Math.abs(dy);}
      if(dir==='left'&&dx<-8){ok=true;score=(-dx)*3+Math.abs(dy);}
      if(dir==='down'&&dy>8){ok=true;score=dy*3+Math.abs(dx);}
      if(dir==='up'&&dy<-8){ok=true;score=(-dy)*3+Math.abs(dx);}
      if(ok&&score<bestScore){bestScore=score;best=el;}
    });
    if(best){selectId(best.dataset.id);return true;}
    return false;
  }
  document.addEventListener('click',function(e){
    if(!trashActive())return;
    var x=e.target&&e.target.closest&&e.target.closest('.trashPermanentX,[data-act="del"]');

    }
  },true);
  document.addEventListener('keydown',function(e){
    if(isTyping(e))return;
    var key=String(e.key||''), lower=key.toLowerCase();
    var plain=!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey;
    if(trashActive()){

        var id=selectedId();
        if(id&&window.__trashBoardPermanentById){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();window.__trashBoardPermanentById(id);return false;}
      }
      if(plain&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(key)){
        e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        navTrash(key.replace('Arrow','').toLowerCase()); return false;
      }
      return;
    }
    if((key==='Delete'||key==='Backspace')&&e.shiftKey&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
      var sid=selectedId();
      if(sid&&window.__tavlePermanentDeleteWidget){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();window.__tavlePermanentDeleteWidget(sid);return false;}
    }
    if(plain&&(e.code==='Space'||key===' ')){
      if(!document.querySelector('.widget.selected[data-id]')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();openMore();return false;}
    }
  },true);
})();

<script id="maans-trash-board-safe19-hide-from-normal-boards">
(function(){
  'use strict';
  /* SAFE19: Papirkurven bevares som intern tavle, men skjules fra normal tavle-navigation.
     Bygget oven på den virkende SAFE17/Safe16-papirkurvlogik. Ændrer ikke slette/gendanne-flowet. */
  function isTrash(s){
    try{return !!(s && (s.isTrashBoard===true || s.title==='🗑 Papirkurv' || s.title==='Papirkurv'));}
    catch(_e){return false;}
  }
  function slides(){try{return (state && Array.isArray(state.slides)) ? state.slides : [];}catch(_e){return [];}}
  function normalIndices(){
    const arr=slides();
    const out=[];
    for(let i=0;i<arr.length;i++){ if(!isTrash(arr[i])) out.push(i); }
    return out;
  }
  function normalCount(){return Math.max(1,normalIndices().length);}
  function visibleNo(realIndex){
    const list=normalIndices();
    const p=list.indexOf(realIndex);
    return p>=0 ? p+1 : normalCount();
  }
  function firstNormal(){const list=normalIndices(); return list.length ? list[0] : 0;}
  function insertNormalSlide(){
    const arr=slides();
    if(!arr.length)return -1;
    const ns=(typeof createThemedSlide==='function') ? createThemedSlide() : {title:'Ny tavle',widgets:[]};
    const trashIndex=arr.findIndex(isTrash);
    let idx;
    if(trashIndex>=0){arr.splice(trashIndex,0,ns); idx=trashIndex;}
    else {arr.push(ns); idx=arr.length-1;}
    return idx;
  }
  function updateSlideCounter(){
    try{
      const el=document.getElementById('slideInfo');
      if(!el)return;
      if(isTrash(slide())){ el.textContent='Papirkurv'; return; }
      el.textContent=visibleNo(state.active)+'/'+normalCount();
    }catch(_e){}
  }
  function patchMultiButton(){
    try{
      const btn=document.getElementById('slidesOverview');
      if(!btn)return;
      const hide=normalCount()<=1;
      btn.classList.toggle('onlyMultiHidden',hide);
      btn.hidden=hide;
      btn.style.display=hide?'none':'';
    }catch(_e){}
  }
  function patchTopUI(){updateSlideCounter();patchMultiButton();}
  function goNormalByPosition(pos){
    const list=normalIndices();
    if(!list.length)return false;
    const safe=Math.max(0,Math.min(list.length-1,pos));
    state.active=list[safe];
    try{selected=null;if(window.UIState)UIState.selectedWidgetId=null;}catch(_e){}
    render();
    patchTopUI();
    try{toast('Tavle '+visibleNo(state.active));}catch(_e){}
    try{save({silent:true});}catch(_e){}
    return true;
  }
  const oldNext=(typeof nextSlide==='function')?nextSlide:null;
  const oldPrev=(typeof prevSlide==='function')?prevSlide:null;
  try{
    nextSlide=function(){
      const list=normalIndices();
      const pos=list.indexOf(state.active);
      if(pos>=0 && pos<list.length-1)return goNormalByPosition(pos+1);
      return false;
    };
    prevSlide=function(){
      const list=normalIndices();
      const pos=list.indexOf(state.active);
      if(pos>0)return goNormalByPosition(pos-1);
      return false;
    };
    goToSlide=function(i){ return goNormalByPosition(Number(i)||0); };
  }catch(_e){void oldNext;void oldPrev;}
  function deleteNormalSlideAt(realIndex){
    const arr=slides();
    if(!arr[realIndex] || isTrash(arr[realIndex])){try{toast('Papirkurven kan ikke slettes herfra');}catch(_e){};return;}
    const list=normalIndices();
    if(list.length<=1){try{toast('Der skal være mindst én tavle');}catch(_e){};return;}
    const name=(typeof safeSlideTitle==='function')?safeSlideTitle(arr[realIndex],realIndex):(arr[realIndex].title||'Tavle');
    if(!confirm('Slet tavlen "'+name+'"?'))return;
    const activeBefore=state.active;
    arr.splice(realIndex,1);
    if(activeBefore===realIndex){state.active=firstNormal();}
    else if(activeBefore>realIndex){state.active=activeBefore-1;}
    if(isTrash(arr[state.active]))state.active=firstNormal();
    render();patchTopUI();save();try{toast('Tavle slettet');}catch(_e){}
  }
  try{ deleteSlideAt=deleteNormalSlideAt; }catch(_e){}
  function swapRealSlides(a,b){
    const arr=slides();
    if(a<0||b<0||a>=arr.length||b>=arr.length||isTrash(arr[a])||isTrash(arr[b]))return false;
    const tmp=arr[a]; arr[a]=arr[b]; arr[b]=tmp;
    if(state.active===a)state.active=b; else if(state.active===b)state.active=a;
    render();patchTopUI();save({silent:true});
    return true;
  }
  try{
    slideOverviewModal=function(){
      const list=normalIndices();
      const rows=list.map((realIndex,visibleIndex)=>{
        const s=slides()[realIndex];
        const current=realIndex===state.active;
        const title=(typeof esc==='function'?esc(safeSlideTitle(s,realIndex)):String(s.title||('Tavle '+(visibleIndex+1))));
        return `<div class="slideOverviewRow ${current?'active':''}">
          <div class="num">${visibleIndex+1}</div>
          <input data-title-real="${realIndex}" value="${title}" aria-label="Tavletitel ${visibleIndex+1}">
          <div class="slideOverviewActions">
            <button data-go-visible="${visibleIndex}">Gå til</button>
            <button data-up-visible="${visibleIndex}" ${visibleIndex===0?'disabled':''}>↑</button>
            <button data-down-visible="${visibleIndex}" ${visibleIndex===list.length-1?'disabled':''}>↓</button>
            <button class="danger" data-del-real="${realIndex}" ${list.length<=1?'disabled':''}>🗑 Slet</button>
          </div>
        </div>`;
      }).join('');
      showModal(`<h2>Tavleoversigt</h2>
        <p>Her kan du omdøbe, flytte, gå til eller slette almindelige tavler. Papirkurven ligger i baggrunden og vises ikke her.</p>
        <div class="slideOverview">${rows}</div>
        <button id="newSlideFromOverview">+ ny tavle</button>
        <button id="close">Luk</button>`);
      modal.querySelectorAll('[data-title-real]').forEach(inp=>{
        inp.onchange=()=>{const i=+inp.dataset.titleReal; if(isTrash(slides()[i]))return; slides()[i].title=inp.value.trim()||('Tavle '+visibleNo(i)); render(); patchTopUI(); slideOverviewModal(); save({silent:true});};
        inp.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();inp.blur();}};
      });
      modal.querySelectorAll('[data-go-visible]').forEach(b=>b.onclick=()=>{goNormalByPosition(+b.dataset.goVisible);closeModal();});
      modal.querySelectorAll('[data-up-visible]').forEach(b=>b.onclick=()=>{const v=+b.dataset.upVisible; const fresh=normalIndices(); if(v>0){swapRealSlides(fresh[v],fresh[v-1]); slideOverviewModal();}});
      modal.querySelectorAll('[data-down-visible]').forEach(b=>b.onclick=()=>{const v=+b.dataset.downVisible; const fresh=normalIndices(); if(v<fresh.length-1){swapRealSlides(fresh[v],fresh[v+1]); slideOverviewModal();}});
      modal.querySelectorAll('[data-del-real]').forEach(b=>b.onclick=()=>{deleteNormalSlideAt(+b.dataset.delReal); slideOverviewModal();});
      const ns=modal.querySelector('#newSlideFromOverview'); if(ns)ns.onclick=()=>{state.active=insertNormalSlide(); render(); patchTopUI(); slideOverviewModal(); save({silent:true});};
      const close=modal.querySelector('#close'); if(close)close.onclick=()=>closeModal();
    };
  }catch(_e){}
  function patchButtons(){
    try{const b=document.getElementById('slidesOverview'); if(b)b.onclick=slideOverviewModal;}catch(_e){}
    try{const b=document.getElementById('addSlide'); if(b)b.onclick=()=>{state.active=insertNormalSlide();render();patchTopUI();save();try{focusSlideTitleForRename();}catch(_e){}};}catch(_e){}
  }
  try{
    const oldMove=(typeof moveWidgetToSlide==='function')?moveWidgetToSlide:null;
    const oldCopy=(typeof copyWidgetToSlide==='function')?copyWidgetToSlide:null;
    if(oldMove){moveWidgetToSlide=function(widgetId,targetIndex,sourceIndex=state.active){
      const list=normalIndices(); const real=list[targetIndex]!==undefined?list[targetIndex]:targetIndex;
      if(isTrash(slides()[real])){try{toast('Papirkurven er ikke en almindelig tavle');}catch(_e){};return false;}
      return oldMove(widgetId,real,sourceIndex);
    };}
    if(oldCopy){copyWidgetToSlide=function(widgetId,targetIndex,sourceIndex=state.active){
      const list=normalIndices(); const real=list[targetIndex]!==undefined?list[targetIndex]:targetIndex;
      if(isTrash(slides()[real])){try{toast('Papirkurven er ikke en almindelig tavle');}catch(_e){};return false;}
      return oldCopy(widgetId,real,sourceIndex);
    };}
    newSlideForWidget=function(widgetId,action='move',sourceIndex=state.active){
      const idx=insertNormalSlide();
      return action==='copy' ? copyWidgetToSlide(widgetId,idx,sourceIndex) : moveWidgetToSlide(widgetId,idx,sourceIndex);
    };
  }catch(_e){}
  try{
    widgetMoveModal=function(w){
      const sourceIndex=state.active;
      const sourceTitle=(typeof safeSlideTitle==='function')?safeSlideTitle(slides()[sourceIndex],sourceIndex):'Aktuel tavle';
      const widgetTitle=(typeof esc==='function'?esc(w.title||titles[w.type]||'Widget'):(w.title||'Widget'));
      let rows=normalIndices().map((realIndex,visibleIndex)=>{
        const s=slides()[realIndex];
        const isCurrent=realIndex===sourceIndex;
        const title=(typeof esc==='function'?esc(safeSlideTitle(s,realIndex)):(s.title||('Tavle '+(visibleIndex+1))));
        return `<div class="slideMoveRow">
          <b>${visibleIndex+1}. ${title}${isCurrent?' (nu)':''}</b>
          <div class="actions">
            <button data-action="move" data-target-visible="${visibleIndex}" ${isCurrent?'disabled title="Widgetten er allerede på denne tavle"':''}>Flyt</button>
            <button data-action="copy" data-target-visible="${visibleIndex}">Kopiér</button>
          </div>
        </div>`;
      }).join('');
      showModal(`<div class="moveWidgetDialog"><h2>Flyt eller kopiér widget</h2>
        <p class="moveWidgetTitle"><b>${widgetTitle}</b></p>
        <p>Fra: ${typeof esc==='function'?esc(sourceTitle):sourceTitle}</p>
        <div class="slideList">${rows}</div>
        <button id="newSlideMove">Ny tavle + flyt</button>
        <button id="newSlideCopy">Ny tavle + kopiér</button>
        <button id="close">Luk</button></div>`);
      modal.querySelectorAll('[data-target-visible]').forEach(btn=>btn.onclick=()=>{
        const real=normalIndices()[+btn.dataset.targetVisible];
        if(btn.dataset.action==='copy') copyWidgetToSlide(w.id,real,sourceIndex); else moveWidgetToSlide(w.id,real,sourceIndex);
        closeModal();
      });
      modal.querySelector('#newSlideMove').onclick=()=>{newSlideForWidget(w.id,'move',sourceIndex);closeModal();};
      modal.querySelector('#newSlideCopy').onclick=()=>{newSlideForWidget(w.id,'copy',sourceIndex);closeModal();};
      modal.querySelector('#close').onclick=closeModal;
    };
  }catch(_e){}
  // Når papirkurven er aktiv, må normal forrige/næste ikke bruge den som almindelig tavle.
  document.addEventListener('click',function(e){
    const id=e.target&&e.target.id;
    if(id==='next' || id==='prev'){
      // Lad de redefinerede funktioner håndtere det; sikrer at gammel onclick ikke rammer papirkurven.
      e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      if(id==='next')nextSlide(); else prevSlide();
      return false;
    }
  },true);
  patchButtons();
  patchTopUI();
  setTimeout(()=>{patchButtons();patchTopUI();},0);
  setTimeout(()=>{patchButtons();patchTopUI();},300);
  setInterval(patchTopUI,600);
  try{
    const target=document.getElementById('slideInfo')||document.body;
    new MutationObserver(()=>patchTopUI()).observe(target,{childList:true,characterData:true,subtree:true});
  }catch(_e){}
})();
</script>

<script id="safe52-mode-indicator">
(function(){
  /* SAFE52: Brugerrettet statusmærke.
     Læser kun eksisterende body/app-klasser og synlige elementer.
     Ingen ændring af render-flow, widget-state, genveje eller funktionalitet. */
  function modeInfo(){
    var app=document.getElementById('app');
    var body=document.body;
    if(!app||!body) return {text:'Redigering',cls:''};
    if(app.classList.contains('trashBoardActive')||body.classList.contains('trashBoardActive')) return {text:'Papirkurv',cls:'is-trash'};
    if(body.classList.contains('focus-maximized')) return {text:'Maksimeret',cls:'is-max'};
    if(body.classList.contains('focus-mode')||body.classList.contains('focus-edit')||body.classList.contains('focus-presentation')) return {text:'Fokus',cls:'is-focus'};
    if(app.classList.contains('drawActive')) return {text:'Tegner',cls:'is-draw'};
    if(app.classList.contains('present')) return {text:'Præsentation',cls:'is-present'};
    return {text:'Redigering',cls:''};
  }
  function updateModeBadge(){
    var badge=document.getElementById('modeBadge');
    if(!badge) return;
    var info=modeInfo();
    badge.textContent=info.text;
    badge.title='Tilstand: '+info.text;
    badge.setAttribute('aria-label','Tilstand: '+info.text);
    badge.className='modeBadge'+(info.cls?' '+info.cls:'');
    /* SAFE60: Sæt én fælles farve direkte på #app.
       Dette er mere stabilt end SAFE59's rene :has()-CSS for statusprikken.
       Funktionen må kun påvirke CSS-variabler, ikke app-state eller widgetdata. */
    try{
      var appElForMode=document.getElementById('app');
      if(appElForMode){
        var color='#ef4444', glow='rgba(239,68,68,.28)'; // Redigering
        if(info.cls==='is-present'){ color='#86efac'; glow='rgba(134,239,172,.30)'; }
        else if(info.cls==='is-focus'||info.cls==='is-max'){ color='#a78bfa'; glow='rgba(167,139,250,.32)'; }
        else if(info.cls==='is-trash'){ color='#fca5a5'; glow='rgba(252,165,165,.26)'; }
        else if(info.cls==='is-draw'){ color='#facc15'; glow='rgba(250,204,21,.28)'; }
        appElForMode.style.setProperty('--safe60-mode-color',color);
        appElForMode.style.setProperty('--safe60-mode-glow',glow);
        /* SAFE61: Den synlige prik er nu #title::before og læser samme CSS-variabel.
           Den gamle #modeBadge beholdes kun som usynligt status-/aria-element. */
      }
    }catch(_safe60e){}

    var titleEl=document.getElementById('title');
    if(titleEl){
      titleEl.title='Tilstand: '+info.text;
      titleEl.setAttribute('aria-label','Tavletitel – tilstand: '+info.text);
      titleEl.classList.remove('mode-edit','mode-present','mode-focus','mode-max','mode-trash','mode-draw');
      if(info.cls==='is-present') titleEl.classList.add('mode-present');
      else if(info.cls==='is-focus') titleEl.classList.add('mode-focus');
      else if(info.cls==='is-max') titleEl.classList.add('mode-max');
      else if(info.cls==='is-trash') titleEl.classList.add('mode-trash');
      else if(info.cls==='is-draw') titleEl.classList.add('mode-draw');
      else titleEl.classList.add('mode-edit');
    }
  }
  window.updateModeBadge=updateModeBadge;
  function init(){
    updateModeBadge();
    try{
      var app=document.getElementById('app');
      var obs=new MutationObserver(updateModeBadge);
      obs.observe(document.body,{attributes:true,attributeFilter:['class']});
      if(app) obs.observe(app,{attributes:true,attributeFilter:['class']});
    }catch(_e){}
    document.addEventListener('keydown',function(){setTimeout(updateModeBadge,0);setTimeout(updateModeBadge,80);},true);
    document.addEventListener('click',function(){setTimeout(updateModeBadge,0);setTimeout(updateModeBadge,80);},true);
    setTimeout(updateModeBadge,250);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
