function extFromDataUrl(dataUrl,fallback='bin'){
  const m=String(dataUrl||'').match(/^data:([^;,]+)/);
  const type=m?m[1]:'';
  if(type.includes('pdf'))return 'pdf';
  if(type.includes('png'))return 'png';
  if(type.includes('jpeg')||type.includes('jpg'))return 'jpg';
  if(type.includes('webp'))return 'webp';
  if(type.includes('gif'))return 'gif';
  if(type.includes('svg'))return 'svg';
  return fallback;
}
function safeFileName(name,ext){
  name=String(name||'fil').replace(/[\\/:*?"<>|]+/g,'-').trim()||'fil';
  if(ext && !name.toLowerCase().endsWith('.'+ext))name+='.'+ext;
  return name;
}
function downloadDataUrl(dataUrl,filename){
  if(!dataUrl||!String(dataUrl).startsWith('data:')){toast('Mediet er ikke indlejret og kan ikke downloades herfra');return}
  const a=document.createElement('a');
  const ext=extFromDataUrl(dataUrl);
  a.href=dataUrl;
  a.download=safeFileName(filename||'medie',ext);
  document.body.appendChild(a);
  a.click();
  a.remove();
}


function pdfViewerSrc(src){
  if(!src)return '';
  const clean=String(src);
  const sep=clean.includes('#')?'&':'#';
  return clean + sep + 'toolbar=0&navpanes=0&scrollbar=0&view=FitH&zoom=page-fit';
}

function pickLocalPdf(cb){
  const input=document.createElement('input');
  input.type='file';
  input.accept='application/pdf,.pdf';
  input.onchange=()=>{
    const f=input.files&&input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(String(r.result||''),f);
    r.onerror=()=>toast('Kunne ikke læse PDF-filen');
    r.readAsDataURL(f);
  };
  input.click();
}
function isEmbeddedPdf(src){
  return typeof src==='string' && src.startsWith('data:application/pdf');
}



function wordCloudTextToNames(txt){
  // Accepter både linjer og kompakt liste adskilt med komma/semikolon.
  return String(txt||'')
    .split(/\n|,|;/)
    .map(x=>x.trim())
    .filter(Boolean);
}
function namesToCompactWordCloudText(names){
  // Emoji-lister bliver meget mere læsbare vandret.
  const arr=(names||[]).map(x=>String(x||'').trim()).filter(Boolean);
  const mostlyShort=arr.length && arr.every(x=>[...x].length<=3);
  return mostlyShort ? arr.join(' ') : arr.join('\n');
}
function wordCloudTextToNamesSmart(txt){
  const s=String(txt||'').trim();
  if(!s)return [];
  // Hvis der er linjer/komma/semikolon, brug dem som separator.
  if(/[\n,;]/.test(s))return wordCloudTextToNames(s);
  // Hvis det ligner emojis/korte tokens fra afstemning, split på mellemrum.
  const parts=s.split(/\s+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1 && parts.every(x=>[...x].length<=3))return parts;
  return [s];
}

function toolbarSettings(){
  try{return Object.assign({autoHide:false,delay:4,pinned:false},JSON.parse(localStorage.getItem('maans_tavle_toolbar_settings_v110')||'{}'))}
  catch(e){return {autoHide:false,delay:4,pinned:false}}
}
function saveToolbarSettings(s){
  localStorage.setItem('maans_tavle_toolbar_settings_v110',JSON.stringify(Object.assign(toolbarSettings(),s)));
  applyToolbarSettings();
}
let toolbarHideTimer=null;

function applyToolbarSettings(){
  const s=toolbarSettings();
  const pin=document.querySelector('[data-tool="pin"]');
  if(pin){
    pin.classList.toggle('pinned',!!s.pinned);
    pin.classList.toggle('autoHideOn',!!s.autoHide && !s.pinned);
  }
  if(!s.autoHide || s.pinned){
    showToolbar();
  }else{
    scheduleToolbarHide();
  }
}
function hideToolbar(){
  const s=toolbarSettings();
  if(!s.autoHide || s.pinned)return;
  document.body.classList.add('toolbar-is-hidden');
}
function showToolbar(){
  document.body.classList.remove('toolbar-is-hidden');
}
function scheduleToolbarHide(){
  clearTimeout(toolbarHideTimer);
  const s=toolbarSettings();
  if(!s.autoHide || s.pinned){showToolbar();return}
  toolbarHideTimer=setTimeout(hideToolbar, Math.max(1,Number(s.delay)||4)*1000);
}
function wakeToolbar(e){
  const target=e&&e.target;
  if(target && target.closest && target.closest('.modal'))return;
  const s=toolbarSettings();
  if(!s.autoHide || s.pinned)return;
  showToolbar();
  scheduleToolbarHide();
}
function setToolbarHidden(on){
  if(on)hideToolbar(); else showToolbar();
}

  if(t==='focus'){toggleFocusMode();return}
  if(t==='text')addWidget('text',{text:'Skriv her...'});

  if(t==='groups')addWidget('groups',{});
  if(t==='wordcloud')addWidget('wordcloud',{});
  if(t==='poll')addWidget('poll',{});
  if(t==='timer')addWidget('timer',{});
  if(t==='image')addWidget('image',{});
  if(t==='link')addWidget('link',{text:'Link',url:'https://'});
  if(t==='pdf')addWidget('pdf',{});
  if(t==='background'||t==='bg')bgModal();
  if(t==='grid'){slide().grid=!slide().grid;render();updateGridOverlay();save()}

let focusMode=false;
let focusPointer={x:0,y:0,moved:false,t:0};

function clearFocusTarget(){
  document.querySelectorAll('.widget.focusTarget').forEach(el=>el.classList.remove('focusTarget'));
}
function setFocusTarget(el){
  if(!el)return;
  clearFocusTarget();
  el.classList.add('focusTarget');
}
function setFocusMode(on){
  focusMode=!!on;
  document.body.classList.toggle('focus-mode',focusMode);
  const btn=document.getElementById('focusExit');
  if(btn)btn.classList.toggle('hidden',!focusMode);
  if(!focusMode)clearFocusTarget();
  try{if(focusMode){setToolbarHidden(true)}else{setToolbarHidden(false)}}catch(e){}
}
function toggleFocusMode(){setFocusMode(!focusMode)}

document.addEventListener('pointerdown',e=>{
  if(!focusMode)return;
  focusPointer={x:e.clientX,y:e.clientY,moved:false,t:Date.now()};
},{passive:true});

document.addEventListener('pointermove',e=>{
  if(!focusMode)return;
  const dx=Math.abs(e.clientX-focusPointer.x), dy=Math.abs(e.clientY-focusPointer.y);
  if(dx>8||dy>8)focusPointer.moved=true;
},{passive:true});

document.addEventListener('pointerup',e=>{
  if(!focusMode)return;
  if(Date.now()-focusPointer.t>450 || focusPointer.moved)return;
  const w=e.target.closest&&e.target.closest('.widget');
  if(w)setFocusTarget(w); else clearFocusTarget();
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && focusMode)setFocusMode(false);
});

function buildWordCloudItems(names,caseInsensitive=true){
  const counts=new Map();
  (names||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(line=>{
    const key=caseInsensitive?line.toLocaleLowerCase('da'):line;
    if(!counts.has(key))counts.set(key,{label:line,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[line]=(item.variants[line]||0)+1;
    // Vis den mest brugte variant af store/små bogstaver.
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });
  const items=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=items[0]?.count||1;
  return items.map(it=>{
    const scale=it.count/max;
    return {...it,size:14+scale*38,weight:400+Math.round(scale*500),opacity:.62+scale*.38};
  });
}
function renderWordCloud(w){
  const items=buildWordCloudItems(w.data.names||[],w.data.caseInsensitive!==false);
  if(!items.length)return '<div style="display:grid;place-items:center;height:100%;opacity:.65;font-weight:800">Hent eller skriv en liste</div>';
  return items.map(it=>`<span data-count="${esc(it.count)}" data-label="${esc(it.label)}" title="${esc(it.count+' gange')}" style="font-size:${it.size}px;font-weight:${it.weight};opacity:${it.opacity}">${esc(it.label)}</span>`).join('');
}

function pollCloudItems(w){

  const votes=w.data.votes||opts.map(()=>0);
  const max=Math.max(1,...votes.map(v=>Number(v)||0));
  return opts.map((o,i)=>{
    const n=Number(votes[i]||0);
    const scale=n/max;
    return {label:o,count:n,size:22+scale*64,opacity:.55+scale*.45};
  }).filter(x=>x.count>0);
}

function wheelCloudItems(w){
  const counts=new Map();
  (w.data.chosen||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(x=>{
    const key=x.toLocaleLowerCase('da');
    if(!counts.has(key))counts.set(key,{label:x,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[x]=(item.variants[x]||0)+1;
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });

  const arr=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=arr[0]?.count||1;

  // Stable hand-tuned positions: largest around centre, others distributed around it.
  const slots=[
    [50,42,0],[34,35,-5],[66,36,4],[43,61,2],[60,62,-4],
    [25,52,5],[76,51,-5],[31,72,-3],[70,73,3],[22,28,-6],
    [79,27,6],[50,78,0],[18,65,4],[84,66,-4],[38,22,3],
    [63,22,-3],[28,83,2],[73,84,-2],[16,42,-4],[88,43,4],
    [47,27,-2],[56,55,5],[39,50,-5],[64,50,2]
  ];

  return arr.map((it,i)=>{
    const scale=it.count/max;
    const s=slots[i%slots.length];
    const ring=Math.floor(i/slots.length);
    const seed=(it.label.length*17+it.count*31+i*13);
    const jitterX=((seed%9)-4) + ring*1.7;
    const jitterY=(((seed*3)%9)-4) + ring*1.4;
    return {
      ...it,
      size:22+scale*64,
      opacity:.62+scale*.38,
      x:Math.max(12,Math.min(88,s[0]+jitterX)),
      y:Math.max(14,Math.min(86,s[1]+jitterY)),
      rot:s[2]
    };
  });
}

function wheelWinnerAtPointer(names,rot){
  if(!names || !names.length)return '';
  const two=Math.PI*2, step=two/names.length;
  const a=((0-rot)%two+two)%two; // fixed pointer is at 0 radians/right side
  const idx=Math.floor(a/step)%names.length;
  return names[idx];
}

function easeOutCubic(x){return 1-Math.pow(1-x,3)}
function targetRotationForIndex(index,count,extraTurns=6){
  const step=Math.PI*2/count;
  // Pointer is fixed at 0 radians (right side). We want the CENTER of the chosen slice at the pointer.
  return extraTurns*Math.PI*2 - (index+.5)*step;
}

function wheelIndexFromCanvasEvent(canvas,e,w){
  const names=w.data.names||[];
  if(!names.length)return -1;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*canvas.width;
  const y=(e.clientY-rect.top)/rect.height*canvas.height;
  const cx=canvas.width/2, cy=canvas.height/2;
  const dx=x-cx, dy=y-cy;
  const dist=Math.hypot(dx,dy);
  const r=Math.min(canvas.width,canvas.height)*0.47;
  if(dist>r || dist<r*.14)return -1; // ignore outside wheel and center button area
  const two=Math.PI*2, step=two/names.length, rot=w.data.rot||0;
  const a=((Math.atan2(dy,dx)-rot)%two+two)%two;
  return Math.floor(a/step)%names.length;
}

  }

  wheelLand();
  fillContent(c.closest('.widget'),w);
  save();
}

function tavleDownloadTextFile(filename,text,mime='text/plain'){
  const blob=new Blob([text],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function tavlePickTextFile(accept,cb){
  const input=document.createElement('input');
  input.type='file';
  input.accept=accept||'.json,application/json';
  input.onchange=()=>{
    const f=input.files&&input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(String(r.result||''),f);
    r.onerror=()=>toast('Kunne ikke læse filen');
    r.readAsText(f,'utf-8');
  };
  input.click();
}
function tavleHarvestLists(st){
  const bank=wheelListBank();
  try{
    (st.slides||[]).forEach(sl=>(sl.widgets||[]).forEach(w=>{
      if((w.type==='wheel'||w.type==='groups')&&w.data&&Array.isArray(w.data.names)&&w.data.names.length){
        const base=w.type==='groups'?'Liste fra grupper':'Liste fra hjul';
        const name=(w.title||base).trim();
        if(!bank[name])bank[name]=w.data.names.filter(Boolean);
      }
    }));
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
  }catch(e){}
}
function tavleRestoreLists(data){
  try{
    const bank=wheelListBank();
    if(data&&data.wheelLists&&typeof data.wheelLists==='object')Object.assign(bank,data.wheelLists);
    if(data&&data.lists&&typeof data.lists==='object')Object.assign(bank,data.lists);
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
    if(!(data&&data.options&&data.options.templateOnly) && !(data&&data.state&&data.state.isTemplateOnly)){
      tavleHarvestLists(data.state||data);
    }
  }catch(e){}
}

function importJson(){
  tavlePickTextFile('.json,application/json',(txt,file)=>{
    try{
      const data=JSON.parse(txt);
      const next=data.state||data;
      if(!next||!Array.isArray(next.slides)){toast('JSON-filen indeholder ikke tavledata');return}
      if(!confirm('Importér JSON-backup? Dette erstatter de tavler, der er åbne nu.'))return;
      tavleRestoreLists(data);
      state=next;
      if(typeof state.active!=='number')state.active=0;
      save({silent:true});
      closeModal();
      render();
      toast('JSON importeret');
    }catch(e){toast('Kunne ikke importere JSON')}
  });
}



function collectEmbeddedMedia(){

    return 'Medie';
  };
  try{
    (state.slides||[]).forEach((sl,si)=>{
      const slideName=safeSlideTitle?safeSlideTitle(sl,si):('Tavle '+(si+1));
      if(sl.bgImage&&String(sl.bgImage).startsWith('data:')){
        items.push({type:'Baggrundsbillede',slide:slideName,name:`tavle-${si+1}-baggrund`,src:sl.bgImage});
      }
      (sl.widgets||[]).forEach((w,wi)=>{
        if(w.type==='image'&&w.data&&String(w.data.src||'').startsWith('data:')){
          items.push({type:'Billede',slide:slideName,name:w.data.name||`tavle-${si+1}-billede-${wi+1}`,src:w.data.src});
        }
        if(w.type==='pdf'&&w.data&&String(w.data.src||w.data.url||'').startsWith('data:')){
          items.push({type:'PDF',slide:slideName,name:w.data.name||`tavle-${si+1}-pdf-${wi+1}`,src:w.data.src||w.data.url});
        }
      });
    });
  }catch(e){}
  return items.map((it,i)=>{
    const ext=extFromDataUrl(it.src);
    return {...it,ext,filename:safeFileName(it.name,ext),label:it.type||kindLabel(it.src),id:'mediaDl'+i};
  });
}

function cleanHtmlForStandalone(htmlDoc){
  // Fjern modal/overlay/toast og midlertidige UI-tilstande, så den gemte fil ikke åbner låst.
  htmlDoc=htmlDoc.replace(/<div id="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/⏳ Forbereder fil\.\.\./g,'💾 Gem HTML + data');
  htmlDoc=htmlDoc.replace(/Forbereder HTML-fil\.\.\./g,'');
  htmlDoc=htmlDoc.replace(/disabled=""/g,'');
  htmlDoc=htmlDoc.replace(/\sdisabled(=("|')disabled\2)?/g,'');
  htmlDoc=htmlDoc.replace(/\sdata-old-text="[^"]*"/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleData"[\s\S]*?<\/script>/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleBoot"[\s\S]*?<\/script>/g,'');
  return htmlDoc;
}
function makeStandaloneHtml(){
  const cleanState=stripTransientForExport(state);
  const payload=JSON.stringify(cleanState);
  let htmlDoc=document.documentElement.outerHTML;
  htmlDoc=cleanHtmlForStandalone(htmlDoc);

  // Boot-scriptet skal ligge før appens hovedscript, så den gemte fil starter med de rigtige tavler.
  const boot=`<script id="embeddedTavleBoot">(function(){try{localStorage.setItem('maans_interaktiv_tavle_v110_test', ${JSON.stringify(payload)});}catch(e){}})();<\/script>`;

  const firstScript=htmlDoc.indexOf('<script>');
  if(firstScript!==-1)htmlDoc=htmlDoc.slice(0,firstScript)+boot+htmlDoc.slice(firstScript);
  else if(htmlDoc.includes('</head>'))htmlDoc=htmlDoc.replace('</head>',boot+'</head>');
  else htmlDoc=boot+htmlDoc;

  return '<!doctype html>\n'+htmlDoc;
}
function exportStandaloneHtml(){

function wireRobustWidgetClose(){
  if(window.__robustWidgetCloseWired)return;
  window.__robustWidgetCloseWired=true;

  const isCloseButton=(el)=>{
    if(!el)return false;
    const txt=(el.textContent||'').trim();
    return el.matches?.('.close,.x,.del,.delete,.remove,[data-action="close"],[data-act="close"],[aria-label="Luk"],[title="Luk"]')
      || txt==='×' || txt==='✕' || txt==='x' || txt==='X';
  };

  const handler=(e)=>{
    const btn=e.target.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title]');
    if(!btn||!isCloseButton(btn))return;
    const widget=btn.closest?.('.widget');
    if(!widget)return;

    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();

    const id=widget.dataset.id || widget.dataset.widgetId || widget.id;
    try{
      if(typeof removeWidget==='function'){
        removeWidget(id);
        return;
      }
    }catch(err){}

    try{
      const sl=slide();
      if(sl&&Array.isArray(sl.widgets)){
        sl.widgets=sl.widgets.filter(w=>String(w.id)!==String(id));
        save({silent:true});
        render();
        return;
      }
    }catch(err){}

    widget.remove();
    try{save({silent:true})}catch(err){}
  };

  document.addEventListener('pointerdown',handler,true);
  document.addEventListener('mousedown',handler,true);
  document.addEventListener('click',handler,true);
}

function clearWidgetDataForTemplate(w){
  w.data = w.data || {};

  // Bevar widgettype, titel, placering, størrelse, rotation, lås osv.
  // Ryd kun det konkrete eksempelindhold.
  if(w.type==='text'){
    w.data.text='';
    w.data.html='';
  }

  if(w.type==='image'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.alt;
  }

  if(w.type==='pdf'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.page;
  }

  if(w.type==='video'){
    delete w.data.url;
    delete w.data.src;
    delete w.data.embed;
    delete w.data.title;
    delete w.data.thumbnail;
  }

  if(w.type==='link'){
    delete w.data.url;
    w.data.text=w.data.text||'Link';
  }

  if(w.type==='wheel'){
    w.data.names=[];
    w.data.chosen=[];
    w.data.selected=[];
    w.data.result=[];
    w.data.current='';
  }

  if(w.type==='groups'){
    w.data.names=[];
    w.data.groups=[];
    w.data.result=[];
    w.data.grouped=[];
  }

  if(w.type==='wordcloud'){
    w.data.names=[];
    w.data.caseInsensitive = w.data.caseInsensitive!==false;
  }

  if(w.type==='poll'){
    w.data.question=w.data.question||'Hvordan går det?';
    w.data.options=w.data.options||['😀','🙂','😐','🙁','😡'];
    w.data.votes=w.data.options.map(()=>0);
    w.data.cloudView=false;
    w.data.showResults=false;
  }

  if(w.type==='timer'){
    w.data.running=false;
  }
}

function cloneForSaveFile(options={}){
  const copy=JSON.parse(JSON.stringify(state));
  try{
    copy.settings = copy.settings || {};
    copy.isTemplateOnly = !!options.templateOnly;

    if(options.templateOnly){
      // Ryd globale/lokale lister fra skabelonen.
      copy.lists={};
      copy.wheelLists={};
      copy.savedLists={};

      (copy.slides||[]).forEach(sl=>{
        // Ryd baggrundsbilleder, men bevar evt. farve/grundlæggende layout.
        delete sl.bgImage;
        delete sl.backgroundImage;
        delete sl.image;
        if(sl.bg && String(sl.bg).startsWith('data:')) delete sl.bg;

        (sl.widgets||[]).forEach(clearWidgetDataForTemplate);

}

    toolbarDelay=Math.max(1,Math.min(30,Number(modal.querySelector('#tbDelay').value||5)))*1000;
    toolbarPinned=modal.querySelector('#tbPinned').checked;
    localStorage.setItem('maans_toolbar_delay',String(toolbarDelay));
    localStorage.setItem('maans_toolbar_pinned',toolbarPinned?'1':'0');
    app.classList.toggle('toolbarPinned',toolbarPinned);
    updatePinButtons();
    closeModal();
    showToolbarTemp();
  };
  modal.querySelector('#close').onclick=closeModal;
}
pinToolbar.onclick=e=>{
  e.stopPropagation();
  toolbarPinned=false;
  localStorage.setItem('maans_toolbar_pinned','0');
  app.classList.remove('toolbarPinned');
  updatePinButtons();
  clearTimeout(toolbarTimer);
  setToolbarHidden(true);
};
toolbarPinFloat.onclick=e=>{e.preventDefault();e.stopPropagation();toggleToolbarPin();showToolbarTemp();blockToolbarClicks(750)};
toolbarOpts.onclick=e=>{e.stopPropagation();toolbarSettingsModal()};
toolbarPeek.onclick=e=>{e.preventDefault();e.stopPropagation();showToolbarTemp();blockToolbarClicks(750)};
app.addEventListener('pointermove',e=>{if(e.clientY>innerHeight-130)showToolbarTemp()});
app.addEventListener('pointerdown',e=>{if(e.target.closest('.toolbar,.toolbarPeek,.toolbarPinFloat'))showToolbarTemp()});
updatePinButtons();
app.classList.toggle('toolbarPinned',toolbarPinned);
setTimeout(()=>setToolbarHidden(true),toolbarDelay);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && app.classList.contains('toolbarHidden')){
    showToolbarTemp();
  }
});


const __render_original = render;
render = function(){
  __render_original();
  updateSlidesOverviewVisibility();
};
wireRobustWidgetClose();render();updateSlidesOverviewVisibility();maybeShowQuickHelp();wireQuickPinButton();
})();


</script>
</body></html>
