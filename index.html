(function(){

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});

  ready(function(){
    const appEl=document.getElementById('app');
    const modalBackEl=document.getElementById('modalBack');

    function isEditableElement(el){
      return !!(el && (
        (el.matches && el.matches('input,textarea,select,[contenteditable=\"true\"]')) ||
        el.isContentEditable ||
        (el.closest && el.closest('input,textarea,select,[contenteditable=\"true\"]'))

      // Brug både event target og activeElement. På iPad/Chrome kan activeElement være ustabilt
      // ved widgets med egne pointer-/focus-lag, mens event target stadig er korrekt.
      return isEditableElement(ev && ev.target) || isEditableElement(document.activeElement);

      if(!modalBackEl) return false;
      const cs=getComputedStyle(modalBackEl);

      let el=document.getElementById('presentationModeToast');

        const wasPresent=appEl.classList.contains('present');
        appEl.classList.toggle('present');
        UIState.mode = wasPresent ? 'editing' : 'presentation';
        try{ applyUIState(); }catch(_e){}
      }
      if(window.showPresentationModeIndicator) setTimeout(window.showPresentationModeIndicator,20);
    }
    // Keyboard shortcuts are kept in one table so functionality and help text stay in sync.
    const TAVLE_SHORTCUTS = {
      plain: {
        p: {label:'Skift redigering/præsentation', run:()=>togglePresentationFromShortcut()},
        r: {label:'Skift redigering/præsentation', run:()=>togglePresentationFromShortcut()},
        f: {label:'Fokus på valgt widget', run:api=>api.toggleFocusShortcut&&api.toggleFocusShortcut()}

        t: {label:'Timer', widget:'t'},

        s: {label:'Ordsky', widget:'s'},
        v: {label:'Afstemning', widget:'v'},
        m: {label:'Baggrund', widget:'m'},
        g: {label:'Grid', widget:'g'},

    function normalizeShortcutKey(e){

      return (key==='?' || key==='/') ? '?' : key;

function extFromDataUrl(dataUrl,fallback='bin'){
  const m=String(dataUrl||'').match(/^data:([^;,]+)/);
  const type=m?m[1]:'';

  if(type.includes('png'))return 'png';
  if(type.includes('jpeg')||type.includes('jpg'))return 'jpg';
  if(type.includes('webp'))return 'webp';
  if(type.includes('gif'))return 'gif';
  if(type.includes('svg'))return 'svg';
  return fallback;
}

function ensurePdfJs(){

async function renderPdfJsWidget(w,c){

function wordCloudTextToNames(txt){

function wordCloudTextToNamesSmart(txt){
  const s=String(txt||'').trim();
  if(!s)return [];

function buildWordCloudItems(names,caseInsensitive=true){
  const counts=new Map();
  (names||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(line=>{
    const key=caseInsensitive?line.toLocaleLowerCase('da'):line;
    if(!counts.has(key))counts.set(key,{label:line,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[line]=(item.variants[line]||0)+1;
    // Vis den mest brugte variant af store/små bogstaver.
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });
  const items=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=items[0]?.count||1;
  return items.map(it=>{
    const scale=it.count/max;
    return {...it,size:14+scale*38,weight:400+Math.round(scale*500),opacity:.62+scale*.38};
  });
}
function renderWordCloud(w){
  const items=buildWordCloudItems(w.data.names||[],w.data.caseInsensitive!==false);
  if(!items.length)return '<div style="display:grid;place-items:center;height:100%;opacity:.65;font-weight:800">Hent eller skriv en liste</div>';
  return items.map(it=>`<span data-count="${esc(it.count)}" data-label="${esc(it.label)}" title="${esc(it.count+' gange')}" style="font-size:${it.size}px;font-weight:${it.weight};opacity:${it.opacity}">${esc(it.label)}</span>`).join('');
}

function pollCloudItems(w){
  const opts=w.data.options||['😀','🙂','😐','🙁','😡'];
  const votes=w.data.votes||opts.map(()=>0);
  const max=Math.max(1,...votes.map(v=>Number(v)||0));
  return opts.map((o,i)=>{
    const n=Number(votes[i]||0);
    const scale=n/max;
    return {label:o,count:n,size:22+scale*64,opacity:.55+scale*.45};
  }).filter(x=>x.count>0);
}

function normalizePollsForPresentation(){
  const inPresent=(document.getElementById('app')||document.body).classList.contains('present')||document.body.classList.contains('present');

  let changed=false;
  (slide().widgets||[]).forEach(w=>{
    if(w.type==='poll' && w.data && w.data.cloudView && !w.data.allowCloudInPresent){
      w.data.cloudView=false;

}

function safeSlideTitle(s,i){return (s.title&&String(s.title).trim()) ? s.title : 'Tavle '+(i+1)}
function ensureVisibleOnSlide(w){
  w.x=Math.max(20,Math.min(w.x,innerWidth-Math.min(w.w,innerWidth*.9)-20));
  w.y=Math.max(70,Math.min(w.y,innerHeight-Math.min(w.h,innerHeight*.82)-120));
}
function cloneWidgetForSlide(widget){
  // Deep clone to avoid shared object references between slides.
  const copy=JSON.parse(JSON.stringify(widget));
  copy.id=uid();
  copy.x=Number(copy.x||0)+30;
  copy.y=Number(copy.y||0)+30;
  copy.z=++z;
  ensureVisibleOnSlide(copy);
  return copy;
}
function findWidgetOnSlide(slideIndex,widgetId){
  const s=state.slides[slideIndex];
  if(!s || !Array.isArray(s.widgets))return {slide:null,index:-1,widget:null};
  const index=s.widgets.findIndex(x=>String(x.id)===String(widgetId));
  return {slide:s,index,widget:index>=0?s.widgets[index]:null};
}
function moveWidgetToSlide(widgetId,targetIndex,sourceIndex=state.active){
  if(targetIndex<0||targetIndex>=state.slides.length)return false;
  const found=findWidgetOnSlide(sourceIndex,widgetId);
  if(!found.widget)return false;
  if(targetIndex===sourceIndex){
    state.active=sourceIndex;
    render();
    select(widgetId);
    toast('Widget er allerede på denne tavle');
    return true;
  }
  const [widget]=found.slide.widgets.splice(found.index,1);
  ensureVisibleOnSlide(widget);
  state.slides[targetIndex].widgets.push(widget);
  state.active=targetIndex;
  render();
  select(widget.id);
  toast('Flyttet til tavle '+(targetIndex+1));
  save();
  return true;
}
function copyWidgetToSlide(widgetId,targetIndex,sourceIndex=state.active){
  if(targetIndex<0||targetIndex>=state.slides.length)return false;
  const found=findWidgetOnSlide(sourceIndex,widgetId);
  if(!found.widget)return false;
  const copy=cloneWidgetForSlide(found.widget);
  state.slides[targetIndex].widgets.push(copy);
  state.active=targetIndex;
  render();
  select(copy.id);
  toast('Kopieret til tavle '+(targetIndex+1));
  save();
  return true;

function wheelIndexFromCanvasEvent(canvas,e,w){
  const names=w.data.names||[];
  if(!names.length)return -1;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*canvas.width;
  const y=(e.clientY-rect.top)/rect.height*canvas.height;
  const cx=canvas.width/2, cy=canvas.height/2;
  const dx=x-cx, dy=y-cy;
  const dist=Math.hypot(dx,dy);
  const r=Math.min(canvas.width,canvas.height)*0.47;
  if(dist>r || dist<r*.14)return -1; // ignore outside wheel and center button area
  const two=Math.PI*2, step=two/names.length, rot=w.data.rot||0;
  const a=((Math.atan2(dy,dx)-rot)%two+two)%two;
  return Math.floor(a/step)%names.length;
}
function moveWheelItemToChosen(c,w,index){
  const names=w.data.names||[];
  if(index<0||index>=names.length)return;
  const item=names[index];
  const msg=w.data.keepPool ? item+' føjes til valgte-listen?' : item+' flyttes til valgte-puljen?';
  if(!confirm(msg))return;
  if(!w.data.keepPool){
    names.splice(index,1);
    w.data.names=names;
  }
  w.data.chosen=w.data.chosen||[];
  w.data.chosen.push(item);
  w.data.winner='';
  animateWinner(c,item);
  wheelLand();
  fillContent(c.closest('.widget'),w);
  save();
}

 const spin=c.querySelector('.spin'); if(spin)spin.onclick=()=>{let btn=c.querySelector('.spin');let names=[...(w.data.names||[])];if(!names.length){toast('Puljen er tom');return}btn.disabled=true;const idx=Math.floor(Math.random()*names.length),winner=names[idx];const duration=2600+Math.random()*700,startTime=performance.now(),endRot=targetRotationForIndex(idx,names.length,6+Math.floor(Math.random()*3));let lastTick=0;function frame(now){const p=Math.min(1,(now-startTime)/duration),rot=endRot*easeOutCubic(p);drawWheel(canv,w,rot);if(now-lastTick>95 && p<.94){wheelTick();lastTick=now}if(p<1){requestAnimationFrame(frame)}else{drawWheel(canv,w,endRot);btn.disabled=false;wheelLand();setTimeout(wheelLand,80);animateWinner(c,winner);w.data.chosen.push(winner);if(!w.data.keepPool){if(confirm(winner+' blev valgt. Fjern fra puljen?')){w.data.names=w.data.names.filter(n=>n!==winner)}}w.data.winner='';w.data.rot=0;fillContent(el,w);save()}}requestAnimationFrame(frame)}
}

function normalizeLinkUrl(url){
  url=String(url||'').trim();
  if(!url)return '';
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  return url;
}
function askLink(w){
  if(!canEditWidgets())return;

  showModal(`<h2>Link</h2>
    <p style="margin-top:0;opacity:.75;font-weight:800">Samme adresse kan vises som almindeligt link eller som indlejret webside/iframe via knappen i widgetens topbjælke.</p>

    </label>
    <label>Adresse

    </label>
    <button id="ok">Gem</button>
    <button id="cancel">Luk</button>`);

  const titleInput=modal.querySelector('#lt');
  const urlInput=modal.querySelector('#lu');

  function saveLink(){
    w.data.text=titleInput.value.trim()||'Klikbart link';
    w.data.url=normalizeLinkUrl(urlInput.value)||'https://';

function bgModal(){
  const fit=slide().bgFit||'cover';
  const hasImg=!!slide().bgImage;
  const currentBg=String(slide().bgImage||'');
  const currentFilter=slide().bgFilter||'none';
  const filterDef=getBgFilterDef(currentFilter);
  const previewCss=bgFilterCss(currentFilter);
  const previewOverlay=bgFilterOverlay(currentFilter);
  const isInfoBg=slide().bgImageSource==='builtin' || slide().bgImageSource==='builtin-url' || slide().bgImage===BUILTIN_INFOGRAFIK_BG || slide().bgImageName==='README_infografik.png';

  const filterButtons=(TAVLE_BG_FILTERS||[]).map(f=>{
    const active=currentFilter===f.key;
    return `<button class="bgFilterChip ${active?'active':''}" data-bg-filter="${esc(f.key)}" title="${esc(f.desc||f.title)}">${esc(f.title)}</button>`;
  }).join('');

  const bgCards=(TAVLE_BACKGROUNDS||[]).map((bg,idx)=>{
    const resolvedSrc=resolveAssetPath(bg.src);
    const active=currentBg===bg.src || currentBg===resolvedSrc || slide().bgImageName===bg.name || slide().bgImageTitle===bg.title;
    return `<button class="bgChoice ${active?'active':''}" data-bg-index="${idx}" title="${esc(bg.title+' — '+bg.desc)}">
      <span class="bgChoicePreview">
        <img src="${esc(resolvedSrc)}" alt="${esc(bg.title)}" loading="lazy" style="filter:${esc(previewCss)}" onerror="this.classList.add('bgImgMissing')">
        <span class="bgChoiceOverlay" style="background:${esc(previewOverlay)}"></span>
      </span>
      <span class="bgChoiceTitle">${esc(bg.title)}</span>
      <span class="bgChoiceDesc">${esc(bg.desc)}</span>
    </button>`;
  }).join('');

  showModal(`<h2>Baggrund</h2>
    <p style="margin-top:0;opacity:.75;font-weight:800">${hasImg?'Baggrundsbillede er valgt. Justér visning, filter eller fjern billedet.':'Vælg en farve, vælg en tavlebaggrund, vælg et lokalt billede eller indsæt en billed-URL.'}</p>
    <button data-bg="linear-gradient(135deg,#edf6ff,#dff8e8)">Lys grøn/blå</button>
    <button data-bg="linear-gradient(135deg,#0f172a,#064e3b)">Mørk</button>
    <button data-bg="linear-gradient(135deg,#fef3c7,#fed7aa)">Varm</button>
    <hr>
    <div class="bgLibraryWrap">
      <div class="bgLibraryHead">
        <div>
          <h3>Tavlebaggrunde</h3>
          <p>Vælg først stemning/filter. Thumbnails viser resultatet med det samme. Aktivt filter: <span class="filterName">${esc(filterDef.title)}</span></p>
        </div>
      </div>
      <div class="bgFilterBar" aria-label="Baggrundsfilter">${filterButtons}</div>
      <div class="bgGrid">${bgCards}</div>
    </div>
    <hr>
    <div class="bgActions">
      <button id="bgInfo">${isInfoBg?'✓ Online-infografik som baggrund':'Brug online-infografik som baggrund'}</button>
      <button id="bgImg">Vælg lokalt baggrundsbillede</button>
      <button id="bgUrl">Indsæt billed-URL</button>
      <select id="fit" title="Hvordan baggrundsbilledet vises på tavlen">
        <option value="cover" ${fit==='cover'?'selected':''}>cover – fyld tavlen</option>
        <option value="contain" ${fit==='contain'?'selected':''}>contain – vis hele billedet</option>
        <option value="auto" ${fit==='auto'?'selected':''}>auto – original størrelse</option>
      </select>
      <button id="clearBg">Fjern billede</button>
      <button id="close">Luk</button>
    </div>`);

  modal.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{
    slide().bg=b.dataset.bg;
    slide().bgImage='';
    slide().bgImageName='';
    slide().bgImageSource='';
    delete slide().bgImageTitle;
    render();
    save();
    bgModal();
  });

  modal.querySelectorAll('[data-bg-filter]').forEach(btn=>btn.onclick=()=>{
    slide().bgFilter=btn.dataset.bgFilter||'none';
    render();
    save();
    bgModal();
  });

  modal.querySelectorAll('[data-bg-index]').forEach(btn=>btn.onclick=()=>{
    const item=(TAVLE_BACKGROUNDS||[])[Number(btn.dataset.bgIndex)];
    if(!item)return;
    slide().bgImage=item.src;
    slide().bgImageName=item.name || item.src.split('/').pop();
    slide().bgImageTitle=item.title;
    slide().bgImageSource='library';
    slide().bgFilter=slide().bgFilter||'none';
    slide().bgFit='cover';
    render();
    save();
    toast(item.title+' valgt som baggrund');
    bgModal();
  });

  modal.querySelector('#bgInfo').onclick=()=>{
    const img=new Image();
    img.onload=()=>{
      slide().bgImage=BUILTIN_INFOGRAFIK_BG;
      slide().bgImageName='README_infografik.png';
      slide().bgImageSource='builtin-url';
      slide().bgFilter=slide().bgFilter||'none';
      slide().bgFit='contain';
      render();
      save();
      toast('Online-infografik valgt som baggrund');
      bgModal();
    };
    img.onerror=()=>{
      toast('Kunne ikke hente online-infografik');
    };
    img.src=BUILTIN_INFOGRAFIK_BG;
  };
  modal.querySelector('#bgImg').onclick=()=>pickFile('image/*',(src,file)=>{
    slide().bgImage=src;
    slide().bgImageName=(file&&file.name)||'baggrundsbillede';
    slide().bgImageSource='local';
    slide().bgFilter=slide().bgFilter||'none';
    delete slide().bgImageTitle;
    if(!slide().bgFit)slide().bgFit='contain';
    render();
    save();
    toast('Baggrundsbillede valgt');
    bgModal();
  });
  modal.querySelector('#bgUrl').onclick=()=>{
    const current=slide().bgImageSource==='url' ? (slide().bgImage||'') : '';
    const url=prompt('Indsæt URL til eksternt billede', current);
    if(url===null)return;
    const trimmed=String(url||'').trim();
    if(!trimmed){toast('Ingen URL indsat');return}
    if(!/^https?:\/\//i.test(trimmed)){
      toast('URL skal starte med http:// eller https://');
      return;
    }
    slide().bgImage=trimmed;
    slide().bgImageName='eksternt baggrundsbillede';
    slide().bgImageSource='url';
    slide().bgFilter=slide().bgFilter||'none';
    delete slide().bgImageTitle;
    if(!slide().bgFit)slide().bgFit='cover';
    render();
    save();
    toast('Eksternt baggrundsbillede valgt');
    bgModal();
  };
  modal.querySelector('#fit').onchange=e=>{slide().bgFit=e.target.value;render();save()};
  modal.querySelector('#clearBg').onclick=()=>{slide().bgImage='';slide().bgImageName='';slide().bgImageSource='';delete slide().bgImageTitle;render();save();bgModal()};
  modal.querySelector('#close').onclick=closeModal;
}

function findPinButton(){
  return document.getElementById('pinBtn') || document.getElementById('pin') || document.querySelector('[data-action="pin"],.pinBtn,.pin');
}
function findBottomToolbar(){
  return document.querySelector('.toolbar,.bottomToolbar,#toolbar,#bottomToolbar');
}
function getToolbarKeepVisible(){
  return localStorage.getItem('maans_tavle_toolbar_keep_visible')==='1';
}
function setToolbarKeepVisible(on){
  localStorage.setItem('maans_tavle_toolbar_keep_visible',on?'1':'0');
  const pin=findPinButton();
  if(pin){
    pin.classList.toggle('pinned',on);
    pin.title=on?'Værktøjslinjen holdes synlig – klik for automatisk skjul':'Hold værktøjslinjen synlig';
    pin.setAttribute('aria-pressed',on?'true':'false');
  }
  const tb=findBottomToolbar();
  if(tb){
    tb.classList.toggle('open',on);
    tb.classList.toggle('show',on);
    tb.classList.toggle('pinned',on);
    tb.style.opacity=on?'1':'';
    tb.style.pointerEvents=on?'auto':'';
    if(on)tb.style.transform='translateX(-50%) translateY(0)';
    else tb.style.transform='';
  }
  document.body.classList.toggle('toolbarPinned',on);
}
function wireQuickPinButton(){
  const pin=findPinButton();
  if(!pin||pin.dataset.quickPinWired==='1')return;
  pin.dataset.quickPinWired='1';
  pin.addEventListener('click',ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    setToolbarKeepVisible(!getToolbarKeepVisible());
    toast(getToolbarKeepVisible()?'Værktøjslinjen holdes synlig':'Automatisk skjul er slået til');
  },true);
  setToolbarKeepVisible(getToolbarKeepVisible());
}

function tavleDownloadTextFile(filename,text,mime='text/plain'){
  const blob=new Blob([text],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function tavlePickTextFile(accept,cb){
  const input=document.createElement('input');
  input.type='file';
  input.accept=accept||'.json,application/json';
  input.onchange=()=>{
    const f=input.files&&input.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(String(r.result||''),f);
    r.onerror=()=>toast('Kunne ikke læse filen');
    r.readAsText(f,'utf-8');
  };
  input.click();
}
function tavleHarvestLists(st){
  const bank=wheelListBank();
  try{
    (st.slides||[]).forEach(sl=>(sl.widgets||[]).forEach(w=>{
      if((w.type==='wheel'||w.type==='groups')&&w.data&&Array.isArray(w.data.names)&&w.data.names.length){
        const base=w.type==='groups'?'Liste fra grupper':'Liste fra hjul';
        const name=(w.title||base).trim();
        if(!bank[name])bank[name]=w.data.names.filter(Boolean);
      }
    }));
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
  }catch(e){}
}
function tavleRestoreLists(data){

    if(data&&data.wheelLists&&typeof data.wheelLists==='object')Object.assign(bank,data.wheelLists);
    if(data&&data.lists&&typeof data.lists==='object')Object.assign(bank,data.lists);
    localStorage.setItem('maans_wheel_lists',JSON.stringify(bank));
    if(!(data&&data.options&&data.options.templateOnly) && !(data&&data.state&&data.state.isTemplateOnly)){
      tavleHarvestLists(data.state||data);

  }catch(e){}

function collectEmbeddedMedia(){
  const items=[];
  const kindLabel=(src)=>{
    const ext=extFromDataUrl(src,'bin');
    if(ext==='pdf')return 'PDF';
    if(['png','jpg','webp','gif','svg'].includes(ext))return 'Billede';
    return 'Medie';
  };
  try{
    (state.slides||[]).forEach((sl,si)=>{
      const slideName=safeSlideTitle?safeSlideTitle(sl,si):('Tavle '+(si+1));
      if(sl.bgImage&&String(sl.bgImage).startsWith('data:')){
        items.push({type:'Baggrundsbillede',slide:slideName,name:`tavle-${si+1}-baggrund`,src:sl.bgImage});
      }
      (sl.widgets||[]).forEach((w,wi)=>{
        if(w.type==='image'&&w.data&&String(w.data.src||'').startsWith('data:')){
          items.push({type:'Billede',slide:slideName,name:w.data.name||`tavle-${si+1}-billede-${wi+1}`,src:w.data.src});
        }
        if(w.type==='pdf'&&w.data&&String(w.data.src||w.data.url||'').startsWith('data:')){
          items.push({type:'PDF',slide:slideName,name:w.data.name||`tavle-${si+1}-pdf-${wi+1}`,src:w.data.src||w.data.url});
        }
      });
    });
  }catch(e){}
  return items.map((it,i)=>{
    const ext=extFromDataUrl(it.src);
    return {...it,ext,filename:safeFileName(it.name,ext),label:it.type||kindLabel(it.src),id:'mediaDl'+i};
  });
}

function cleanHtmlForStandalone(htmlDoc){
  // Fjern modal/overlay/toast og midlertidige UI-tilstande, så den gemte fil ikke åbner låst.
  htmlDoc=htmlDoc.replace(/<div id="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modalBackdrop"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="modal"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div id="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/<div class="toast"[\s\S]*?<\/div>\s*/g,'');
  htmlDoc=htmlDoc.replace(/⏳ Forbereder fil\.\.\./g,'💾 Gem HTML + data');
  htmlDoc=htmlDoc.replace(/Forbereder HTML-fil\.\.\./g,'');
  htmlDoc=htmlDoc.replace(/disabled=""/g,'');
  htmlDoc=htmlDoc.replace(/\sdisabled(=("|')disabled\2)?/g,'');
  htmlDoc=htmlDoc.replace(/\sdata-old-text="[^"]*"/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleData"[\s\S]*?<\/script>/g,'');
  htmlDoc=htmlDoc.replace(/<script id="embeddedTavleBoot"[\s\S]*?<\/script>/g,'');
  return htmlDoc;
}
function makeStandaloneHtml(){
  const cleanState=stripTransientForExport(state);
  const payload=JSON.stringify(cleanState);
  let htmlDoc=document.documentElement.outerHTML;
  htmlDoc=cleanHtmlForStandalone(htmlDoc);

  // Boot-scriptet skal ligge før appens hovedscript, så den gemte fil starter med de rigtige tavler.
  const boot=`<script id="embeddedTavleBoot">(function(){try{localStorage.setItem('maans_interaktiv_tavle_v162_test', ${JSON.stringify(payload)});}catch(e){}})();<\/script>`;

  const firstScript=htmlDoc.indexOf('<script>');
  if(firstScript!==-1)htmlDoc=htmlDoc.slice(0,firstScript)+boot+htmlDoc.slice(firstScript);
  else if(htmlDoc.includes('</head>'))htmlDoc=htmlDoc.replace('</head>',boot+'</head>');
  else htmlDoc=boot+htmlDoc;

  return '<!doctype html>\n'+htmlDoc;
}

function wireRobustWidgetClose(){
  if(window.__robustWidgetCloseWired)return;
  window.__robustWidgetCloseWired=true;

  const isCloseButton=(el)=>{
    if(!el)return false;
    const txt=(el.textContent||'').trim();
    const act=(el.getAttribute?.('data-act')||el.getAttribute?.('data-action')||'').toLowerCase();
    return act==='del' || act==='delete' || act==='close' ||
      el.matches?.('.close,.x,.del,.delete,.remove,[aria-label="Luk"],[title="Luk"]')
      || txt==='×' || txt==='✕' || txt==='x' || txt==='X';
  };

  const handler=(e)=>{
    let btn=e.target.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    if(!btn && (e.clientX||e.clientY)){
      const hit=document.elementFromPoint(e.clientX,e.clientY);
      btn=hit&&hit.closest?.('button,.close,.x,.del,.delete,.remove,[data-action],[data-act],[aria-label],[title],[role=button]');
    }
    if(!btn||!isCloseButton(btn))return;
    const widget=btn.closest?.('.widget');
    if(!widget)return;

    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();

    const id=widget.dataset.id || widget.dataset.widgetId || widget.id;
    const now=Date.now();
    if(widget.__closeActivatedAt && now-widget.__closeActivatedAt<700)return;
    widget.__closeActivatedAt=now;
    try{
      if(typeof removeWidget==='function'){
        removeWidget(id);
        return;
      }
    }catch(err){}

    try{
      const sl=slide();
      if(sl&&Array.isArray(sl.widgets)){
        sl.widgets=sl.widgets.filter(w=>String(w.id)!==String(id));
        save({silent:true});
        render();
        return;
      }
    }catch(err){}

    widget.remove();
    try{save({silent:true})}catch(err){}
  };

  ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(ev=>{
    document.addEventListener(ev,handler,{capture:true,passive:false});
  });
}

function clearWidgetDataForTemplate(w){
  w.data = w.data || {};

  // Bevar widgettype, titel, placering, størrelse, rotation, lås osv.
  // Ryd kun det konkrete eksempelindhold.
  if(w.type==='text'){
    w.data.text='';
    w.data.html='';
  }

  if(w.type==='image'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.alt;
  }

  if(w.type==='pdf'){
    delete w.data.src;
    delete w.data.url;
    delete w.data.name;
    delete w.data.fileName;
    delete w.data.page;
  }

  if(w.type==='video'){
    delete w.data.url;
    delete w.data.src;
    delete w.data.embed;
    delete w.data.title;
    delete w.data.thumbnail;
  }

  if(w.type==='link'){
    delete w.data.url;
    w.data.text=w.data.text||'Link';
  }

  if(w.type==='wheel'){
    w.data.names=[];
    w.data.chosen=[];
    w.data.selected=[];
    w.data.result=[];
    w.data.current='';
  }

  if(w.type==='groups'){
    w.data.names=[];
    w.data.groups=[];
    w.data.result=[];
    w.data.grouped=[];
  }

  if(w.type==='wordcloud'){
    w.data.names=[];
    w.data.caseInsensitive = w.data.caseInsensitive!==false;
  }

  if(w.type==='poll'){
    w.data.question=w.data.question||'Hvordan går det?';
    w.data.options=w.data.options||['😀','🙂','😐','🙁','😡'];
    w.data.votes=w.data.options.map(()=>0);
    w.data.cloudView=false;
    w.data.showResults=false;
  }

  if(w.type==='timer'){
    w.data.running=false;
  }
}

function cloneForSaveFile(options={}){
  const copy=JSON.parse(JSON.stringify(state));
  try{
    copy.settings = copy.settings || {};
    copy.isTemplateOnly = !!options.templateOnly;

    if(options.templateOnly){
      // Ryd globale/lokale lister fra skabelonen.
      copy.lists={};
      copy.wheelLists={};
      copy.savedLists={};

      (copy.slides||[]).forEach(sl=>{
        // Ryd baggrundsbilleder, men bevar evt. farve/grundlæggende layout.
        delete sl.bgImage;
        delete sl.backgroundImage;
        delete sl.image;
        if(sl.bg && String(sl.bg).startsWith('data:')) delete sl.bg;
        if(sl.background && String(sl.background).startsWith('data:')) delete sl.background;

        (sl.widgets||[]).forEach(clearWidgetDataForTemplate);
      });
    }
  }catch(e){}
  return copy;
}

function handlePdfArrowKey(e){

(function(){
  function isWidgetChromeButton(el){
    return el && el.closest && el.closest('.widget .chrome button, .widget button.lock, .widget button.reset, .widget button.close, .widget button.del, .widget button.delete');
  }

  function activateWidgetChromeButton(e){

    // Kun venstre museknap / almindeligt klik
    if(e.type === 'mousedown' && e.button !== 0) return;

    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();

    // Undgå dobbeltklik-loop
    if(btn.__mouseFallbackActive) return;
    btn.__mouseFallbackActive = true;

    try{
      // Kald direkte onclick hvis den findes, ellers normal click.
      if(typeof btn.onclick === 'function'){
        btn.onclick.call(btn, new MouseEvent('click', {bubbles:true, cancelable:true, view:window}));
      }else{
        btn.click();
      }
    }catch(err){
      try{ btn.click(); }catch(e){}
    }

    setTimeout(()=>{ btn.__mouseFallbackActive = false; }, 0);
  }

  document.addEventListener('mousedown', activateWidgetChromeButton, true);
})();


/* v162.4 clean: fast fallback-knap nederst til højre - EN stabil toggle, oprettes i document.body
   Gammel "værktøjer ▲" og pin fjernes fra DOM. Toggle-knappen skjules i præsentation/fokus. */
(function(){
  function toolbar(){ return document.querySelector('.toolbar'); }
  function appIsPresentationOrFocus(){
    return app.classList.contains('present') ||
           document.body.classList.contains('focus-mode') ||
           document.body.classList.contains('focus-edit') ||
           document.body.classList.contains('focus-presentation');
  }
  function removeOldPeekAndPin(){
    ['toolbarPeek','toolbarPinFloat','toolbarPinFallback'].forEach(id=>{
      const el = document.getElementById(id);
      if(el && el.parentNode) el.parentNode.removeChild(el);
    });
    document.querySelectorAll('.toolbarPeek,.toolbarPinFloat,.pinTool,.toolbar [data-tool="pin"]').forEach(el=>{
      if(el && el.parentNode) el.parentNode.removeChild(el);
    });
  }
  function visibleToolbar(tb){
    if(!tb) return false;
    const cs = getComputedStyle(tb);
    return cs.display !== 'none' &&
           cs.visibility !== 'hidden' &&
           parseFloat(cs.opacity || '1') > 0.2 &&
           !document.body.classList.contains('toolbar-is-hidden') &&
           !app.classList.contains('toolbarHidden') &&
           !tb.classList.contains('hidden') &&
           cs.pointerEvents !== 'none';
  }
  function updateFallbackVisual(){
    const b = document.getElementById('toolbarFallback');
    if(!b) return;
    const directMaximized = document.body.classList.contains('focus-maximized') &&
      !document.body.classList.contains('focus-mode') &&
      !document.body.classList.contains('focus-edit') &&
      !document.body.classList.contains('focus-presentation') &&
      !app.classList.contains('present');
    if(appIsPresentationOrFocus() && !directMaximized){
      b.style.setProperty('display','none','important');
      b.style.setProperty('visibility','hidden','important');
      b.style.setProperty('pointer-events','none','important');
      return;
    }
    b.style.setProperty('display','flex','important');
    b.style.setProperty('visibility','visible','important');
    b.style.setProperty('pointer-events','auto','important');
    if(directMaximized){
      b.textContent = '⌃';
      b.title = 'Afslut maksimeret visning og vis værktøjslinje';
    }else{
      const isVisible = visibleToolbar(toolbar());
      b.textContent = isVisible ? '⌄' : '⌃';
      b.title = isVisible ? 'Skjul værktøjslinje' : 'Vis værktøjslinje';
    }
    b.setAttribute('aria-label', b.title);
  }
  function clearHiddenState(){
    document.body.classList.remove('toolbar-is-hidden');
    app.classList.remove('toolbarHidden');
    const tb = toolbar();
    if(tb){
      tb.classList.remove('hidden','toolbarHidden','forceHidden');
      tb.style.removeProperty('display');
      tb.style.opacity = '1';
      tb.style.pointerEvents = 'auto';
      tb.style.visibility = 'visible';
      tb.style.transform = 'translateX(-50%)';
    }
    try{ clearTimeout(toolbarHideTimer); }catch(e){}
    try{ clearTimeout(toolbarTimer); }catch(e){}
    updateFallbackVisual();
  }
  function hardHide(){
    const tb = toolbar();
    document.body.classList.add('toolbar-is-hidden');
    app.classList.add('toolbarHidden');
    if(tb){
      tb.classList.add('hidden');
      tb.style.pointerEvents = 'none';
      tb.style.visibility = 'hidden';
      tb.style.opacity = '0';
    }
    updateFallbackVisual();
  }
  let lastActivation = 0;
  function stopOnly(e){
    if(!e) return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
  }
  function activate(e){
    stopOnly(e);
    if(document.body.classList.contains('focus-maximized') && !app.classList.contains('present') && !document.body.classList.contains('focus-mode') && !document.body.classList.contains('focus-edit') && !document.body.classList.contains('focus-presentation')){
      if(typeof setFocusMaximized==='function') setFocusMaximized(false);
      clearHiddenState();
      return;
    }
    if(appIsPresentationOrFocus()) return;
    const now = Date.now();
    if(now - lastActivation < 450) return;
    lastActivation = now;
    const tb = toolbar();
    if(visibleToolbar(tb)) hardHide();
    else clearHiddenState();
  }
  function clickFallback(e){
    stopOnly(e);
    if(document.body.classList.contains('focus-maximized') && !app.classList.contains('present') && !document.body.classList.contains('focus-mode') && !document.body.classList.contains('focus-edit') && !document.body.classList.contains('focus-presentation')){
      if(typeof setFocusMaximized==='function') setFocusMaximized(false);
      clearHiddenState();
      return;
    }
    if(appIsPresentationOrFocus()) return;
    const now = Date.now();
    if(now - lastActivation < 650) return;
    activate(e);
  }
  function ensureButton(){
    removeOldPeekAndPin();
    let b = document.getElementById('toolbarFallback');
    if(!b){
      b = document.createElement('button');
      b.type = 'button';
      document.body.appendChild(b);
    }
    b.id = 'toolbarFallback';
    b.style.pointerEvents = 'auto';
    b.style.touchAction = 'manipulation';
    if(!b.__toolbarFallbackWired_v162_4){
      ['pointerdown','mousedown','touchstart'].forEach(ev=>{
        b.addEventListener(ev, stopOnly, {capture:true, passive:false});
      });
      ['pointerup','mouseup','touchend'].forEach(ev=>{
        b.addEventListener(ev, activate, {capture:true, passive:false});
      });
      b.addEventListener('click', clickFallback, {capture:true, passive:false});
      b.__toolbarFallbackWired_v162_4 = true;
    }
    updateFallbackVisual();
  }
  ensureButton();
  setInterval(ensureButton, 1000);
  window.showToolbarNow = clearHiddenState;
  window.hideToolbarNow = hardHide;
  window.toggleToolbarNow = function(){ if(appIsPresentationOrFocus()) return; const tb=toolbar(); visibleToolbar(tb) ? hardHide() : clearHiddenState(); };
})();

})();
