        body.widgetOverviewMode .widget:not(.widgetOverviewItem){opacity:.18!important;pointer-events:none!important}
        body.widgetOverviewMode #app::after{
          content:"";position:absolute;inset:0;z-index:15;pointer-events:none;background:rgba(0,0,0,.10);
        }
        body.widgetOverviewMode .widgetOverviewHint{
          position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:9999;
          background:rgba(17,24,39,.92);color:white;border-radius:999px;padding:10px 16px;
          font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.25);pointer-events:none;text-align:center;
        }
        #widgetCycle.widgetCycleBtn,#widgetCycle.widgetOverviewToggle{margin-left:8px!important}
        #widgetCycle.widgetOverviewToggle:not(.active){background:#4b5563!important;color:white!important;box-shadow:none!important}
        body.widgetOverviewMode #widgetCycle.widgetOverviewToggle,
        #widgetCycle.widgetOverviewToggle.active{background:#6d5dfc!important;color:white!important;box-shadow:0 0 0 2px rgba(255,255,255,.14) inset!important}

        body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected{z-index:8500!important}
        body:not(.widgetOverviewMode) .widget.selected,
        body:not(.widgetOverviewMode) .widget.focused,
        body:not(.widgetOverviewMode) .widget.focusTarget,
        body.focus-mode .widget.selected,
        body.focus-mode .widget.focused,
        body.focus-mode .widget.focusTarget,
        body.focus-edit .widget.selected,
        body.focus-edit .widget.focused,
        body.focus-edit .widget.focusTarget,
        body.focus-presentation .widget.selected,
        body.focus-presentation .widget.focused,
        body.focus-presentation .widget.focusTarget,
        body.focus-maximized .widget.selected,
        body.focus-maximized .widget.focused,
        body.focus-maximized .widget.focusTarget{
          z-index:214748000!important;
        }
      `;
      document.head.appendChild(st);
    }

    let overviewOpen=false;
    let stored=[];
    let hint=null;
    let activeIndex=0;
    let beforeState=null;
    let overviewCols=1;

    function cssEscape(v){ return (window.CSS&&CSS.escape) ? CSS.escape(String(v)) : String(v).replace(/"/g,'\\"'); }
    function widgets(){
      return Array.from(document.querySelectorAll('.widget'))
        .filter(el=>el && el.offsetParent!==null && !el.classList.contains('hidden'));
    }
    function getId(el){ return el && el.dataset ? el.dataset.id : ''; }
    function currentOverviewItems(){ return Array.from(document.querySelectorAll('.widgetOverviewItem')); }
    function setButtonActive(on){ btn.classList.toggle('active',!!on); btn.setAttribute('aria-pressed',on?'true':'false'); }
    function removeFocusModeClasses(){
      ['focus-mode','focus-edit','focus-presentation','focus-maximized','focusMode'].forEach(function(c){document.body.classList.remove(c); app.classList.remove(c);});
    }
    function restoreModeClassesFromBefore(){
      if(!beforeState) return;
      document.body.className=beforeState.bodyClasses || '';
      app.className=beforeState.appClasses || app.className;
      document.body.classList.remove('widgetOverviewMode');
      app.classList.remove('widgetOverviewMode');
    }

    function isRealFocusActive(){
      return document.body.classList.contains('focus-mode') ||
             document.body.classList.contains('focus-edit') ||
             document.body.classList.contains('focus-presentation') ||
             document.body.classList.contains('focus-maximized');
    }
    function topWidgetZ(){
      let m=0;
      document.querySelectorAll('.widget').forEach(w=>{
        const zi=parseInt(w.style.zIndex || getComputedStyle(w).zIndex || '0',10);
        if(Number.isFinite(zi)) m=Math.max(m,zi);
      });
      return Math.max(m, window.__widgetOverviewTopZ||9000);
    }
    function bumpWidgetToFront(el){
      if(!el) return;
      const nextZ=(window.__widgetOverviewTopZ=topWidgetZ()+1);
      el.style.zIndex=String(nextZ);
      try{
        const id=getId(el);
        if(id && typeof window.slide==='function'){
          const data=(slide().widgets||[]).find(w=>String(w.id)===String(id));
          if(data) data.z=nextZ;
        }
      }catch(_e){}
    }
    function selectWidget(el){
      if(!el) return;
      const id=getId(el);
      try{ if(id && typeof window.select==='function') window.select(id); }catch(_e){}
      try{ if(id && typeof window.selectWidget==='function') window.selectWidget(id); }catch(_e){}
      document.querySelectorAll('.widget').forEach(w=>{
        if(w!==el) w.classList.remove('selected','focused','focusTarget');
      });
      el.classList.add('selected');
      if(isRealFocusActive()){
        document.querySelectorAll('.widget').forEach(w=>{ if(w!==el) w.classList.remove('focused','focusTarget'); });
        el.classList.add('focused','focusTarget');
      }
      bumpWidgetToFront(el);
    }
    function focusChosenWidget(el){
      if(!el) return;
      selectWidget(el);
      el.classList.add('focused','focusTarget');
      bumpWidgetToFront(el);
      if(isRealFocusActive()) return;
      setTimeout(function(){
        try{
          const api=window.tavleShortcutAPI||{};
          if(api.toggleFocusShortcut) api.toggleFocusShortcut();
          else document.dispatchEvent(new KeyboardEvent('keydown',{key:'f',bubbles:true,cancelable:true}));
          el.classList.add('focused','focusTarget');
          bumpWidgetToFront(el);
        }catch(_e){}
      },40);
    }
    function maximizeChosenWidget(el){
      if(!el) return;
      selectWidget(el);
      el.classList.add('focused','focusTarget');
      bumpWidgetToFront(el);
      setTimeout(function(){
        try{
          const api=window.tavleShortcutAPI||{};
          if(api.toggleMaximizedFocusShortcut) api.toggleMaximizedFocusShortcut();
          else document.dispatchEvent(new KeyboardEvent('keydown',{key:'F',shiftKey:true,bubbles:true,cancelable:true}));
          el.classList.add('focused','focusTarget');
          bumpWidgetToFront(el);
        }catch(_e){}
      },70);
    }
    function clampIndex(i){
      const items=currentOverviewItems();
      if(!items.length) return 0;
      return Math.max(0,Math.min(items.length-1,i));
    }
    function setOverviewSelection(index){
      const items=currentOverviewItems();
      if(!items.length) return;
      activeIndex=clampIndex(index);
      items.forEach((el,i)=>el.classList.toggle('widgetOverviewSelected',i===activeIndex));
      try{ items[activeIndex].scrollIntoView({block:'nearest',inline:'nearest'}); }catch(_e){}
    }
    function moveOverviewSelection(dir){
      const items=currentOverviewItems();
      if(!items.length) return;
      const cols=Math.max(1,overviewCols||1);
      let next=activeIndex;
      if(dir==='right') next=activeIndex+1;
      if(dir==='left') next=activeIndex-1;
      if(dir==='down') next=activeIndex+cols;
      if(dir==='up') next=activeIndex-cols;
      setOverviewSelection(next);
    }
    function selectedOverviewWidget(){ return currentOverviewItems()[activeIndex] || currentOverviewItems()[0] || null; }

    function capture(){
      beforeState={
        bodyClasses:document.body.className,
        appClasses:app.className,
        selected:document.querySelector('.widget.selected') ? getId(document.querySelector('.widget.selected')) : '',
        wasFocus:isRealFocusActive()
      };
      stored=widgets().map(el=>({
        el:el,id:getId(el),
        left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height,
        transform:el.style.transform,transformOrigin:el.style.transformOrigin,zIndex:el.style.zIndex,
        transition:el.style.transition,pointerEvents:el.style.pointerEvents
      }));
    }
    function restore(){
      stored.forEach(s=>{
        const el=s.el && s.el.isConnected ? s.el : (s.id?document.querySelector('.widget[data-id="'+cssEscape(s.id)+'"]'):null);
        if(!el) return;
        el.style.left=s.left; el.style.top=s.top; el.style.width=s.width; el.style.height=s.height;
        el.style.transform=s.transform; el.style.transformOrigin=s.transformOrigin; el.style.zIndex=s.zIndex;
        el.style.transition=s.transition; el.style.pointerEvents=s.pointerEvents;
        el.classList.remove('widgetOverviewItem','widgetOverviewSelected');
      });
      stored=[];
    }
    function closeOverview(chosen, opts){
      opts=opts||{};
      if(!overviewOpen) return;
      const wasFocus=!!(beforeState && beforeState.wasFocus);
      overviewOpen=false;
      app.classList.remove('widgetOverviewMode');
      document.body.classList.remove('widgetOverviewMode');
      setButtonActive(false);
      if(hint){ hint.remove(); hint=null; }
      restore();
      restoreModeClassesFromBefore();
      if(chosen){
        if(opts.maximize) maximizeChosenWidget(chosen);
        else if(opts.focus || wasFocus) focusChosenWidget(chosen);
        else selectWidget(chosen);
      }
      beforeState=null;
      try{ if(typeof window.toast==='function') window.toast(chosen?(opts.focus?'Widget i fokus':(opts.maximize?'Widget maksimeret':'Widget valgt')):'Widget-overblik lukket'); }catch(_e){}
    }
    function openOverview(){
      if(overviewOpen){ closeOverview(); return; }
      const ws=widgets();
      if(!ws.length){ try{ if(typeof window.toast==='function') window.toast('Ingen widgets på tavlen'); }catch(_e){} return; }
      overviewOpen=true;
      capture();
      removeFocusModeClasses();
      app.classList.add('widgetOverviewMode');
      document.body.classList.add('widgetOverviewMode');
      setButtonActive(true);

      const rect=app.getBoundingClientRect();
      const topPad=86, bottomPad=118, sidePad=28, gap=12;
      const availW=Math.max(260, rect.width - sidePad*2);
      const availH=Math.max(220, rect.height - topPad - bottomPad);
      const n=ws.length;
      let best={cols:1,rows:n,score:Infinity,w:availW,h:availH};
      for(let cols=1; cols<=Math.min(n,5); cols++){
        const rows=Math.ceil(n/cols);
        const cellW=(availW-gap*(cols-1))/cols;
        const cellH=(availH-gap*(rows-1))/rows;
        const ratio=cellW/cellH;
        const score=Math.abs(Math.log(ratio/1.45)) + rows*.08;
        if(score<best.score) best={cols:cols,rows:rows,score:score,w:cellW,h:cellH};
      }
      overviewCols=Math.max(1,best.cols||1);
      const gridW=best.cols*best.w+(best.cols-1)*gap;
      const startX=Math.max(sidePad,(rect.width-gridW)/2);
      const startY=topPad;
      ws.forEach((el,i)=>{
        const col=i%best.cols, row=Math.floor(i/best.cols);
        const x=startX+col*(best.w+gap), y=startY+row*(best.h+gap);
        const oldW=el.offsetWidth||360, oldH=el.offsetHeight||240;
        const scale=Math.min(best.w/oldW, best.h/oldH, 1.05);
        const shownW=Math.max(150, Math.min(best.w, oldW*scale));
        const shownH=Math.max(105, Math.min(best.h, oldH*scale));
        el.style.transition='left .18s ease, top .18s ease, width .18s ease, height .18s ease, transform .18s ease, box-shadow .18s ease';
        el.style.left=Math.round(x+(best.w-shownW)/2)+'px';
        el.style.top=Math.round(y+(best.h-shownH)/2)+'px';
        el.style.width=Math.round(shownW)+'px';
        el.style.height=Math.round(shownH)+'px';
        el.style.transform='rotate(0deg)';
        el.style.transformOrigin='center center';
        el.style.zIndex=String(7000+i);
        el.style.pointerEvents='auto';
        el.classList.add('widgetOverviewItem');
        el.classList.remove('selected','focused','focusTarget');
      });
      const selectedId=(beforeState&&beforeState.selected)||'';
      activeIndex=Math.max(0, ws.findIndex(el=>getId(el)===selectedId));
      setOverviewSelection(activeIndex);
      hint=document.createElement('div');
      hint.className='widgetOverviewHint';
      hint.textContent='Widget-overblik: pile vælger i grid · Enter/tap åbner · F fokus · Shift+F maksimerer · ESC lukker';
      app.appendChild(hint);
      try{ if(typeof window.toast==='function') window.toast('Widget-overblik'); }catch(_e){}
    }

    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      if(overviewOpen) closeOverview(); else openOverview();
    });

    document.addEventListener('click',function(e){
      if(!overviewOpen) return;
      const w=e.target && e.target.closest && e.target.closest('.widgetOverviewItem');
      if(w){
        e.preventDefault(); e.stopPropagation();
        closeOverview(w);
        return;
      }
      if(e.target===btn || (e.target.closest && e.target.closest('#widgetCycle'))) return;
      if(e.target.closest && e.target.closest('.topbar')) return;
      e.preventDefault(); e.stopPropagation();
      closeOverview();
    },true);

    window.addEventListener('keydown',function(e){
      const key=String(e.key||'');
      const lower=key.toLowerCase();
      if((e.metaKey || e.ctrlKey) && !e.altKey && lower==='o'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        if(overviewOpen) closeOverview(); else openOverview();
        return;
      }
      if(!overviewOpen) return;
      /* v7: In overview, Cmd/Ctrl+Left/Right moves the selected widget to another board.
         Close overview first so temporary grid layout is never saved as widget geometry. */
      if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (key==='ArrowRight' || key==='ArrowLeft')){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        const chosen=selectedOverviewWidget();
        const dir=key==='ArrowRight' ? 1 : -1;
        closeOverview(chosen);
        setTimeout(function(){
          try{
            const id=getId(chosen);
            if(id){
              if(typeof window.select==='function') window.select(id);
              else if(typeof window.selectWidget==='function') window.selectWidget(id);
            }
            if(typeof moveSelectedWidgetBySlideDirection==='function') moveSelectedWidgetBySlideDirection(dir);
          }catch(_e){}
        },20);
        return;
      }
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter','Escape'].includes(key) || lower==='f'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      }
      if(key==='Escape'){
        closeOverview();
      }else if(key==='Enter'){
        closeOverview(selectedOverviewWidget());
      }else if(key==='ArrowRight'){
        moveOverviewSelection('right');
      }else if(key==='ArrowLeft'){
        moveOverviewSelection('left');
      }else if(key==='ArrowDown'){
        moveOverviewSelection('down');
      }else if(key==='ArrowUp'){
        moveOverviewSelection('up');
      }else if(lower==='f' && e.shiftKey){
        closeOverview(selectedOverviewWidget(),{maximize:true});
      }else if(lower==='f'){
        closeOverview(selectedOverviewWidget(),{focus:true});
      }
    },true);

    window.closeWidgetOverview=closeOverview;
    window.openWidgetOverview=openOverview;
    window.toggleWidgetOverview=function(){ if(overviewOpen) closeOverview(); else openOverview(); };
    setButtonActive(false);
  });
})();
</script>


<script id="widget-overview-v5-focus-key-fix">

(function(){
  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }
  ready(function(){
    const app=document.getElementById('app');
    const btn=document.getElementById('widgetCycle');
    if(!app || !btn) return;

    /* v5: clean initial state for overview button/classes */
    try{
      document.body.classList.remove('widgetOverviewMode');
      app.classList.remove('widgetOverviewMode');
      btn.classList.remove('active');
      btn.setAttribute('aria-pressed','false');
    }catch(_e){}

    if(!document.getElementById('widget-overview-v5-style')){
      const st=document.createElement('style');
      st.id='widget-overview-v5-style';
      st.textContent=`
        /* v5: in overview there is exactly one clear selection mark */
        body.widgetOverviewMode .widgetOverviewItem{
          outline:3px solid rgba(255,255,255,.55)!important;
          box-shadow:0 10px 28px rgba(0,0,0,.28)!important;
        }
        body.widgetOverviewMode .widgetOverviewItem.selected,
        body.widgetOverviewMode .widgetOverviewItem.focused,
        body.widgetOverviewMode .widgetOverviewItem.focusTarget{
          outline:3px solid rgba(255,255,255,.55)!important;
          box-shadow:0 10px 28px rgba(0,0,0,.28)!important;
        }
        body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected,
        body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected.selected,
        body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected.focused,
        body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected.focusTarget{
          outline:6px solid #6d5dfc!important;
          box-shadow:0 0 0 4px rgba(109,93,252,.28),0 20px 48px rgba(0,0,0,.42)!important;
          z-index:214748200!important;
        }
        /* v5: selected/focused/maximized widget must always win the stack */
        body:not(.widgetOverviewMode) .widget.selected,
        body:not(.widgetOverviewMode) .widget.focused,
        body:not(.widgetOverviewMode) .widget.focusTarget,
        body.focus-mode:not(.widgetOverviewMode) .widget.selected,
        body.focus-mode:not(.widgetOverviewMode) .widget.focused,
        body.focus-mode:not(.widgetOverviewMode) .widget.focusTarget,
        body.focus-edit:not(.widgetOverviewMode) .widget.selected,
        body.focus-edit:not(.widgetOverviewMode) .widget.focused,
        body.focus-edit:not(.widgetOverviewMode) .widget.focusTarget,
        body.focus-presentation:not(.widgetOverviewMode) .widget.selected,
        body.focus-presentation:not(.widgetOverviewMode) .widget.focused,
        body.focus-presentation:not(.widgetOverviewMode) .widget.focusTarget,
        body.focus-maximized:not(.widgetOverviewMode) .widget.selected,
        body.focus-maximized:not(.widgetOverviewMode) .widget.focused,
        body.focus-maximized:not(.widgetOverviewMode) .widget.focusTarget{
          z-index:214748200!important;
        }
      `;
      document.head.appendChild(st);
    }

    function isOverview(){ return document.body.classList.contains('widgetOverviewMode') || app.classList.contains('widgetOverviewMode'); }
    function isFocusActive(){
      return document.body.classList.contains('focus-mode') ||
             document.body.classList.contains('focus-edit') ||
             document.body.classList.contains('focus-presentation') ||
             document.body.classList.contains('focus-maximized') ||
             app.classList.contains('focusMode') ||
             app.classList.contains('focus-mode');
    }
    function topZ(){
      let m=0;
      document.querySelectorAll('.widget').forEach(w=>{
        const z=parseInt(w.style.zIndex || getComputedStyle(w).zIndex || '0',10);
        if(Number.isFinite(z)) m=Math.max(m,z);
      });
      return Math.max(m, window.__widgetOverviewTopZ || 9000);
    }
    function setFront(el){
      if(!el) return;
      const z=(window.__widgetOverviewTopZ=topZ()+1);
      el.style.zIndex=String(z);
      try{
        const id=el.dataset && el.dataset.id;
        if(id && typeof window.slide==='function'){
          const data=(slide().widgets||[]).find(w=>String(w.id)===String(id));
          if(data) data.z=z;
        }
      }catch(_e){}
    }
    function normalizeSelectedFocus(){
      if(isOverview()) return;
      const sel=document.querySelector('.widget.selected:not(.focused):not(.focusTarget)') || document.querySelector('.widget.selected') || document.querySelector('.widget.focused') || document.querySelector('.widget.focusTarget');
      if(!sel) return;
      if(isFocusActive()){
        document.querySelectorAll('.widget').forEach(w=>{
          if(w!==sel) w.classList.remove('selected','focused','focusTarget');
        });
        sel.classList.add('selected','focused','focusTarget');
      }else{
        sel.classList.add('selected');
      }
      setFront(sel);
    }
    function normalizeOverviewSelection(){
      if(!isOverview()) return;
      const items=Array.from(document.querySelectorAll('.widgetOverviewItem'));
      const active=document.querySelector('.widgetOverviewItem.widgetOverviewSelected') || items.find(w=>w.classList.contains('selected')) || items[0];
      items.forEach(w=>{
        w.classList.remove('selected','focused','focusTarget');
        if(w!==active){ w.classList.remove('widgetOverviewSelected'); }
      });
      if(active){ active.classList.add('widgetOverviewSelected'); active.style.zIndex='214748200'; }
      btn.classList.add('active');
      btn.setAttribute('aria-pressed','true');
    }

    /* Cmd/Ctrl+O must always be widget overview, never maximize/open-file. */
    function cmdOHandler(e){
      const k=String(e.key||'').toLowerCase();
      if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && k==='o'){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        try{
          if(typeof window.toggleWidgetOverview==='function') window.toggleWidgetOverview();
          else btn.click();
        }catch(_e){ try{ btn.click(); }catch(_e2){} }
        return false;
      }
    }
    window.addEventListener('keydown',cmdOHandler,true);
    document.addEventListener('keydown',cmdOHandler,true);
    app.addEventListener('keydown',cmdOHandler,true);

    /* Up/down changes widgets in normal mode; when in focus, the focus must follow selected widget. */
    function afterNav(e){
      const k=String(e.key||'');
      if(isOverview()){
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)) setTimeout(normalizeOverviewSelection,0);
        return;
      }
      if(k==='ArrowUp' || k==='ArrowDown'){
        setTimeout(normalizeSelectedFocus,0);
        setTimeout(normalizeSelectedFocus,60);
      }
      if(k==='F' && e.shiftKey){
        setTimeout(normalizeSelectedFocus,90);
      }
    }
    window.addEventListener('keydown',afterNav,true);
    document.addEventListener('keyup',afterNav,true);
    document.addEventListener('click',function(e){
      setTimeout(function(){ if(isOverview()) normalizeOverviewSelection(); else normalizeSelectedFocus(); },0);
    },true);

    /* Last-resort sync while in focus/overview after external handlers have changed selection. */
    let lastSel='';
    setInterval(function(){
      try{
        if(isOverview()){
          normalizeOverviewSelection();
          return;
        }
        const sel=document.querySelector('.widget.selected') || document.querySelector('.widget.focused') || document.querySelector('.widget.focusTarget');
        const id=sel && sel.dataset ? String(sel.dataset.id||'') : '';
        if(id && (id!==lastSel || isFocusActive())){
          lastSel=id;
          normalizeSelectedFocus();
        }
      }catch(_e){}
    },250);
  });
})();

</script>

<script id="widget-overview-v6-focus-overview-fix">
(function(){
  function ready(fn){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true}); else fn(); }
  ready(function(){
    var app=document.getElementById('app'); var btn=document.getElementById('widgetCycle'); if(!app) return;
    if(!document.getElementById('widget-overview-v6-style')){
      var st=document.createElement('style'); st.id='widget-overview-v6-style'; st.textContent='body.widgetOverviewMode .widgetOverviewItem{opacity:1!important;filter:none!important;visibility:visible!important} body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected{outline:6px solid #6d5dfc!important;box-shadow:0 0 0 4px rgba(109,93,252,.30),0 22px 52px rgba(0,0,0,.44)!important;z-index:214748250!important} body:not(.widgetOverviewMode) .widget.selected,body:not(.widgetOverviewMode) .widget.focused,body:not(.widgetOverviewMode) .widget.focusTarget{z-index:214748250!important}';
      document.head.appendChild(st);
    }
    function isOverview(){return document.body.classList.contains('widgetOverviewMode')||app.classList.contains('widgetOverviewMode');}
    function isFocus(){return ['focus-mode','focus-edit','focus-presentation','focus-maximized','focusMode'].some(function(c){return document.body.classList.contains(c)||app.classList.contains(c);});}
    function topZ(){var m=0;document.querySelectorAll('.widget').forEach(function(w){var z=parseInt(w.style.zIndex||getComputedStyle(w).zIndex||'0',10);if(Number.isFinite(z))m=Math.max(m,z);});return Math.max(m,window.__widgetOverviewTopZ||9000);}
    function front(w){if(!w)return;var z=(window.__widgetOverviewTopZ=topZ()+1);w.style.zIndex=String(z);}
    function currentSelected(){return document.querySelector('.widget.selected:not(.focused):not(.focusTarget)')||document.querySelector('.widget.selected')||document.querySelector('.widget.focused')||document.querySelector('.widget.focusTarget');}
    function syncFocusSelection(){
      if(isOverview()) return;
      var sel=currentSelected(); if(!sel) return;
      if(isFocus()){document.querySelectorAll('.widget').forEach(function(w){if(w!==sel)w.classList.remove('selected','focused','focusTarget');}); sel.classList.add('selected','focused','focusTarget');}
      else {document.querySelectorAll('.widget').forEach(function(w){if(w!==sel)w.classList.remove('focused','focusTarget');}); sel.classList.add('selected');}
      front(sel);
    }
    function cleanOverviewButton(){ if(btn && !isOverview()){btn.classList.remove('active');btn.setAttribute('aria-pressed','false');} }
    cleanOverviewButton();
    document.addEventListener('keydown',function(e){
      var k=String(e.key||''); var lower=k.toLowerCase();
      if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&lower==='o'){ e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation(); try{ if(typeof window.toggleWidgetOverview==='function') window.toggleWidgetOverview(); else if(btn) btn.click(); }catch(_e){} return false; }
      if(!isOverview() && (k==='ArrowUp'||k==='ArrowDown')){ setTimeout(syncFocusSelection,0); setTimeout(syncFocusSelection,80); }
      if(!isOverview() && k==='F' && e.shiftKey){ setTimeout(syncFocusSelection,120); }
    },true);
    document.addEventListener('keyup',function(e){ if(!isOverview() && (e.key==='ArrowUp'||e.key==='ArrowDown')) setTimeout(syncFocusSelection,0); },true);
    setInterval(function(){try{ if(!isOverview()){cleanOverviewButton(); if(isFocus()) syncFocusSelection();}}catch(_e){}},300);
  });
})();
</script>


<script id="widget-overview-v8-fixed-clean-overview-slide-reset">
(function(){
  function ready(fn){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true}); else fn(); }
  ready(function(){
    var app=document.getElementById('app');
    if(!app) return;

    if(!document.getElementById('widget-overview-v8-fixed-style')){
      var st=document.createElement('style');
      st.id='widget-overview-v8-fixed-style';
      st.textContent=[
        /* Overview skal være ren: ingen topbar/toolbar, kun tavletitel bliver stående. */
        'body.widgetOverviewMode .topbar{display:none!important;opacity:0!important;pointer-events:none!important}',
        'body.widgetOverviewMode .toolbar,body.widgetOverviewMode .toolbarPeek,body.widgetOverviewMode .toolbarPinFloat,body.widgetOverviewMode .drawPanel,#toolbarWakeZone{display:none!important;opacity:0!important;pointer-events:none!important}',
        'body.widgetOverviewMode .title,body.widgetOverviewMode #title{display:block!important;opacity:1!important;visibility:visible!important;pointer-events:none!important;z-index:214748260!important}',
        /* Valgt/fokus/max skal altid ligge øverst udenfor overview. */
        'body:not(.widgetOverviewMode) .widget.selected,body:not(.widgetOverviewMode) .widget.focused,body:not(.widgetOverviewMode) .widget.focusTarget{z-index:214748250!important}',
        'body.widgetOverviewMode .widgetOverviewItem.widgetOverviewSelected{outline:6px solid #6d5dfc!important;box-shadow:0 0 0 4px rgba(109,93,252,.30),0 22px 52px rgba(0,0,0,.44)!important;z-index:214748250!important}'
      ].join('\n');
      document.head.appendChild(st);
    }

    function overviewOn(){ return document.body.classList.contains('widgetOverviewMode') || app.classList.contains('widgetOverviewMode'); }
    function clearFocusAndMax(){
      var classes=['focus-mode','focus-edit','focus-presentation','focus-maximized','focusMode','maximized-from-edit','maximizedFocus','focusMaximized'];
      classes.forEach(function(c){ document.body.classList.remove(c); app.classList.remove(c); });
      document.querySelectorAll('.widget').forEach(function(w){
        w.classList.remove('focused','focusTarget','maximized','maximizedFocus','focusMaximized');
        w.style.opacity='';
        w.style.filter='';
        w.style.visibility='';
      });
      document.querySelectorAll('#focusExit,#maxEmergencyExit,.focusExit,.maxEmergencyExit').forEach(function(el){
        if(el && el.style) el.style.display='none';
      });
    }

    /* Åbner overview rent, også hvis man kom fra fokus/maksimeret. Den gamle overview-logik husker stadig, om fokus var aktivt. */
    var openOld=window.openWidgetOverview;
    if(typeof openOld==='function' && !openOld.__v8FixedWrapped){
      var openNew=function(){
        var r=openOld.apply(this,arguments);
        setTimeout(function(){
          if(overviewOn()){
            clearFocusAndMax();
            document.body.classList.add('widgetOverviewMode');
            app.classList.add('widgetOverviewMode');
          }
        },0);
        return r;
      };
      openNew.__v8FixedWrapped=true;
      window.openWidgetOverview=openNew;
      window.toggleWidgetOverview=function(){
        if(overviewOn() && typeof window.closeWidgetOverview==='function') window.closeWidgetOverview();
        else window.openWidgetOverview();
      };
    }

    function wrapBoardChange(name){
      var old=window[name];
      if(typeof old!=='function' || old.__v8FixedWrapped) return;
      var fn=function(){
        if(overviewOn() && typeof window.closeWidgetOverview==='function') window.closeWidgetOverview();
        clearFocusAndMax();
        var r=old.apply(this,arguments);
        setTimeout(clearFocusAndMax,0);
        setTimeout(clearFocusAndMax,80);
        return r;
      };
      fn.__v8FixedWrapped=true;
      window[name]=fn;
    }
    wrapBoardChange('nextSlide');
    wrapBoardChange('prevSlide');

    /* Topbar-knapper og almindeligt tastatur-tavleskift må ikke trække fokus/max med over på næste tavle. */
    ['prev','next'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){ el.addEventListener('click',function(){ setTimeout(clearFocusAndMax,0); setTimeout(clearFocusAndMax,80); },true); }
    });
    document.addEventListener('keydown',function(e){
      var key=e.key||'';
      var lower=String(key).toLowerCase();
      if((e.metaKey||e.ctrlKey) && !e.altKey && !e.shiftKey && lower==='o'){
        e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        if(typeof window.toggleWidgetOverview==='function') window.toggleWidgetOverview();
        return false;
      }
      if(!overviewOn() && (key==='ArrowLeft' || key==='ArrowRight') && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey){
        setTimeout(clearFocusAndMax,0);
        setTimeout(clearFocusAndMax,80);
      }
    },true);
  });
})();
</script>
