<!--
AI-KODEKORT — Min undervisningstavle / SAFE41
Formål: Single-file webapp (HTML + CSS + JavaScript i én fil). Data gemmes primært i localStorage. Ingen backend.
State: `state` rummer bl.a. `active`, `slides`, `datasets`, settings og runtime-data. Gemmes som JSON under KEY i localStorage.
Tavle/slide: Et element i `state.slides[]` med titel, baggrund, tegning og `widgets[]`. `state.active` peger på aktuel tavle.
Widget: Objekt med id, type, position, størrelse, z-index, rotation, titel og `data`. DOM bygges typisk via `makeWidget()`, indhold via `fillContent()`.
Vigtige områder: storage omkring KEY/load/save/state; tavler omkring slide()/render(); widgets omkring addWidget()/makeWidget()/wireWidget()/select()/fillContent(); shortcuts i flere keydown-handlere; papirkurv i trash-board-blokke; KahooPardy i egne funktioner/CSS.
Følsomme områder: render-flow, init/load, select(), addWidget(), globale shortcuts, papirkurv som intern tavle, iframe/link-kontrol, fokus/maksimering, PDF og KahooPardy-template literals.
Arbejdsprincip: Fremtidig AI bør ændre småt, teste efter hver ændring og aldrig omskrive store blokke uden først at kortlægge afhængigheder.

SAFE51 TOOLBAR-/INDHOLDSPRINCIP
- Primær toolbar skal være til live-undervisningshandlinger og hurtige aktiviteter.
- Basale indholds-widgets som tekst, video, datawidget og listewidget ligger i Mere > Indhold, så toolbaren ikke bliver for bred.
- Datawidget og listewidget er brugerrettede indgange til appens fælles dataflow: tekst/tabeller ind, lister videre til aktiviteter.
- Flytning af knapper må kun ændre placering/label; nye data-more-tool-navne kræver matchende handleTool-case og direkte test.

SIKKERHEDSREGLER FOR AI-ÆNDRINGER
- Lav små, isolerede ændringer og gem fallback før næste trin.
- Test load, toolbar, Mere, widgets, papirkurv, shortcuts, wheel og KahooPardy efter hver ændring.
- Undgå regex-erstatning af store blokke; ret få konkrete linjer.
- Undgå wrappers/monkeypatch omkring render(), init/load-flow, select() og addWidget(), medmindre hele flowet er kortlagt.
- Bevar KahooPardy-template literals, mode-knapper og rendering; rør dem kun med meget snæver patch.
- Bevar papirkurv som intern/særlig tavle, skjult fra normal tavlelogik.
- Hvis appen ikke loader efter en ændring: rollback straks til senest virkende fil og lav mindre patch.

KENDTE RISIKOOMRÅDER
- Single-file-størrelse: mange funktioner, CSS-lag og patchhistorik i samme fil.
- Mange patchlag: samme feature kan have senere overrides længere nede i filen.
- Flere overlappende shortcut-handlere: kontrollér faktisk handler før ændring.
- KahooPardy-template er følsom; tidligere fejl viste en rå template-streng med kahoopardyModeName(currentMode) i DOM.
- Papirkurv er intern tavle og må ikke behandles som normal brugertavle.
- Wheel-CSS er følsom: SAFE26 viste, at gammel v11 wheel-CSS stadig påvirker praktisk styring/pointer-flow.
- iPad/Safari har særheder med focus, file://, print, iframe, lyd-unlock og pointer events.
- localStorage/state-migration kan påvirke gamle tavler; vær varsom med ændring af datamodellen.

STABILITETSLOG / SENESTE OPRYDNINGSLINJE
- SAFE22–25: AI-kodekort + første sikre oprydninger: død HTML-gren, gammel modal-papirkurv og supersedet More-CSS.
- SAFE26 og SAFE32: kasserede forsøg; de viste at wheel-CSS og selv små CSS-rester kan påvirke keyboard-/pointer-flow.
- SAFE27–34: rollback/stabilisering, rescue-dublet fjernet, titel/save/bg-CSS ryddet, lyd-unlock repareret.
- SAFE35–40: dokumentationslaget konsolideret: header, CSS-kommentarer, script-kort, KahooPardy-advarsel og widget-map.

WIDGET-MAP / AI-UDVIKLINGSKORT
- Widgetlivscyklus: addWidget() opretter dataobjekt; makeWidget() bygger ydre DOM/chrome; fillContent() bygger typeindhold; wireWidget() kobler drag/resize/rotation/valg; save()/render() synkroniserer state og DOM.
- CSS for widgets ligger spredt i lag: basis .widget/.content øverst, type-CSS længere nede, og senere SAFE/patch-overrides nederst. Fjern aldrig ældre widget-CSS uden konkret widget-test.
- En widgetændring kræver normalt tjek af tre steder: CSS for typen, fillContent()/render-funktion for typen, og evt. særskilt wire/keyboard-funktion.
- Text/dataset er koblet til dataset-parser, eksport og kolonne-til-liste-flow. Test Æ/Ø/Å og CSV/TSV efter ændringer.
- Wheel er følsom: mellemrum, auto-spin, centerknap, listebank, cloud/opsamling og lyd-unlock kan påvirke hinanden via både CSS og JS.
- Groups bruger egen wheel-lignende visning, låste grupper og resultatlayout; test både redigering og præsentation.
- Wordcloud/poll/wheel-cloud deler visuelle cloud-mønstre; CSS-oprydning kan påvirke flere widgets samtidigt.
- Link/iframe og PDF har særlige pointer-events/focus-regler. Test både valgt, ikke valgt, præsentation og focus/maximize.
- Image/PDF kan have download-/lokalfilflows. Test file://, GitHub Pages og iPad/Safari særskilt ved ændringer.
- KahooPardy har egen normalisering, keyboardlogik og templates. Rør kun i den afgrænsede KahooPardy-blok og test straks load + startmode.
- Papirkurv flytter hele widgetobjekter. Widgettyper må derfor bevare data/state ved slet/gendan; permanent sletning må ikke bruges som normal delete.

DATAWIDGET-FLOW / AI-UX-REGEL
- Datawidgetten er appens centrale mellemstation for tekst, tabeller og genbrugelige lister.
- Widgets der bruger/producerer tekstdata bør primært hente fra og aflevere til datawidgets/listewidgets, ikke åbne tilfældige filvælgere hver især.
- Filimport bør føre til data/liste først; hjul, grupper, ordsky, afstemning og KahooPardy bør derefter hente derfra.

/* ===== CSS: PAPIRKURV / INTERNAL TRASH BOARD ===== */
/* SAFE10 phase 1: Papirkurv som rigtig tavle, ikke modal */
.moreMenu{grid-template-columns:repeat(5,minmax(74px,1fr))!important;max-width:min(94vw,680px)!important;}
/*
PAPIRKURV MAP / INTERN TAVLE
- Papirkurv er en intern slide i state.slides, men skal skjules fra normal tavletæller, oversigt, omdøbning/flytning/sletning.
- Åbnes/lukkes med T og via Mere → Papirkurv. Esc/mellemrum lukker papirkurv.
- Normal Delete/Backspace og widget-X flytter widgetobjektet til papirkurven; Shift+delete/Shift+X sletter permanent.
- I papirkurv: klik/Enter gendanner; X/Delete/Backspace sletter permanent; piletaster navigerer i overviewet.
- Papirkurv må ikke reintroduceres som modal/localStorage-liste.
*/
.trashBoardBar{

/* ===== SAFE52: BRUGERRETTET STATUSMÆRKE / MODE INDICATOR =====
   Formål: Vis den aktuelle brugertilstand uden at afsløre tekniske interne klasser.
   Må kun beskrive brugerens situation: Redigering, Præsentation, Fokus, Maksimeret eller Papirkurv.
   Holdes som et sent, isoleret UI-lag. Må ikke kobles ind i render(), select() eller addWidget(). */
.modeBadge{
  position:absolute;
  left:18px;
  top:74px;
  z-index:980;
  background:rgba(17,24,39,.78);
  color:white;
  border:1px solid rgba(255,255,255,.20);
  border-radius:999px;
  padding:6px 11px;
  font-size:12px;
  font-weight:950;
  letter-spacing:.02em;
  box-shadow:0 8px 18px rgba(0,0,0,.18);
  pointer-events:none;
  opacity:.92;
  backdrop-filter:blur(5px);
}
.modeBadge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#a7f3d0;margin-right:7px;vertical-align:1px;}
.modeBadge.is-present::before{background:#fde68a;}
.modeBadge.is-focus::before{background:#93c5fd;}
.modeBadge.is-max::before{background:#c4b5fd;}
.modeBadge.is-trash::before{background:#fca5a5;}
.modeBadge.is-draw::before{background:#fcd34d;}
@media(max-width:700px){.modeBadge{left:12px;top:68px;font-size:11px;padding:5px 9px;}}

/* ===== SAFE55: SYNKRONISERET TITELKANT + TYDELIGERE TRAFIKLYSFARVER =====
   Formål: Den lille statusprik skal være tydelig nok, og titelrammen skal bære samme farvesignal.
   Brugerlogik:
   - Rød = Redigering
   - Lys grøn = Præsentation
   - Lilla = Fokus / max
   - Gul = Tegning
   - Blød rød/grå = Papirkurv
   Dette lag er rent visuelt og må ikke ændre appens funktionslogik. */
.title{padding-left:38px!important;border-color:rgba(239,68,68,.92)!important;box-shadow:0 0 0 1px rgba(239,68,68,.26),0 0 16px rgba(239,68,68,.24),0 8px 18px rgba(0,0,0,.18)!important;}

.title.mode-present{border-color:rgba(134,239,172,.92)!important;box-shadow:0 0 0 1px rgba(134,239,172,.26),0 0 16px rgba(134,239,172,.24),0 8px 18px rgba(0,0,0,.18)!important;}
.title.mode-focus,.title.mode-max{border-color:rgba(167,139,250,.95)!important;box-shadow:0 0 0 1px rgba(167,139,250,.28),0 0 16px rgba(167,139,250,.26),0 8px 18px rgba(0,0,0,.18)!important;}
.title.mode-trash{border-color:rgba(252,165,165,.85)!important;box-shadow:0 0 0 1px rgba(252,165,165,.22),0 0 16px rgba(252,165,165,.18),0 8px 18px rgba(0,0,0,.18)!important;}
.title.mode-draw{border-color:rgba(250,204,21,.92)!important;box-shadow:0 0 0 1px rgba(250,204,21,.24),0 0 16px rgba(250,204,21,.22),0 8px 18px rgba(0,0,0,.18)!important;}
.modeBadge{left:31px!important;top:33px!important;width:13px!important;height:13px!important;min-width:13px!important;min-height:13px!important;border:2px solid rgba(255,255,255,.96)!important;background:#ef4444!important;box-shadow:0 0 0 3px rgba(17,24,39,.56),0 0 18px rgba(239,68,68,.48)!important;}
.modeBadge.is-present{background:#86efac!important;box-shadow:0 0 0 3px rgba(17,24,39,.56),0 0 18px rgba(134,239,172,.48)!important;}
.modeBadge.is-focus,.modeBadge.is-max{background:#a78bfa!important;box-shadow:0 0 0 3px rgba(17,24,39,.56),0 0 18px rgba(167,139,250,.50)!important;}
.modeBadge.is-trash{background:#fca5a5!important;box-shadow:0 0 0 3px rgba(17,24,39,.56),0 0 18px rgba(252,165,165,.42)!important;}
.modeBadge.is-draw{background:#facc15!important;box-shadow:0 0 0 3px rgba(17,24,39,.56),0 0 18px rgba(250,204,21,.45)!important;}
@media(max-width:700px){.title{padding-left:36px!important;}.modeBadge{left:28px!important;top:31px!important;width:12px!important;height:12px!important;min-width:12px!important;min-height:12px!important;}}



/* ===== SAFE59: SIKKER SAMLING AF FARVESIGNAL UDEN APP-KLASSER =====
   Formål:
   - Titelramme, statusprik og valgt widget skal bruge samme farve.
   - Undgår SAFE56-metoden med app-klasser, som ødelagde load-/knapflow.
   - Bruger kun de eksisterende titel-klasser fra updateModeBadge():
     .mode-edit, .mode-present, .mode-focus, .mode-max, .mode-trash, .mode-draw.
   - CSS bruger :has(), så appens state/logik ikke ændres.
   - Hvis en browser ikke understøtter :has(), falder appen blot tilbage til SAFE58-udseende.

   Farver:
   - Rød = Redigering
   - Lys grøn = Præsentation
   - Lilla = Fokus/max
   - Gul = Tegning
   - Blød rød = Papirkurv
*/

/* Standard / redigering */
#app:has(#title.mode-edit),
#app:not(:has(#title.mode-present)):not(:has(#title.mode-focus)):not(:has(#title.mode-max)):not(:has(#title.mode-trash)):not(:has(#title.mode-draw)){
  --safe59-mode-color:#ef4444;
  --safe59-mode-glow:rgba(239,68,68,.28);
}
/* Præsentation */
#app:has(#title.mode-present){
  --safe59-mode-color:#86efac;
  --safe59-mode-glow:rgba(134,239,172,.30);
}
/* Fokus / max */
#app:has(#title.mode-focus),
#app:has(#title.mode-max){
  --safe59-mode-color:#a78bfa;
  --safe59-mode-glow:rgba(167,139,250,.32);
}
/* Papirkurv */
#app:has(#title.mode-trash){
  --safe59-mode-color:#fca5a5;
  --safe59-mode-glow:rgba(252,165,165,.26);
}
/* Tegning */
#app:has(#title.mode-draw){
  --safe59-mode-color:#facc15;
  --safe59-mode-glow:rgba(250,204,21,.28);
}

/* Titlen følger samme farve */
#app:has(#title.mode-edit) #title,
#app:has(#title.mode-present) #title,
#app:has(#title.mode-focus) #title,
#app:has(#title.mode-max) #title,
#app:has(#title.mode-trash) #title,
#app:has(#title.mode-draw) #title{
  border-color:var(--safe59-mode-color)!important;
  box-shadow:
    0 0 0 1px var(--safe59-mode-glow),
    0 0 16px var(--safe59-mode-glow),
    0 8px 18px rgba(0,0,0,.18)!important;
}

/* Statusprikken følger samme farve */
#app:has(#title.mode-edit) #modeBadge,
#app:has(#title.mode-present) #modeBadge,
#app:has(#title.mode-focus) #modeBadge,
#app:has(#title.mode-max) #modeBadge,
#app:has(#title.mode-trash) #modeBadge,
#app:has(#title.mode-draw) #modeBadge{
  background:var(--safe59-mode-color)!important;
  border:2px solid rgba(255,255,255,.96)!important;
  box-shadow:
    0 0 0 3px rgba(17,24,39,.56),
    0 0 18px var(--safe59-mode-glow)!important;
}

/* Valgt widget følger samme farve */
#app:has(#title.mode-edit) .widget.selected:not(.locked),
#app:has(#title.mode-present) .widget.selected:not(.locked),
#app:has(#title.mode-focus) .widget.selected:not(.locked),
#app:has(#title.mode-max) .widget.selected:not(.locked),
#app:has(#title.mode-trash) .widget.selected:not(.locked),
#app:has(#title.mode-draw) .widget.selected:not(.locked){
  outline:3px solid var(--safe59-mode-color)!important;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.22),
    0 0 0 5px var(--safe59-mode-glow),
    0 14px 28px rgba(0,0,0,.22)!important;
}

/* Låste valgte widgets bevarer stiplet markering, men skifter farve */
#app:has(#title.mode-edit) .widget.selected.locked,
#app:has(#title.mode-present) .widget.selected.locked,
#app:has(#title.mode-focus) .widget.selected.locked,
#app:has(#title.mode-max) .widget.selected.locked,
#app:has(#title.mode-trash) .widget.selected.locked,
#app:has(#title.mode-draw) .widget.selected.locked{
  outline:3px dashed var(--safe59-mode-color)!important;
}

/* Greb følger samme farve */
#app:has(#title.mode-edit) .widget.selected .resize,
#app:has(#title.mode-present) .widget.selected .resize,
#app:has(#title.mode-focus) .widget.selected .resize,
#app:has(#title.mode-max) .widget.selected .resize,
#app:has(#title.mode-trash) .widget.selected .resize,
#app:has(#title.mode-draw) .widget.selected .resize,
#app:has(#title.mode-edit) .widget.selected .rotater,
#app:has(#title.mode-present) .widget.selected .rotater,
#app:has(#title.mode-focus) .widget.selected .rotater,
#app:has(#title.mode-max) .widget.selected .rotater,
#app:has(#title.mode-trash) .widget.selected .rotater,
#app:has(#title.mode-draw) .widget.selected .rotater{
  border-color:var(--safe59-mode-color)!important;
  color:var(--safe59-mode-color)!important;
}

/* Fallback: hvis ingen modeklasse er sat endnu, vis redigering på prikken. */
#modeBadge{
  background:#ef4444!important;
}



/* ===== SAFE60: DIREKTE MODEFARVE-VARIABEL FRA STATUSFUNKTION =====
   Formål:
   - Prikken foran titlen skal altid matche titelramme og valgt widget.
   - SAFE59 brugte :has(), men prikken blev ikke opdateret stabilt i praksis.
   - SAFE60 sætter derfor én CSS-variabel direkte på #app fra updateModeBadge().
   - Ingen render(), select(), addWidget(), knaplogik eller widgetdata ændres.
*/
#app{
  --safe60-mode-color:#ef4444;
  --safe60-mode-glow:rgba(239,68,68,.28);
}
#title{
  border-color:var(--safe60-mode-color)!important;
  box-shadow:
    0 0 0 1px var(--safe60-mode-glow),
    0 0 16px var(--safe60-mode-glow),
    0 8px 18px rgba(0,0,0,.18)!important;
}
#modeBadge{
  background:var(--safe60-mode-color)!important;
  border:2px solid rgba(255,255,255,.96)!important;
  box-shadow:
    0 0 0 3px rgba(17,24,39,.56),
    0 0 18px var(--safe60-mode-glow)!important;
}
.widget.selected:not(.locked){
  outline:3px solid var(--safe60-mode-color)!important;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.22),
    0 0 0 5px var(--safe60-mode-glow),
    0 14px 28px rgba(0,0,0,.22)!important;
}
.widget.selected.locked{
  outline:3px dashed var(--safe60-mode-color)!important;
}
.widget.selected .resize,
.widget.selected .rotater{
  border-color:var(--safe60-mode-color)!important;
  color:var(--safe60-mode-color)!important;
}



/* ===== SAFE61: NY SIKKER STATUSPRIK INDE I TITLEN =====
   Problem: Den oprindelige #modeBadge-prik fulgte ikke stabilt samme farve som titelramme og valgt widget,
   sandsynligvis pga. ældre cascade-/override-lag.
   Løsning:
   - Skjul #modeBadge visuelt, men behold den i DOM til aria/title/statuslogik.
   - Brug #title::before som ny synlig prik.
   - Prikken bruger samme --safe60-mode-color som titelramme og valgt widget.
   - Ingen widgetlogik, render-flow, select(), addWidget() eller knaplogik ændres. */
#modeBadge{
  display:none!important;
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}
#title{
  position:absolute!important;
  padding-left:38px!important;
}
#title::before{
  content:""!important;
  position:absolute!important;
  left:14px!important;
  top:50%!important;
  transform:translateY(-50%)!important;
  width:13px!important;
  height:13px!important;
  border-radius:50%!important;
  background:var(--safe60-mode-color,#ef4444)!important;
  border:2px solid rgba(255,255,255,.95)!important;
  box-shadow:
    0 0 0 3px rgba(17,24,39,.56),
    0 0 18px var(--safe60-mode-glow,rgba(239,68,68,.28))!important;
  box-sizing:border-box!important;
  pointer-events:none!important;
}
@media(max-width:700px){
  #title{padding-left:36px!important;}
  #title::before{left:13px!important;width:12px!important;height:12px!important;}
}

   Formål:

*/
/*
Shortcut-kort: Faktiske genveje ligger i flere keydown-handlere.
Kontroller altid handleren før ændring; nogle genveje fanges i capture-fase.
Aktuelle centrale genveje i denne fil:
- P/R: skifter redigering/præsentation via TAVLE_SHORTCUTS.
- F: fokus på valgt widget, hvis API-funktionen findes.
- Shift+F: maksimer valgt/fokuseret widget, hvis API-funktionen findes.
- Cmd/Ctrl+O: widget-overblik via tidlig guard + senere overview-handler.
- T: åbner papirkurv; i papirkurv lukker T.
- Mellemrum: åbner Mere når ingen widget er valgt på normal tavle; lukker papirkurv via trash-handler; aktiverer valgt widget i særskilt Space-handler.

(function(){

  ready(function(){
    const appEl=document.getElementById('app');
    const modalBackEl=document.getElementById('modalBack');
    let modeToastTimer=null;

    function isEditableElement(el){
      return !!(el && (
        (el.matches && el.matches('input,textarea,select,[contenteditable=\"true\"]')) ||
        el.isContentEditable ||
        (el.closest && el.closest('input,textarea,select,[contenteditable=\"true\"]'))

      // Brug både event target og activeElement. På iPad/Chrome kan activeElement være ustabilt
      // ved widgets med egne pointer-/focus-lag, mens event target stadig er korrekt.
      return isEditableElement(ev && ev.target) || isEditableElement(document.activeElement);

    function modalOpen(){
      if(!modalBackEl) return false;
      const cs=getComputedStyle(modalBackEl);

      const btn=document.getElementById('present');

      plain: {

        i: {label:'Billede', widget:'i'},
        l: {label:'Link', widget:'l'},
        t: {label:'Timer', widget:'t'},
        u: {label:'Ur', widget:'u'},
        h: {label:'HTML', widget:'y'},
        j: {label:'Hjul', widget:'h'},
        r: {label:'Grupper', widget:'r'},
        s: {label:'Ordsky', widget:'s'},
        v: {label:'Video', widget:'v'},
        x: {label:'Afstemning', widget:'x'},
        q: {label:'Kahoopardy', widget:'q'},
        g: {label:'Grid', widget:'g'},
        b: {label:'Baggrund', widget:'m'},
        o: {label:'Hints til/fra', widget:'o'},
        n: {label:'Værktøjslinje til/fra (gammel)', run:()=>{
          const hidden=document.body.classList.contains('toolbar-is-hidden') || appEl.classList.contains('toolbarHidden');
          document.body.classList.toggle('toolbar-is-hidden', !hidden);
          appEl.classList.toggle('toolbarHidden', !hidden);
          try{
            if(window.UIState) window.UIState.toolbarVisible = hidden;
          }catch(_e){}
        }},
        '?': {label:'Hjælp', widget:'?'}
      }
    };
    window.TAVLE_SHORTCUTS = TAVLE_SHORTCUTS;

    function normalizeShortcutKey(e){
      const key=(e.key||'').toLowerCase();
      return (key==='?' || key==='/') ? '?' : key;
    }
    function runShortcut(e, entry, api){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();

      if(entry.run){
        entry.run(api);
        return true;
      }
      if(entry.widget && api.createShortcutWidget){
        api.createShortcutWidget(entry.widget);
        return true;
      }
      return false;
    }

    document.addEventListener('keydown',function(e){
      if(window.isIframeControlActive && window.isIframeControlActive()){
        if(e.key==='Escape' && window.clearIframeControl){
          e.preventDefault();
          window.clearIframeControl();
        }
        return;
      }
      if(e.defaultPrevented) return;
      if(isTyping(e) || modalOpen()) return;
      if((e.metaKey || e.ctrlKey) && !e.altKey){
        const modKey=normalizeShortcutKey(e);
        const api=window.tavleShortcutAPI||{};
        if(modKey==='d' && api.duplicateSelectedWidgetShortcut){
          e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
          api.duplicateSelectedWidgetShortcut();
          return;
        }
        if((modKey==='g'||modKey==='s') && api.saveShortcut){
          e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
          api.saveShortcut();
          return;

        if(modKey==='b' && typeof window.applyRandomBackgroundToActiveSlide==='function'){

            return;
          }
        }
        return;
      }
      if(e.altKey) return;

      const key=normalizeShortcutKey(e);
      const api=window.tavleShortcutAPI;

      if(!e.shiftKey && TAVLE_SHORTCUTS.plain[key]){
        runShortcut(e,TAVLE_SHORTCUTS.plain[key],api||{});
        return;
      }

      if(e.shiftKey && TAVLE_SHORTCUTS.shift[key]){
        if(!api && TAVLE_SHORTCUTS.shift[key].widget) return;
        runShortcut(e,TAVLE_SHORTCUTS.shift[key],api||{});
        return;
      }
    },true);
    const presentBtn=document.getElementById('present');

      presentBtn.__modeIndicatorWired_v108=true;
    }
  });
})();

/* v1.0.41: Isoler localStorage når Tavle kører inde i en Link-widget/iframe.
   Problemet var, at en iframe med samme origin (fx maans.github.io/Tavle inde i Tavle)
   læste de samme maans_* localStorage-nøgler som hovedappen og derfor viste samme tavle.
   Løsning: Når appen er embedded, får alle maans_* nøgler automatisk et separat scope.
   Link-widgetten tilføjer selv ?tavle_embed_scope=<widget-id> til Tavle-links, så flere
   indlejrede tavler også får hver sin lille "sandkasse". */
(function(){
  try{
    if(window.self===window.top) return;
    const params=new URLSearchParams(window.location.search||'');
    const rawScope=params.get('tavle_embed_scope') || params.get('tavleStorageScope') || 'embedded';
    const safeScope=String(rawScope).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,48) || 'embedded';
    const prefix='maans_iframe_'+safeScope+'__';
    const proto=Storage.prototype;
    if(proto.__maansTavleScopedStoragePatched) return;
    const nativeGet=proto.getItem;
    const nativeSet=proto.setItem;
    const nativeRemove=proto.removeItem;
    const nativeKey=proto.key;
    const mapKey=function(k){
      k=String(k||'');
      return /^maans_/.test(k) ? prefix+k : k;
    };
    proto.getItem=function(k){return nativeGet.call(this,mapKey(k));};
    proto.setItem=function(k,v){return nativeSet.call(this,mapKey(k),v);};
    proto.removeItem=function(k){return nativeRemove.call(this,mapKey(k));};
    proto.key=function(i){return nativeKey.call(this,i);};
    Object.defineProperty(proto,'__maansTavleScopedStoragePatched',{value:true,configurable:false});
    window.__TAVLE_IFRAME_STORAGE_SCOPE__=safeScope;
  }catch(e){
    console.warn('Tavle iframe storage-scope kunne ikke aktiveres',e);
  }
})();

    return u.origin===here.origin && norm(u.pathname)===norm(here.pathname);

   * which holds the authoritative values for these flags.  Whenever UI
   * behaviour changes (selecting a widget, entering focus/presentation, pinning
   * the toolbar), update this object and call `applyUIState()` to
   * synchronise the DOM.  This makes it much easier to reason about the
   * current mode of the application.

  const UIState = {

    // id of the currently selected widget (string), or null

   * `UIState.toolbarVisible`.  Pinning/unpinning persists to

  const Toolbar = {

 * HTML-widget preview) the inner document runs at a blob: or about:
 * origin which confuses the original detection.  To support runtime
 * configuration we expose a couple of globals on window and compute
 * whether we should apply the fallback on demand.

// Default base for assets hosted in the Tavle repository.  This value can
// be overridden by parent contexts via postMessage (see below).
const DEFAULT_TAVLE_ASSET_BASE='https://maans.github.io/Tavle/';

// otherwise fall back to the default.

// Helper to decide if the app should load assets from the remote base.
// When running from a local file the location protocol is 'file:', but
// this flag may be overridden at runtime by the parent context via
// postMessage.  See message listener below.
function isRunningFromFile(){
  // Prefer an explicitly configured value on the window.  Only accept
  // booleans to avoid overriding with undefined or strings.
  if(typeof window.RUNNING_FROM_FILE==='boolean'){
    return window.RUNNING_FROM_FILE;
  }
  return location.protocol==='file:';
}

// Asset resolver.  Given a relative path this function prefixes the
// configured base if we determine the app is running from a local file.
function resolveAssetPath(path){
  path=String(path||'').trim();
  if(!path)return '';
  // leave data:, blob:, http(s) URLs untouched
  if(/^data:/i.test(path) || /^blob:/i.test(path) || /^https?:\/\//i.test(path))return path;
  // remove leading './'
  path=path.replace(/^\.\//,'');
  const running=isRunningFromFile();
  const base=window.TAVLE_ASSET_BASE || DEFAULT_TAVLE_ASSET_BASE;
  return running ? (base + path) : path;
}

// HTML-widget preview).  When a message contains a `tavle_env` key we
// update global flags accordingly.  Only boolean values are accepted for
// RUNNING_FROM_FILE; any truthy string for TAVLE_ASSET_BASE will be used.
window.addEventListener('message',event=>{

    const env=event.data&&event.data.tavle_env;
    if(!env)return;
    if(typeof env.RUNNING_FROM_FILE==='boolean'){

    }
    if(env.TAVLE_ASSET_BASE){

    }
  }catch(_e){}
});

const clockEl=document.getElementById('globalClock');
const CLOCK_KEY='maans_tavle_clock_settings_v162';
function clockSettings(){
  try{return JSON.parse(localStorage.getItem(CLOCK_KEY)||'{}')}catch(e){return{}}
}
function saveClockSettings(s){
  localStorage.setItem(CLOCK_KEY,JSON.stringify(s));
  renderClock();
}
function renderClock(){
  if(!clockEl)return;
  const s=Object.assign({enabled:false,style:'glass',position:'bottomRight',date:true,seconds:false,format24:true,focus:false},clockSettings());
  const clockStyle=s.style||'glass';
  const clockPos=s.position||'bottomRight';
  const sceneCompact=(clockStyle==='stage' && clockPos!=='bottomCenter');
  document.body.classList.toggle('clock-focus-visible', !!s.focus);
  clockEl.className='globalClock '+(s.enabled?'':'hiddenClock')+' '+clockStyle+' clockPos-'+clockPos+(s.seconds?' clockHasSeconds':'')+(sceneCompact?' clockSceneCompact':'');
  if(!s.enabled)return;
  const now=new Date();
  if(s.style==='analog'){
    const h=now.getHours()%12, m=now.getMinutes(), sec=now.getSeconds();
    const hr=(h*30)+(m/2), mn=m*6, sc=sec*6;
    clockEl.innerHTML=`<div class="clockFace"><div class="clockHand hour" style="transform:rotate(${hr}deg)"></div><div class="clockHand min" style="transform:rotate(${mn}deg)"></div><div class="clockHand sec" style="transform:rotate(${sc}deg)"></div><div class="clockDot"></div></div>`;
    return;
  }
  const opts={hour:'2-digit',minute:'2-digit',hour12:!s.format24};
  if(s.seconds)opts.second='2-digit';
  const time=now.toLocaleTimeString('da-DK',opts);
  const date=s.date?now.toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short'}):'';
  clockEl.innerHTML=`<div class="clockTime">${time}</div>${date?`<div class="clockDate">${date}</div>`:''}`;
}

function clockPreviewHTML(s){
  const tmp=Object.assign({enabled:true,style:'glass',position:'bottomRight',date:true,seconds:false,format24:true,focus:false},s||{});
  const now=new Date();
  if(tmp.style==='analog'){
    const h=now.getHours()%12, m=now.getMinutes(), sec=now.getSeconds();
    const hr=(h*30)+(m/2), mn=m*6, sc=sec*6;
    return `<div class="globalClock analog"><div class="clockFace"><div class="clockHand hour" style="transform:rotate(${hr}deg)"></div><div class="clockHand min" style="transform:rotate(${mn}deg)"></div><div class="clockHand sec" style="transform:rotate(${sc}deg)"></div><div class="clockDot"></div></div></div>`;
  }
  const opts={hour:'2-digit',minute:'2-digit',hour12:!tmp.format24};
  if(tmp.seconds)opts.second='2-digit';
  const time=now.toLocaleTimeString('da-DK',opts);
  const date=tmp.date?now.toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short'}):'';
  const previewStyle=tmp.style||'glass';
  const previewPos=tmp.position||'bottomRight';
  const previewCompact=(previewStyle==='stage' && previewPos!=='bottomCenter');
  return `<div class="globalClock ${previewStyle} clockPos-${previewPos}${tmp.seconds?' clockHasSeconds':''}${previewCompact?' clockSceneCompact':''}"><div class="clockTime">${time}</div>${date?`<div class="clockDate">${date}</div>`:''}</div>`;
}

    if(p)p.innerHTML=clockPreviewHTML({...current,enabled:true});
    modal.querySelectorAll('[data-clock-style]').forEach(b=>b.classList.toggle('active',b.dataset.clockStyle===(current.style||'glass')));
    modal.querySelectorAll('[data-clock-position]').forEach(b=>b.classList.toggle('active',b.dataset.clockPosition===(current.position||'bottomRight')));

  modal.querySelector('#clockEnabled').onchange=e=>saveClockSettings({...clockSettings(),enabled:e.target.checked});
  modal.querySelector('#clockDate').onchange=e=>{saveClockSettings({...clockSettings(),date:e.target.checked});refreshPreview()};
  modal.querySelector('#clockSeconds').onchange=e=>{saveClockSettings({...clockSettings(),seconds:e.target.checked});refreshPreview()};
  modal.querySelector('#clock24').onchange=e=>{saveClockSettings({...clockSettings(),format24:e.target.checked});refreshPreview()};
  modal.querySelector('#clockFocus').onchange=e=>{saveClockSettings({...clockSettings(),focus:e.target.checked});refreshPreview()};

/* Tavlehjælpere: slide() bruger state.active. Papirkurven er også en slide i state, men må ikke behandles som normal brugertavle. */
function uid(){return Math.random().toString(36).slice(2,10)}
function slide(){return state.slides[state.active]}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}

function shouldWarnAboutLocalSave(){
  try{
    if(window.__suppressInitialSaveWarning)return false;
    if(window.__userHasInteracted)return true;
    const sls=(state&&state.slides)||[];
    const widgetCount=sls.reduce((n,sl)=>n+((sl.widgets||[]).length),0);
    return widgetCount>0;
  }catch(e){return false}
}

  add('utf-8',new TextDecoder('utf-8',{fatal:false}).decode(bytes));

  try{add('iso-8859-1',new TextDecoder('iso-8859-1',{fatal:false}).decode(bytes));}catch(_e){}

// Parse a delimited text file into a dataset object.  If a header row is
// present the first row will be used as column names.  Otherwise columns
// are named generically (col1, col2, ...).  A best-effort delimiter
// detection is performed: tab, semicolon or comma.
function parseDatasetFromText(text,name){
  text=String(text||'');
  // remove BOM
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(!lines.length){return null;}
  // guess delimiter based on first non-empty line
  let delim=',';
  const first=lines[0];
  const counts={comma:(first.match(/,/g)||[]).length, semicolon:(first.match(/;/g)||[]).length, tab:(first.match(/\t/g)||[]).length};
  const maxDelim=Object.entries(counts).reduce((a,b)=>a[1]>=b[1]?a:b);
  if(maxDelim[1]>0){if(maxDelim[0]==='tab') delim='\t'; else if(maxDelim[0]==='semicolon') delim=';'; else delim=',';}
  // simple CSV parser: split on delimiter outside of quotes.  Quotes may
  // contain escaped quotes.
  function splitLine(line){
    const arr=[];
    let cur='';
    let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(inQuotes && line[i+1]==='"'){cur+= '"'; i++; continue;}
        inQuotes=!inQuotes;
        continue;
      }
      if(!inQuotes && ch===delim){arr.push(cur);cur='';continue;}
      cur+=ch;
    }
    arr.push(cur);
    return arr;
  }
  const rows=lines.map(splitLine);
  let columns=[];
  // check if first row is header: treat as header if all cells are non-empty strings and not all numeric
  const headerCandidate=rows[0];
  const numericCells=headerCandidate.filter(c=>/^\s*-?\d+(\.\d+)?\s*$/.test(c)).length;
  const isHeader=numericCells< headerCandidate.length/2;
  if(isHeader){
    columns=headerCandidate.map(c=>String(c||'').trim()||'Kolonne');
    rows.shift();
  }else{
    const maxLen=Math.max(...rows.map(r=>r.length));
    columns=Array.from({length:maxLen},(_,i)=>'Kolonne '+(i+1));
  }
  // normalize rows length
  const normalized=rows.map(r=>{
    const arr=Array.from({length:columns.length},(_,i)=>String(r[i]||'').trim());
    return arr;
  });
  return {
    id:'ds'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name: name || 'Datasæt',
    type:'csv',
    columns:columns,
    rows:normalized,
    sourceName:name||'',
    importedAt:Date.now()
  };
}

async function parseXlsxDatasetFile(file){
  if(/\.xls$/i.test(file.name||'') && !/\.xlsx$/i.test(file.name||''))throw new Error('Ældre Excel-format (.xls) understøttes ikke endnu. Gem filen som .xlsx.');
  const zip=tavleZipEntries(await file.arrayBuffer());
  const sheetName=Object.keys(zip).sort().find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));
  if(!sheetName)throw new Error('Kunne ikke finde første ark i regnearket');
  const sharedXml=await tavleInflateZipEntry(zip['xl/sharedStrings.xml']).catch(()=> '');
  const shared=[];
  sharedXml.replace(/<si[\s\S]*?<\/si>/g,si=>{let text='';si.replace(/<t[^>]*>([\s\S]*?)<\/t>/g,(_,t)=>{text+=tavleDecodeXmlEntities(t)});shared.push(text);return si});
  const sheetXml=await tavleInflateZipEntry(zip[sheetName]);
  const rows=[];
  sheetXml.replace(/<row[^>]*>[\s\S]*?<\/row>/g,rowXml=>{
    const row=[];
    rowXml.replace(/<c([^>]*)>([\s\S]*?)<\/c>/g,(_,attrs,body)=>{
      const ref=(attrs.match(/\sr="([^"]+)"/)||[])[1]||'';
      const t=(attrs.match(/\st="([^"]+)"/)||[])[1]||'';
      const idx=ref?xlsxColToIndex(ref):row.length;
      let v='';
      const m=body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
      const im=body.match(/<is[\s\S]*?<t[^>]*>([\s\S]*?)<\/t>[\s\S]*?<\/is>/);
      if(t==='s'&&m)v=shared[Number(m[1])]||'';
      else if(im)v=tavleDecodeXmlEntities(im[1]);
      else if(m)v=tavleDecodeXmlEntities(m[1]);
      row[idx]=String(v==null?'':v).trim();
      return _;
    });
    if(row.some(x=>String(x||'').trim()))rows.push(row.map(x=>x||''));
    return rowXml;
  });
  if(!rows.length)return null;
  const maxLen=Math.max(...rows.map(r=>r.length));
  const first=Array.from({length:maxLen},(_,i)=>String(rows[0][i]||'').trim());
  const numeric=first.filter(c=>/^\s*-?\d+(\.\d+)?\s*$/.test(c)).length;
  const hasHeader=numeric<first.filter(Boolean).length/2;
  const columns=hasHeader?first.map((c,i)=>c||('Kolonne '+(i+1))):Array.from({length:maxLen},(_,i)=>'Kolonne '+(i+1));
  const dataRows=(hasHeader?rows.slice(1):rows).map(r=>Array.from({length:columns.length},(_,i)=>String(r[i]||'').trim()));
  return {id:'ds'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:(file.name||'Datasæt').replace(/\.[^.]+$/,''),type:'xlsx',columns,rows:dataRows,sourceName:file.name||'',importedAt:Date.now()};
}

  return {

  };

async function handleDroppedFile(file,point){
  // Dataset import: support CSV and TSV files.  When a delimited text
  // file is dropped we parse it into a dataset and store it centrally
  // instead of creating a widget.  Datasets can later be used by
  // widgets such as the Wheel or Group generator.  Excel files are
  // ignored here; they can be imported via the existing list import UI.
  if(isLikelyGoogleSheetRef(file)){
    return {ok:false,kind:'error',label:'.gsheet er kun en Google Sheets-reference – eksportér som CSV først'};
  }
  if(isLikelyXlsxFile(file)){
    try{
      const ds=await parseXlsxDatasetFile(file);
      if(!ds || !Array.isArray(ds.rows) || !ds.rows.length)return {ok:false,kind:'error',label:'Kunne ikke læse Excelark: ingen rækker fundet'};
      addDataset(ds);
      addDatasetWidget(ds,point);
      toast('Excelark importeret: '+(ds.name||'')+' ('+ds.rows.length+' rækker)');
      return {ok:true,kind:'dataset',label:(ds.name||'Datasæt')+' · '+ds.rows.length+' rækker'};
    }catch(err){
      console.error(err);
      return {ok:false,kind:'error',label:'Kunne ikke læse Excelark: '+(err&&err.message||'ukendt fejl')};
    }
  }
  if(isLikelyCsvFile(file) || isLikelyTsvFile(file)){
    try{
      const text=await readFileAsText(file);
      const ds=parseDatasetFromText(text,(file.name||'Datasæt').replace(/\.[^.]+$/,''));
      if(!ds || !Array.isArray(ds.rows) || !ds.rows.length)return {ok:false,kind:'error',label:'Kunne ikke parse CSV: ingen rækker fundet'};
      addDataset(ds);
      addDatasetWidget(ds,point);
      toast('Datasæt importeret: '+(ds.name||'')+' ('+ds.rows.length+' rækker)');
      return {ok:true,kind:'dataset',label:(ds.name||'Datasæt')+' · '+ds.rows.length+' rækker'};
    }catch(err){
      console.error(err);
      return {ok:false,kind:'error',label:'Kunne ikke parse CSV: '+(err&&err.message||'ukendt fejl')};
    }
  }
  if(isLikelyImageFile(file)){
    const src=await readFileAsDataURL(file);
    addDroppedWidget('image',{src,name:file.name||'billede'},point,file.name||'Billede');
    toast('Billede indsat');
    return {ok:true,kind:'image',label:file.name||'Billede'};
  }
  if(isLikelyPdfFile(file)){
    const src=await readFileAsDataURL(file);
    addDroppedWidget('pdf',{src,url:src,name:file.name||'PDF',page:1},point,file.name||'PDF');
    toast('PDF indsat');
    return {ok:true,kind:'pdf',label:file.name||'PDF'};
  }
  if(isLikelyHtmlFile(file)){
    const htmlText=await readFileAsText(file);
    addDroppedWidget('html',{html:htmlText,mode:'preview',name:file.name||'HTML'},point,file.name||'HTML');
    toast('HTML åbnet i webvisning');
    return {ok:true,kind:'html',label:file.name||'HTML'};
  }
  if(isLikelyTextFile(file)){
    const text=await readFileAsText(file);
    addDroppedWidget('text',{text,name:file.name||'tekstfil'},point,file.name||'Tekst');
    toast('Tekst indsat');
    return {ok:true,kind:'text',label:file.name||'Tekst'};
  }
  toast('Filtypen understøttes ikke endnu');
  return {ok:false,kind:'error',label:'Filtypen understøttes ikke endnu: '+(file.name||'ukendt fil')};
}
function handleDroppedUrlOrText(raw,point){
  const text=String(raw||'').trim();
  if(!text)return false;
  const urlMatch=text.match(/https?:\/\/[^\s<>"']+/i) || text.match(/(?:youtu\.be|youtube\.com)\/[^\s<>"']+/i);
  const maybeUrl=urlMatch ? urlMatch[0] : text;

    toast('YouTube-video indsat');
    return {ok:true,kind:'video',label:'YouTube-video'};
  }

  }
  return false;
}
function filesFromDataTransfer(dt){

        if(f && !out.some(x=>x.name===f.name && x.size===f.size && x.type===f.type)) out.push(f);

}

function extFromDataUrl(dataUrl,fallback='bin'){
  const m=String(dataUrl||'').match(/^data:([^;,]+)/);
  const type=m?m[1]:'';
  if(type.includes('pdf'))return 'pdf';
  if(type.includes('png'))return 'png';
  if(type.includes('jpeg')||type.includes('jpg'))return 'jpg';
  if(type.includes('webp'))return 'webp';
  if(type.includes('gif'))return 'gif';
  if(type.includes('svg'))return 'svg';
  if(type.includes('html'))return 'html';
  if(type.includes('plain'))return 'txt';
  return fallback;
}
function safeFileName(name,ext){
  name=String(name||'fil').replace(/[\\/:*?"<>|]+/g,'-').trim()||'fil';
  if(ext && !name.toLowerCase().endsWith('.'+ext))name+='.'+ext;
  return name;
}
function safeDownload(filename, content, mime){
  filename=safeFileName(filename||'download','');
  mime=mime||'application/octet-stream';
  try{
    const blob = (content instanceof Blob) ? content : new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(e){}; try{a.remove()}catch(e){}},1200);
    return true;
  }catch(err){
    try{
      const a=document.createElement('a');
      a.href='data:'+mime+','+encodeURIComponent(String(content||''));
      a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      return true;
    }catch(e){toast('Download blev blokeret'); return false;}
  }
}
function dataUrlToBlob(dataUrl){
  const m=String(dataUrl||'').match(/^data:([^;,]+)?((?:;[^,]+)*),(.*)$/s);
  if(!m)throw new Error('Ikke en data-url');
  const mime=m[1]||'application/octet-stream';
  const meta=m[2]||'';
  const body=m[3]||'';
  let bytes;
  if(/;base64/i.test(meta)){
    const bin=atob(body); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    bytes=arr;
  }else{
    bytes=decodeURIComponent(body);
  }
  return new Blob([bytes],{type:mime});
}
function downloadDataUrl(dataUrl,filename){
  if(!dataUrl||!String(dataUrl).startsWith('data:')){toast('Mediet er ikke indlejret og kan ikke downloades herfra');return}
  try{
    const ext=extFromDataUrl(dataUrl);
    const blob=dataUrlToBlob(dataUrl);
    safeDownload(safeFileName(filename||'medie',ext), blob, blob.type||'application/octet-stream');
  }catch(e){
    const ext=extFromDataUrl(dataUrl);
    safeDownload(safeFileName(filename||'medie',ext), String(dataUrl), 'text/plain;charset=utf-8');
  }
}

let __pdfJsLoadPromise=null;
function ensurePdfJs(){

    const existing=document.querySelector('script[data-pdfjs-loader="1"]');
    if(existing){existing.addEventListener('load',()=>resolve(window.pdfjsLib));existing.addEventListener('error',reject);return}
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

function wordCloudTextToNames(txt){
  // Accepter både linjer og kompakt liste adskilt med komma/semikolon.
  return String(txt||'')
    .split(/\n|,|;/)
    .map(x=>x.trim())
    .filter(Boolean);
}
function namesToCompactWordCloudText(names){
  // Emoji-lister bliver meget mere læsbare vandret.
  const arr=(names||[]).map(x=>String(x||'').trim()).filter(Boolean);
  const mostlyShort=arr.length && arr.every(x=>[...x].length<=3);
  return mostlyShort ? arr.join(' ') : arr.join('\n');

function wordCloudTextToNamesSmart(txt){
  const s=String(txt||'').trim();
  if(!s)return [];
  // Hvis der er linjer/komma/semikolon, brug dem som separator.
  if(/[\n,;]/.test(s))return wordCloudTextToNames(s);
  // Hvis det ligner emojis/korte tokens fra afstemning, split på mellemrum.
  const parts=s.split(/\s+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1 && parts.every(x=>[...x].length<=3))return parts;
  return [s];
}

function clearStuckInteractionState(){
  // Some iPad/browser resume cases leave pointer capture or gesture flags stale.
  // We cannot reach the local drag/res/rot variables here, but a synthetic
  // pointercancel plus toolbar/app cleanup prevents most stuck UI states.
  try{
    document.querySelectorAll('.widget,.chrome,.resize,.rotater').forEach(el=>{
      try{ el.releasePointerCapture && [...(el.__activePointers||[])].forEach(id=>el.releasePointerCapture(id)); }catch(_e){}
    });
  }catch(_e){}
  document.body.classList.remove('toolbar-is-hidden');
  try{app.classList.remove('toolbarHidden')}catch(_e){}
}

function buildWordCloudItems(names,caseInsensitive=true){
  const counts=new Map();
  (names||[]).map(x=>String(x||'').trim()).filter(Boolean).forEach(line=>{
    const key=caseInsensitive?line.toLocaleLowerCase('da'):line;
    if(!counts.has(key))counts.set(key,{label:line,count:0,variants:{}});
    const item=counts.get(key);
    item.count++;
    item.variants[line]=(item.variants[line]||0)+1;
    // Vis den mest brugte variant af store/små bogstaver.
    item.label=Object.entries(item.variants).sort((a,b)=>b[1]-a[1])[0][0];
  });
  const items=[...counts.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'da'));
  const max=items[0]?.count||1;
  return items.map(it=>{
    const scale=it.count/max;
    return {...it,size:14+scale*38,weight:400+Math.round(scale*500),opacity:.62+scale*.38};
  });
}
function renderWordCloud(w){
  const items=buildWordCloudItems(w.data.names||[],w.data.caseInsensitive!==false);

  return items.map(it=>`<span data-count="${esc(it.count)}" data-label="${esc(it.label)}" title="${esc(it.count+' gange')}" style="font-size:${it.size}px;font-weight:${it.weight};opacity:${it.opacity}">${esc(it.label)}</span>`).join('');
}

function kahoopardyDefaults(){return {mode:'kahoot',currentQuestion:0,currentTeam:0,teams:[{name:'Hold 1',score:0,correct:0},{name:'Hold 2',score:0,correct:0}],questions:[{category:'Demo',question:'Hvad hedder hovedpersonen?',answer:'Måns',correctIndex:0,points:100,options:['Måns','Mette','Marie','Mads']}],selections:{},awarded:{},autoAwarded:{},optionOrders:{},usedQuestions:{},reveal:false,stage:'question',editing:true};}
function normalizeKahoopardy(w){
  w.data=Object.assign(kahoopardyDefaults(),w.data||{});
  if(!Array.isArray(w.data.teams)||!w.data.teams.length)w.data.teams=kahoopardyDefaults().teams;
  if(!Array.isArray(w.data.questions)||!w.data.questions.length)w.data.questions=kahoopardyDefaults().questions;
  w.data.questions=w.data.questions.map(q=>{
    q=Object.assign({category:'Quiz',question:'Spørgsmål',points:100,options:['Svar 1','Svar 2','Svar 3','Svar 4']},q||{});
    q.options=(q.options||[]).slice(0,4); while(q.options.length<4)q.options.push('Svar '+(q.options.length+1));
    let ci=Number.isFinite(Number(q.correctIndex))?Number(q.correctIndex):-1;
    if(ci<0||ci>3){ci=q.options.findIndex(o=>String(o).trim()===String(q.answer||'').trim());}
    if(ci<0||ci>3)ci=0;
    q.correctIndex=ci;
    q.answer=q.options[ci]||q.answer||q.options[0]||'';
    q.points=Number(q.points)||100;
    return q;
  });
  w.data.currentQuestion=Math.max(0,Math.min(Number(w.data.currentQuestion)||0,w.data.questions.length-1));
  w.data.currentTeam=(w.data.currentTeam===-1)?-1:Math.max(0,Math.min(Number(w.data.currentTeam)||0,w.data.teams.length-1));
  w.data.selections=w.data.selections||{};w.data.awarded=w.data.awarded||{};w.data.autoAwarded=w.data.autoAwarded||{};w.data.optionOrders=w.data.optionOrders||{};w.data.usedQuestions=w.data.usedQuestions||{};w.data.mode=(w.data.mode==='jeopardy'||w.data.mode==='master')?w.data.mode:'kahoot';w.data.stage=w.data.stage||'question';
}
function currentKahoopardyQuestion(w){normalizeKahoopardy(w);return w.data.questions[w.data.currentQuestion]||kahoopardyDefaults().questions[0];}
function kahoopardyCSV(w){normalizeKahoopardy(w);return ['Kategori,Spørgsmål,Point,Korrekt,Mulighed1,Mulighed2,Mulighed3,Mulighed4'].concat((w.data.questions||[]).map(q=>[q.category,q.question,q.points,(Number(q.correctIndex)||0)+1].concat((q.options||[]).slice(0,4)).map(kahoopardyCSVCell).join(','))).join('\n');}
function kahoopardyCSVCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function parseKahoopardyCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q&&ch==='"'&&line[i+1]==='"'){cur+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){out.push(cur.trim());cur='';continue}cur+=ch}out.push(cur.trim());return out;}
function parseKahoopardyCSV(text){const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length&&/^kategori\s*,/i.test(lines[0]))lines.shift();const qs=lines.map(parseKahoopardyCSVLine).filter(r=>r.length>=7).map(r=>{let oldFormat=r.length>=8&&!/^\d+$/.test(r[3]);let opts=oldFormat?[r[4],r[5],r[6],r[7]]:[r[4],r[5],r[6],r[7]];let answer=oldFormat?r[2]:'';let ci=oldFormat?opts.findIndex(x=>String(x).trim()===String(answer).trim()):(Number(r[3])-1);if(ci<0||ci>3)ci=0;return {category:r[0]||'Quiz',question:r[1]||'Spørgsmål',points:Number(oldFormat?r[3]:r[2])||100,correctIndex:ci,answer:opts[ci]||'',options:opts.map(x=>String(x||'').trim()).slice(0,4)}}).filter(q=>q.question&&q.options.length===4&&q.options.every(Boolean));if(!qs.length)throw new Error('Ingen gyldige spørgsmål. Brug tabellen i editoren.');return qs;}
function kahoopardyCorrectIndex(q){let ci=Number(q&&q.correctIndex); if(!Number.isFinite(ci)||ci<0||ci>3){ci=(q.options||[]).findIndex(o=>String(o).trim()===String(q.answer||'').trim());} return (ci>=0&&ci<=3)?ci:0;}

function kahoopardySplitDelimitedLine(line,delim){
  if(delim==='\t')return String(line||'').split('\t').map(x=>x.trim());
  return parseKahoopardyCSVLine(String(line||''));
}
function kahoopardyImportQuestionsFromText(text){
  text=String(text||'').trim();
  if(!text)throw new Error('Importfilen er tom.');
  const lines=text.split(/\r?\n/).filter(x=>String(x).trim());
  if(!lines.length)throw new Error('Importfilen er tom.');
  const delim=(lines[0].indexOf('\t')>=0)?'\t':',';
  const header=kahoopardySplitDelimitedLine(lines[0],delim).map(h=>String(h||'').trim().toLowerCase());
  const hasHeader=header.some(h=>['kategori','spørgsmål','sporgsmal','question','point','points','rigtigt svar','korrekt svar'].includes(h));
  if(!hasHeader)return parseKahoopardyCSV(text);
  const idx=(names)=>{for(const n of names){const i=header.indexOf(n);if(i>=0)return i;}return -1;};
  const iCat=idx(['kategori','category']);
  const iQ=idx(['spørgsmål','sporgsmal','question','spørgsmaal']);
  const iPts=idx(['point','points']);
  const iRight=idx(['rigtigt svar','korrekt svar','svar','answer','mulighed 1','rigtig']);
  const iW1=idx(['forkert svar 1','forkert 1','mulighed 2','wrong 1']);
  const iW2=idx(['forkert svar 2','forkert 2','mulighed 3','wrong 2']);
  const iW3=idx(['forkert svar 3','forkert 3','mulighed 4','wrong 3']);
  if(iQ<0||iRight<0)throw new Error('Importen skal mindst have kolonnerne Spørgsmål og Rigtigt svar.');
  const qs=[];
  for(let li=1;li<lines.length;li++){
    const r=kahoopardySplitDelimitedLine(lines[li],delim);
    const val=i=>i>=0?String(r[i]||'').trim():'';
    const opts=[val(iRight),val(iW1)||'Forkert svar 1',val(iW2)||'Forkert svar 2',val(iW3)||'Forkert svar 3'];
    const q={category:val(iCat)||'Quiz',question:val(iQ)||'Spørgsmål',points:Number(val(iPts))||100,correctIndex:0,answer:opts[0],options:opts};
    if(q.question&&opts[0])qs.push(q);
  }
  if(!qs.length)throw new Error('Ingen gyldige spørgsmål fundet i importen.');
  return qs;
}

function kahoopardyFindNextUnused(w,start){

function kahoopardyJeopardyCardStyle(catIndex,points,minPoint,maxPoint,used){
  const p=Number(points)||0;
  const min=Number(minPoint)||p;
  const max=Number(maxPoint)||p;
  const range=Math.max(1,max-min);
  const t=Math.max(0,Math.min(1,(p-min)/range));
  const hue=(215 + (Number(catIndex)||0)*58)%360;
  const sat=Math.round(60 + t*25);
  const light=Math.round(31 + t*7);
  const light2=Math.round(22 + t*5);
  const borderLight=Math.round(58 + t*14);
  const shadow=0.16 + t*0.16;
  if(used)return '';
  return ` style="background:linear-gradient(135deg,hsl(${hue} ${sat}% ${light}%),hsl(${(hue+18)%360} ${Math.max(52,sat-8)}% ${light2}%));box-shadow:0 8px 18px rgba(0,0,0,.22), inset 0 0 0 ${1+t*2}px hsl(${hue} 84% ${borderLight}% / .34), 0 0 ${Math.round(4+t*12)}px hsl(${hue} 90% 55% / ${shadow});filter:saturate(${(0.92+t*0.28).toFixed(2)}) brightness(${(0.94+t*0.08).toFixed(2)});"`;
}

function kahoopardyJeopardyBoardHtml(w){
  normalizeKahoopardy(w);

  (w.data.questions||[]).forEach((q,i)=>{

    let g=cats.find(x=>x.name===name); if(!g){g={name,items:[]};cats.push(g);}
    g.items.push({q,i,points:Number(q.points)||100});
  });
  // Klassisk Jeopardy-board: kategorier som faste kolonne-headers,
  // og pointkort sorteret med laveste point øverst og højeste nederst.
  cats.forEach(g=>g.items.sort((a,b)=>a.points-b.points||a.i-b.i));
  const colCount=Math.max(1,cats.length);
  const maxRows=Math.max(1,...cats.map(g=>g.items.length));
  const available=[];
  cats.forEach(g=>g.items.forEach(it=>{if(!(w.data.usedQuestions&&w.data.usedQuestions[it.i]))available.push(it.i);}));
  if(!available.length)w.data.jeopardyFocus=-1;
  else if(!available.includes(Number(w.data.jeopardyFocus)))w.data.jeopardyFocus=available[0];
  const activeTeam=(w.data.teams[w.data.currentTeam]||{}).name||'Hold';
  const cols=cats.map((g,catIndex)=>{
    const pts=g.items.map(it=>Number(it.points)||0);
    const minPoint=Math.min(...pts);
    const maxPoint=Math.max(...pts);
    let inner=`<div class="kahoopardyJeopardyCat" title="${esc(g.name)}" style="--catHue:${(215+catIndex*58)%360}">${esc(g.name)}</div>`;
    for(let r=0;r<maxRows;r++){
      const it=g.items[r];
      if(!it){inner+=`<div class="kahoopardyJeopardyBlank"></div>`;continue;}
      const used=!!(w.data.usedQuestions&&w.data.usedQuestions[it.i]);
      inner+=`<button type="button" class="kahoopardyJeopardyCard ${used?'used':''} ${Number(w.data.jeopardyFocus)===it.i?'focused':''}" data-question="${it.i}" ${used?'disabled aria-disabled="true"':''}${kahoopardyJeopardyCardStyle(catIndex,it.points,minPoint,maxPoint,used)}>${it.points}</button>`;
    }
    return `<div class="kahoopardyJeopardyCol" style="--jp-rows:${maxRows}">${inner}</div>`;
  }).join('');
  const style=`grid-template-columns:repeat(${colCount},minmax(0,1fr));`;
  const done=kahoopardyAllJeopardyUsed(w);
  const banner=done?'Alle pointkort er brugt':`${esc(activeTeam)} vælger kategori og point`;
  const primary=done?'<button type="button" class="jeopardyToScore next">Stilling</button><button type="button" class="playAgain secondary">Spil igen</button>':'';
  return `<div class="kahoopardyJeopardy"><div class="kahoopardyJeopardyTurnBanner ${done?'kahoopardyJeopardyDone':''}">${banner}</div><div class="kahoopardyJeopardyGrid jeopardyColumns" style="${style}">${cols}</div>${kahoopardyActionBarHtml(w,primary)}</div>`;
}

function kahoopardyShuffle(arr){
  arr=arr.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
function kahoopardyOptionOrder(w){
  normalizeKahoopardy(w);
  const qKey=String(w.data.currentQuestion);
  w.data.optionOrders=w.data.optionOrders||{};
  let order=w.data.optionOrders[qKey];
  if(!Array.isArray(order)||order.length!==4||order.some(x=>![0,1,2,3].includes(Number(x)))){
    order=kahoopardyShuffle([0,1,2,3]);
    w.data.optionOrders[qKey]=order;
  }
  return order.map(Number);
}
function kahoopardyResetQuestionRound(w,qIndex){
  normalizeKahoopardy(w);
  const qKey=String(qIndex);
  if(w.data.selections)delete w.data.selections[qKey];
  if(w.data.awarded)delete w.data.awarded[qKey];
  if(w.data.autoAwarded)delete w.data.autoAwarded[qKey];
  if(w.data.optionOrders)delete w.data.optionOrders[qKey];
}
function kahoopardyApplyAwardsFromSelections(w){

  const q=currentKahoopardyQuestion(w), qKey=String(w.data.currentQuestion), ci=kahoopardyCorrectIndex(q), pts=Number(q.points)||100;
  w.data.selections[qKey]=w.data.selections[qKey]||{}; w.data.awarded[qKey]=w.data.awarded[qKey]||{};
  (w.data.teams||[]).forEach((t,i)=>{
    if(w.data.selections[qKey][i]===ci && !w.data.awarded[qKey][i]){
      t.score=(Number(t.score)||0)+pts;

function kahoopardyFindColumnIndex(cols,names){
  cols=(cols||[]).map(c=>String(c||'').trim().toLowerCase());
  for(const n of names){const i=cols.indexOf(String(n).trim().toLowerCase());if(i>=0)return i;}
  return -1;
}
function kahoopardyQuestionsFromDataset(ds){
  if(!ds||!Array.isArray(ds.rows))throw new Error('Datasættet kunne ikke læses.');
  const cols=Array.isArray(ds.columns)?ds.columns:[];
  const iCat=kahoopardyFindColumnIndex(cols,['kategori','category']);
  const iQ=kahoopardyFindColumnIndex(cols,['spørgsmål','sporgsmal','spørgsmaal','question']);
  const iPts=kahoopardyFindColumnIndex(cols,['point','points']);
  const iRight=kahoopardyFindColumnIndex(cols,['rigtigt svar','korrekt svar','svar','answer','mulighed 1','rigtig']);
  const iW1=kahoopardyFindColumnIndex(cols,['forkert svar 1','forkert 1','mulighed 2','wrong 1']);
  const iW2=kahoopardyFindColumnIndex(cols,['forkert svar 2','forkert 2','mulighed 3','wrong 2']);
  const iW3=kahoopardyFindColumnIndex(cols,['forkert svar 3','forkert 3','mulighed 4','wrong 3']);
  if(iQ<0||iRight<0)throw new Error('Datawidgetten skal have mindst Spørgsmål og Rigtigt svar.');
  const qs=[];
  (ds.rows||[]).forEach(r=>{
    r=Array.isArray(r)?r:[];
    const val=i=>i>=0?String(r[i]??'').trim():'';
    const opts=[val(iRight),val(iW1)||'Forkert svar 1',val(iW2)||'Forkert svar 2',val(iW3)||'Forkert svar 3'];
    const q={category:val(iCat)||'Quiz',question:val(iQ)||'Spørgsmål',points:Number(val(iPts))||100,correctIndex:0,answer:opts[0],options:opts};
    if(q.question&&opts[0])qs.push(q);
  });
  if(!qs.length)throw new Error('Ingen gyldige KahooPardy-spørgsmål i datawidgetten.');
  return qs;
}
function kahoopardyDatasetLooksUseful(ds){
  try{ kahoopardyQuestionsFromDataset(ds); return true; }catch(_e){ return false; }
}

function wireKahoopardy(c,w,el){
  c.querySelectorAll('button').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.stopPropagation(),{passive:true});
    b.addEventListener('click',e=>e.stopPropagation());
  });
  c.querySelectorAll('.kahoopardyTable input[type="text"], .kahoopardyTable input:not([type])').forEach(inp=>{
    inp.addEventListener('focus',()=>setTimeout(()=>{try{inp.select()}catch(_e){}},0));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const tr=inp.closest('tr');
        const field=inp.getAttribute('data-field');
        const rows=[...c.querySelectorAll('.kahoopardyTable tbody tr')];
        const ri=rows.indexOf(tr);
        const dir=e.shiftKey?-1:1;
        let next=null;
        for(let step=1;step<=rows.length;step++){
          const row=rows[(ri+dir*step+rows.length)%rows.length];
          next=row&&row.querySelector(`[data-field="${field}"]`);
          if(next&&!next.disabled)break;
        }
        if(!next){
          const fields=[...c.querySelectorAll('.kahoopardyTable input')].filter(x=>!x.disabled);
          const idx=fields.indexOf(inp); next=fields[idx+1]||fields[0];
        }
        if(next){next.focus(); if(next.select) setTimeout(()=>next.select(),0);}
      }
    });
  });
  const rerender=()=>{save();renderKahoopardy(el,w);};
  const add=c.querySelector('.kahoopardyAddTeam');
  if(add)add.onclick=e=>{e.preventDefault();normalizeKahoopardy(w);const n=w.data.teams.length+1;w.data.teams.push({name:'Hold '+n,score:0,correct:0});rerender();};
  c.querySelectorAll('.kahoopardyOption').forEach(btn=>btn.onclick=e=>{
    e.preventDefault();
    normalizeKahoopardy(w);
    if(w.data.reveal||kahoopardyAllAnswered(w))return;
    const qKey=String(w.data.currentQuestion);
    w.data.selections[qKey]=w.data.selections[qKey]||{};
    w.data.selections[qKey][w.data.currentTeam]=Number(btn.dataset.option);
    let next=-1;
    for(let i=0;i<w.data.teams.length;i++){
      const cand=(w.data.currentTeam+1+i)%w.data.teams.length;
      if(w.data.selections[qKey][cand]===undefined){next=cand;break;}
    }
    w.data.currentTeam=next;
    rerender();
  });
  const reveal=c.querySelector('.revealAnswer');
  if(reveal)reveal.onclick=e=>{e.preventDefault();w.data.reveal=true;w.data.currentTeam=-1;kahoopardyAutoAwardCorrect(w);kahoopardyDing();rerender();};

  function finishMaster(kind){
    normalizeKahoopardy(w);
    const qi=w.data.currentQuestion, q=currentKahoopardyQuestion(w), pts=Number(q.points)||100, ti=Math.max(0,Math.min(Number(w.data.currentTeam)||0,w.data.teams.length-1));

    w.data.awarded=w.data.awarded||{};w.data.awarded[String(qi)]=w.data.awarded[String(qi)]||{};
    const add=kind==='correct'?pts:(kind==='half'?Math.round(pts/2):0);
    if(add&&w.data.teams[ti]&&!w.data.awarded[String(qi)][ti]){
      w.data.teams[ti].score=(Number(w.data.teams[ti].score)||0)+add;
      w.data.teams[ti].correct=(Number(w.data.teams[ti].correct)||0)+(kind==='half'?0.5:1);
      w.data.awarded[String(qi)][ti]=true;
      kahoopardyApplause();
    }else{kahoopardyDing();}
    w.data.currentTeam=(ti+1)%Math.max(1,(w.data.teams||[]).length);
    w.data.stage='score';w.data.reveal=false;
    rerender();
  }
  const mc=c.querySelector('.masterCorrect'); if(mc)mc.onclick=e=>{e.preventDefault();finishMaster('correct');};
  const mh=c.querySelector('.masterHalf'); if(mh)mh.onclick=e=>{e.preventDefault();finishMaster('half');};
  const mw=c.querySelector('.masterWrong'); if(mw)mw.onclick=e=>{e.preventDefault();finishMaster('wrong');};

  function finishJeopardy(kind){
    normalizeKahoopardy(w);
    const qi=w.data.currentQuestion, q=currentKahoopardyQuestion(w), pts=Number(q.points)||100, ti=Math.max(0,Math.min(Number(w.data.currentTeam)||0,w.data.teams.length-1));
    w.data.usedQuestions=w.data.usedQuestions||{};w.data.usedQuestions[qi]=true;
    w.data.awarded=w.data.awarded||{};w.data.awarded[String(qi)]=w.data.awarded[String(qi)]||{};
    const add=kind==='correct'?pts:(kind==='half'?Math.round(pts/2):0);
    if(add&&w.data.teams[ti]&&!w.data.awarded[String(qi)][ti]){
      w.data.teams[ti].score=(Number(w.data.teams[ti].score)||0)+add;
      w.data.teams[ti].correct=(Number(w.data.teams[ti].correct)||0)+(kind==='half'?0.5:1);

      // Rigtigt/halvt svar beholder turen og vælger næste kort.
      w.data.currentTeam=ti;
    }else{
      // Kun forkert svar sender turen videre til næste hold.
      w.data.currentTeam=(ti+1)%Math.max(1,(w.data.teams||[]).length);
      kahoopardyDing();
    }
    w.data.stage='board';w.data.reveal=false;
    rerender();
  }
  const jc=c.querySelector('.jeopardyCorrect'); if(jc)jc.onclick=e=>{e.preventDefault();finishJeopardy('correct');};
  const jh=c.querySelector('.jeopardyHalf'); if(jh)jh.onclick=e=>{e.preventDefault();finishJeopardy('half');};
  const jw=c.querySelector('.jeopardyWrong'); if(jw)jw.onclick=e=>{e.preventDefault();finishJeopardy('wrong');};
}


function kahoopardyActiveWidgetForKeyboard(){
  try{
    if(selected){
      const w=findWidget(selected);
      if(w&&w.type==='kahoopardy')return {w,el:document.querySelector(`.widget[data-id="${selected}"]`)};
    }
    const el=document.querySelector('.widget.selected[data-type="kahoopardy"], .widget[data-type="kahoopardy"].focusTarget, .widget[data-type="kahoopardy"]');
    if(el&&el.dataset&&el.dataset.id){const w=findWidget(el.dataset.id); if(w&&w.type==='kahoopardy')return {w,el};}
  }catch(_e){}
  return null;
}
function kahoopardyKeyOptionIndex(e){
  const k=String(e.key||'');
  const code=String(e.code||'');
  if(/^[1-9]$/.test(k))return Number(k)-1;
  if(k==='0')return 9;
  if(k==='+'||k==='Add'||code==='NumpadAdd')return 9;
  if(/^Numpad[1-9]$/.test(code))return Number(code.replace('Numpad',''))-1;
  if(code==='Numpad0')return 9;
  return -1;
}
function kahoopardyHandleKeyboard(e){
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const hit=kahoopardyActiveWidgetForKeyboard();
  if(!hit||!hit.el||!hit.w)return;
  normalizeKahoopardy(hit.w);
  if(hit.w.data.editing)return;
  const c=hit.el.querySelector('.content.kahoopardy')||hit.el.querySelector('.content');
  if(!c)return;
  const isSpace=(e.key===' '||e.key==='Spacebar'||e.code==='Space');
  const isEnter=(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter');
  const stage=hit.w.data.stage;
  if(stage==='master_answer'||stage==='jeopardy_answer'){
    let btn=null;
    if(e.key==='1'||String(e.key).toLowerCase()==='r')btn=c.querySelector('.masterCorrect,.jeopardyCorrect');
    if(e.key==='2'||String(e.key).toLowerCase()==='h')btn=c.querySelector('.masterHalf,.jeopardyHalf');
    if(e.key==='3'||String(e.key).toLowerCase()==='f')btn=c.querySelector('.masterWrong,.jeopardyWrong');
    if(btn){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();btn.click();return;}
  }
  if(isSpace||isEnter){
    const btn=c.querySelector('.revealAnswer,.continueScore,.nextQuestion,.showJeopardyAnswer,.showMasterAnswer,.jeopardyToScore,.showFinalScore,.playAgain');
    if(btn){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();btn.click();}
    return;
  }
  const idx=kahoopardyKeyOptionIndex(e);
  if(idx>=0){
    const opts=[...c.querySelectorAll('.kahoopardyOption')];
    const btn=opts[idx];
    if(btn){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();btn.click();}
  }
}
document.addEventListener('keydown',kahoopardyHandleKeyboard,true);

document.addEventListener('keydown',function kahoopardyPhase18Keys(e){
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const hit=(typeof kahoopardyActiveWidgetForKeyboard==='function')?kahoopardyActiveWidgetForKeyboard():null;
  if(!hit||!hit.w||!hit.el)return;
  normalizeKahoopardy(hit.w);
  const c=hit.el.querySelector('.content.kahoopardy')||hit.el.querySelector('.content');
  if(!c)return;
  const key=String(e.key||'').toLowerCase();
  function stop(){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
  function switchMode(m){
    hit.w.data.mode=m;
    if(!hit.w.data.editing && hit.w.data.stage!=='score' && hit.w.data.stage!=='done'){
      hit.w.data.stage=kahoopardyStageForMode(m);
      if(m!=='jeopardy' && hit.w.data.usedQuestions && hit.w.data.usedQuestions[hit.w.data.currentQuestion]){
        kahoopardyPrepareNextQuestion(hit.w,hit.w.data.currentQuestion+1);
      }
    }
    renderKahoopardy(hit.el,hit.w);try{save({silent:true})}catch(_e){try{save()}catch(_e2){}}
  }
  if((key==='k'||key==='j'||key==='m') && !e.shiftKey){
    stop();
    // Bevar ufærdige ændringer i redigeringstabellen, før mode-markeringen renderes igen.
    if(hit.w.data.editing){try{hit.w.data.questions=kahoopardyReadTable(c);}catch(_e){}}
    switchMode(key==='j'?'jeopardy':(key==='m'?'master':'kahoot'));
    return;
  }
  if(hit.w.data.editing){
    if(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter'){
      stop();
      const mode=(hit.w.data.mode==='jeopardy'||hit.w.data.mode==='master')?hit.w.data.mode:'kahoot';
      const btn=c.querySelector(`.startQuizMode[data-mode="${mode}"]`)||c.querySelector('.startQuizMode.active')||c.querySelector('.startQuizMode');
      if(btn)btn.click();
    }
    return;
  }
  if(hit.w.data.mode==='jeopardy' && hit.w.data.stage==='board'){
    const cards=[...c.querySelectorAll('.kahoopardyJeopardyCard:not(.used):not(:disabled)')];
    if(!cards.length)return;
    let idx=cards.findIndex(b=>Number(b.dataset.question)===Number(hit.w.data.jeopardyFocus));
    if(idx<0)idx=0;
    if(e.key==='Tab'){
      stop();
      idx=(idx+(e.shiftKey?-1:1)+cards.length)%cards.length;
      hit.w.data.jeopardyFocus=Number(cards[idx].dataset.question);
      renderKahoopardy(hit.el,hit.w);try{save({silent:true})}catch(_e){}
      return;
    }
    if(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter'){
      stop();
      (cards[idx]||cards[0]).click();
      return;
    }
  }
},true);


/* v1.2.45-kahoopardy-phase1.20: Shift+Space cycles judge buttons; Enter chooses focused judge button */
document.addEventListener('keydown',function kahoopardyPhase20JudgeKeys(e){
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const hit=(typeof kahoopardyActiveWidgetForKeyboard==='function')?kahoopardyActiveWidgetForKeyboard():null;
  if(!hit||!hit.w||!hit.el)return;
  normalizeKahoopardy(hit.w);
  if(hit.w.data.editing)return;
  const stage=hit.w.data.stage;
  if(stage!=='master_answer'&&stage!=='jeopardy_answer')return;
  const isSpace=(e.key===' '||e.key==='Spacebar'||e.code==='Space');
  const isEnter=(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter');
  if(!isSpace&&!isEnter)return;
  const c=hit.el.querySelector('.content.kahoopardy')||hit.el.querySelector('.content');
  if(!c)return;
  const buttons=[...c.querySelectorAll('.masterCorrect,.masterHalf,.masterWrong,.jeopardyCorrect,.jeopardyHalf,.jeopardyWrong')];
  if(!buttons.length)return;
  function stop(){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
  let idx=Number(hit.w.data.judgeFocus)||0;
  idx=Math.max(0,Math.min(idx,buttons.length-1));
  if(isSpace&&e.shiftKey){
    stop();
    hit.w.data.judgeFocus=(idx+1)%buttons.length;
    renderKahoopardy(hit.el,hit.w);
    try{save({silent:true})}catch(_e){}
    return;
  }
  if(isEnter){
    stop();
    (buttons[idx]||buttons[0]).click();
    return;
  }
},true);



/* v1.2.45-kahoopardy-phase1.21: edit start mode cycling + ESC blurs editor fields */
document.addEventListener('keydown',function kahoopardyPhase21EditKeys(e){
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  const isTextField=tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable);
  if(isTextField && (e.key==='Escape'||e.code==='Escape')){
    try{e.target.blur();}catch(_e){}
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    return;
  }
  if(isTextField)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const hit=(typeof kahoopardyActiveWidgetForKeyboard==='function')?kahoopardyActiveWidgetForKeyboard():null;
  if(!hit||!hit.w||!hit.el)return;
  normalizeKahoopardy(hit.w);
  if(!hit.w.data.editing)return;
  const c=hit.el.querySelector('.content.kahoopardy')||hit.el.querySelector('.content');
  if(!c)return;
  const isSpace=(e.key===' '||e.key==='Spacebar'||e.code==='Space');
  const isEnter=(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter');
  function stop(){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
  const modes=['kahoot','jeopardy','master'];
  if(isSpace&&e.shiftKey){
    stop();
    // Shift+Space må kun skifte markeret startmode – ikke smide nyligt indtastede rækker væk.
    try{hit.w.data.questions=kahoopardyReadTable(c);}catch(_e){}
    const cur=modes.indexOf(hit.w.data.mode);
    hit.w.data.mode=modes[(cur<0?0:cur+1)%modes.length];
    renderKahoopardy(hit.el,hit.w);
    try{save({silent:true})}catch(_e){try{save()}catch(_e2){}}
    return;
  }
  if(isEnter){
    stop();
    const mode=(hit.w.data.mode==='jeopardy'||hit.w.data.mode==='master')?hit.w.data.mode:'kahoot';
    const btn=c.querySelector(`.startQuizMode[data-mode="${mode}"]`)||c.querySelector('.startQuizMode.active')||c.querySelector('.startQuizMode');
    if(btn)btn.click();
    return;

/*
Widget-oversigt i fillContent():
- text / dataset: teksteditor og datasetvisning. Tjek dataset-parser, CSV/TSV, kolonnevalg og tekstredigering.
- timer: nedtælling/ur. Tjek start/stop/reset, præsentation og lyd hvis relevant.
- wheel / lykkehjul: hjul, listebank og ordsky/opsamling. Følsom for CSS, pointer-events, mellemrum og lyd-unlock.
- groups: gruppeinddeling, hjulvisning, låste grupper og kompakt resultatvisning.
- wordcloud / sky: tekstbaseret ordsky. Deler visuelle cloud-regler med poll/wheel-cloud.
- poll / afstemning: stemmer, resultater og evt. ordskyvisning.
- kahoopardy: følsom quiz-rendering; undgå ændring af template literals/modeknapper uden isoleret test.
- html: lokal HTML-editor/preview. Pas på ikke at indsætte scripts eller patches inde i HTML-widget-templates.
- link / iframe: eksternt link eller indlejret webvisning. Følsom for focus, maximize og pointer-events.
- image: indlejret/lokal billedvisning, download og file://-/GitHub-fallbacks.
- pdf: PDF-visning med browser/pdf.js-fallbacks. Følsom for pointer-events, selection og præsentation.
AI-regel: Ved widgetarbejde ændres først den afgrænsede widgetblok og evt. tilhørende wire-funktion. Undgå globale render/shortcut-patches.
*/

/* SAFE85: Snæver datawidget tabel-editor.
   Kaldes kun fra fillContent() når:
   - w.type==='text'
   - w.data.datasetId findes
   - w.data.datasetView===false
   Den erstatter kun den gamle CSV/tekst-editor for datawidgets. */

/* SAFE90: Gemmer aktuel dataeditor før data→liste.
   Bruges af headerens →-knap, så redigerede headers/celler kommer med i liste-dialogen,
   selv hvis brugeren ikke manuelt har skiftet tilbage til preview. */
function safe90CommitOpenDatasetEditorForWidget(w){
  try{
    if(!w||!w.data||!w.data.datasetId)return null;
    const el=document.querySelector('.widget[data-id="'+CSS.escape(String(w.id))+'"]');
    if(!el)return findDatasetById(w.data.datasetId);
    const editor=el.querySelector('.safe85DatasetEditor');
    if(!editor)return findDatasetById(w.data.datasetId);
    const ds=findDatasetById(w.data.datasetId);
    if(!ds)return null;
    const headers=Array.from(editor.querySelectorAll('[data-safe85-head]')).map(inp=>safe87DecodeCell(inp.value||''));
    if(headers.length)ds.columns=headers;
    const cells=Array.from(editor.querySelectorAll('[data-safe85-cell]'));
    let maxRow=-1,maxCol=-1;
    cells.forEach(inp=>{
      const parts=String(inp.getAttribute('data-safe85-cell')||'').split(':').map(Number);
      if(Number.isFinite(parts[0]))maxRow=Math.max(maxRow,parts[0]);
      if(Number.isFinite(parts[1]))maxCol=Math.max(maxCol,parts[1]);
    });
    const colCount=Math.max(ds.columns.length,maxCol+1,1);
    while(ds.columns.length<colCount)ds.columns.push('Kolonne '+(ds.columns.length+1));
    const rows=Array.from({length:Math.max(maxRow+1,1)},()=>Array.from({length:colCount},()=> ''));
    cells.forEach(inp=>{
      const parts=String(inp.getAttribute('data-safe85-cell')||'').split(':').map(Number);
      const ri=parts[0],ci=parts[1];
      if(Number.isFinite(ri)&&Number.isFinite(ci)&&rows[ri])rows[ri][ci]=safe87DecodeCell(inp.value||'');
    });
    ds.rows=rows;
    updateDatasetInState(ds);
    try{w.data.text=datasetToDelimitedText(ds,'\t')}catch(_e){}
    save();
    return ds;
  }catch(err){
    try{console.warn('SAFE90 commit editor before data→liste failed',err)}catch(_e){}
    try{return w&&w.data&&w.data.datasetId?findDatasetById(w.data.datasetId):null}catch(_e){return null}
  }
}

/* SAFE90: Regnearksagtig navigation i dataeditoren.
   Tab/Shift+Tab: næste/forrige celle.
   Enter/Shift+Enter: ned/op i samme kolonne.
   Piletaster: flyt mellem celler, når markøren står ved kant eller feltet ikke er tekstmarkeret.
*/
function safe90MoveDatasetFocus(current,deltaRow,deltaCol){
  const editor=current&&current.closest?current.closest('.safe85DatasetEditor'):null;
  if(!editor)return false;
  const key=current.getAttribute('data-safe85-cell');
  const head=current.getAttribute('data-safe85-head');
  let row,col,isHead=false;
  if(head!=null){row=-1;col=Number(head);isHead=true;}
  else if(key){const p=String(key).split(':').map(Number);row=p[0];col=p[1];}
  else return false;
  let nr=row+deltaRow,nc=col+deltaCol;
  const heads=Array.from(editor.querySelectorAll('[data-safe85-head]'));
  const cells=Array.from(editor.querySelectorAll('[data-safe85-cell]'));
  const maxCol=Math.max(heads.length-1,0);
  const maxRow=cells.reduce((m,inp)=>Math.max(m,Number(String(inp.getAttribute('data-safe85-cell')).split(':')[0])),0);
  if(nc<0){nc=maxCol;nr--;}
  if(nc>maxCol){nc=0;nr++;}
  if(nr<-1)nr=maxRow;
  if(nr>maxRow)nr=-1;
  let target=null;
  if(nr<0)target=editor.querySelector('[data-safe85-head="'+nc+'"]');
  else target=editor.querySelector('[data-safe85-cell="'+nr+':'+nc+'"]');
  if(target){
    target.focus();
    try{target.select()}catch(_e){}
    try{target.classList.add('safe90CellActive');setTimeout(()=>target.classList.remove('safe90CellActive'),500)}catch(_e){}
    try{target.scrollIntoView({block:'nearest',inline:'nearest'})}catch(_e){}
    return true;
  }
  return false;
}
function safe85RenderDatasetTableEditor(el,w,ds){
  const c=el.querySelector('.content');
